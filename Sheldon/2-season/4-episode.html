    <script>
        (function () {
            var glossary = window.SHELDON_GLOSSARY || {};
            function getTranslation(word) {
                var key = word.toLowerCase().replace(/['']/g, "'");
                var clean = key.replace(/[^a-z]/g, '');
                return glossary[key] || glossary[clean] || '';
            }
            function wrapWord(w) {
                if (!/^[\w']+$/i.test(w)) return document.createTextNode(w);
                var span = document.createElement('span');
                span.className = 'word';
                span.textContent = w;
                var t = getTranslation(w);
                if (t) span.title = t;
                return span;
            }
            function renderLine(text) {
                var div = document.createElement('div');
                var re = /[\w']+|[^\w\s]/g;
                var m;
                var lastIndex = 0;
                while ((m = re.exec(text)) !== null) {
                    if (m.index > lastIndex) div.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
                    div.appendChild(wrapWord(m[0]));
                    lastIndex = m.index + m[0].length;
                }
                if (lastIndex < text.length) div.appendChild(document.createTextNode(text.slice(lastIndex)));
                return div;
            }
            var data = window.S02E04_FULL;
            var container = document.getElementById('subtitles');
            var meta = document.getElementById('meta-count');
            if (data && data.entries && data.entries.length) {
                meta.textContent = data.entries.length + ' реплик · ' + data.title;
                data.entries.forEach(function (entry) {
                    var block = document.createElement('div');
                    block.className = 'subtitle-block';
                    if (entry.start) {
                        var timeDiv = document.createElement('div');
                        timeDiv.className = 'subtitle-time';
                        timeDiv.textContent = entry.start.replace(',', '.');
                        block.appendChild(timeDiv);
                    }
                    var textDiv = document.createElement('div');
                    textDiv.className = 'subtitle-text';
                    textDiv.appendChild(renderLine(entry.text));
                    block.appendChild(textDiv);
                    if (entry.textRu) {
                        var ruDiv = document.createElement('div');
                        ruDiv.className = 'subtitle-ru';
                        ruDiv.textContent = entry.textRu;
                        block.appendChild(ruDiv);
                    }
                    container.appendChild(block);
                });
            } else {
                container.innerHTML = '<p>Нет данных субтитров.</p>';
            }
        })();
