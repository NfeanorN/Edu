    const OPEN_ITEMS = [{"title_en": "Open question 15 (5 points)", "title_ru": "Открытый вопрос 15 (5 баллов)", "ru": "i) Опишите концепцию network externalities. ii) Объясните, как эта концепция связана с цифровыми платформами и бизнес-моделями Value Network.", "en": "Describe the concept of network externalities, and explain how this concept connects to digital platforms and Value Network business models.", "sample_en": "Network externalities mean a product or platform becomes more valuable as more people use it (e.g. messaging apps, social networks, marketplaces).\n\nDigital platforms grow faster when they already have a large user base (winner-takes-all effect). This links to the Value Network model, where value comes from connections between users, not only from selling one product.", "sample_ru": "Network externalities (сетевые внешние эффекты) — чем больше людей пользуется продуктом или платформой, тем ценнее он становится для каждого пользователя. Пример: мессенджер, соцсеть, маркетплейс.\n\nСвязь с цифровыми платформами: платформы растут быстрее, когда уже есть большая база пользователей (эффект «победитель получает всё»). Это близко к Value Network — модель, где ценность создаётся связями между пользователями, а не только продажей одного товара."}, {"title_en": "Practice — Rogers diffusion & pricing", "title_ru": "Практика — Rogers и ценообразование", "en": "Using Rogers' theory of innovation diffusion, explain why launching a ChatGPT-like product only as a $20/month Pro plan would slow adoption compared to starting with a free tier.", "ru": "Используя теорию диффузии инноваций Rogers, объясните, почему запуск ChatGPT-подобного продукта сразу только как Pro за $20/мес замедлит adoption по сравнению с бесплатным тарифом.", "sample_en": "According to Rogers, diffusion depends on relative advantage, trialability, complexity, observability, and social spread through adopter categories. A ChatGPT-like product launched straight as a $20 Pro plan blocks trialability and observability, hides relative advantage, keeps diffusion stuck among innovators, and prevents word-of-mouth from reaching the early majority. A free version lowers the barrier, lets users try the product and see its value, and kick-starts social communication — only then does a paid Pro tier make sense for users who are already convinced.\n\nIn short: free = \"try it and tell others\"; $20 upfront = \"pay without knowing why\" → diffusion does not take off.", "sample_ru": "По Rogers диффузия зависит от относительного преимущества, возможности попробовать (trialability), сложности, наблюдаемости результата и социального распространения через категории adopters.\n\nТолько Pro за $20 сразу: нельзя попробовать, не видно выгоды, diffusion застревает у innovators, word-of-mouth не доходит до early majority.\n\nБесплатная версия: низкий порог входа, пользователи пробуют и видят ценность, начинается социальная коммуникация — потом Pro логичен для тех, кто уже убеждён.\n\nКоротко: free = «попробуй и расскажи другим»; $20 сразу = «плати, не зная зачем» → diffusion не взлетает."}];

      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span>
                  <div class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</div>
                  <div class="opt-ru">${o.ru}</div>
                </span>
              </label>`).join('')}
          </div>
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'Open questions';
      container.appendChild(h);
      OPEN_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-num">${item.title_en || item.title_ru}</div>
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <div class="brief-answer"><div class="brief-label">Sample answer (EN)</div><div class="brief-text"></div></div>
          <textarea name="open_${idx}" placeholder="Your answer..."></textarea>`;
        const brief = block.querySelector('.brief-text');
        const sampleRu = item.sample_en && item.sample_ru ? '\n\n—\n\n' + item.sample_ru : '';
        brief.textContent = (item.sample_en || item.sample_ru || '') + sampleRu;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — calculations';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let unanswered = 0;
      let correct = 0;
      let wrong = 0;
      const warnEl = document.getElementById('warn-text');

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Ответьте на все вопросы с вариантами (${unanswered} без ответа).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Ответ не выбран. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.textContent = '✓ Верно';
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Ваш ответ: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

      container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Пустой ответ. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.textContent = '✓ Верно';
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Результат: ${correct} из ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Баллы: ${score.toFixed(1)} · Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`
          : `Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
