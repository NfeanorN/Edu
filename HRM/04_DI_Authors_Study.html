<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Innovation — Authors Study</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 2rem 1rem 3rem;
      color: #1a1a2e;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    .back { margin-bottom: 1rem; }
    .back a { color: #7b4397; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    h1 {
      color: #2c3e50;
      border-bottom: 4px solid #7b4397;
      padding-bottom: 12px;
      font-size: 1.75rem;
    }
    .sub { color: #555; margin: 0.5rem 0 1rem; }
    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 1rem 0 1.25rem;
    }
    .tab {
      background: #fff;
      border: 2px solid #e0e6ed;
      color: #2c3e50;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .tab.active { border-color: #7b4397; background: #f8f5fc; color: #7b4397; }
    .panel { display: none; }
    .panel.active { display: block; }
    .group-title {
      font-size: 1rem;
      color: #7b4397;
      font-weight: 600;
      margin: 1.5rem 0 0.75rem;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1rem 1.15rem;
      margin: 0.65rem 0;
      border: 1px solid #e8ecf1;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card-head { font-weight: 700; color: #2c3e50; font-size: 1.05rem; }
    .card-idea { margin: 0.4rem 0; font-size: 0.98rem; }
    .card-terms { font-size: 0.88rem; color: #7b4397; margin: 0.25rem 0; }
    .card-findings { font-size: 0.9rem; color: #444; }
    .card-ru {
      margin-top: 0.55rem;
      padding: 0.5rem 0.65rem;
      background: #e8f8ef;
      border-radius: 6px;
      border-left: 3px solid #27ae60;
      font-size: 0.9rem;
    }
    .flash {
      perspective: 1000px;
      cursor: pointer;
      min-height: 140px;
    }
    .flash-inner {
      position: relative;
      width: 100%;
      min-height: 140px;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }
    .flash.flipped .flash-inner { transform: rotateY(180deg); }
    .flash-front, .flash-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      background: #fff;
      border: 2px solid #7b4397;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .flash-back { transform: rotateY(180deg); background: #f8f5fc; }
    .flash-hint { font-size: 0.8rem; color: #888; margin-top: 0.5rem; }
    .flash-nav {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    button {
      background: #7b4397;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #6a3784; }
    button.secondary {
      background: #fff;
      color: #7b4397;
      border: 2px solid #7b4397;
    }
    .progress { text-align: center; color: #666; font-size: 0.9rem; }
    table.authors {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    table.authors th, table.authors td {
      border: 1px solid #e8ecf1;
      padding: 0.5rem 0.55rem;
      vertical-align: top;
      text-align: left;
    }
    table.authors th { background: #7b4397; color: #fff; }
    table.authors tr:nth-child(even) { background: #fafbfc; }
    .table-wrap { overflow-x: auto; }
    .q {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      border: 1px solid #e8ecf1;
    }
    .q.correct { border-color: #27ae60; background: #f6fff9; }
    .q.wrong { border-color: #e74c3c; background: #fff8f8; }
    .q-en { font-size: 1.02rem; margin-bottom: 0.35rem; }
    .q-ru { font-size: 0.88rem; color: #666; font-style: italic; margin-bottom: 0.75rem; }
    label.opt {
      display: block;
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      margin: 0.2rem 0;
    }
    label.opt:hover { background: #f3f0f7; }
    .feedback { margin-top: 0.65rem; font-size: 0.92rem; padding: 0.5rem 0.65rem; border-radius: 6px; }
    .feedback.ok { background: #e8f8ef; color: #1e7e45; }
    .feedback.bad { background: #fdecea; color: #c0392b; }
    #quiz-score { margin-top: 1rem; font-weight: 600; }
    .search {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="index.html">← HRM tests</a> · <a href="03_Digital_Innovation_Exam_CFU6.html">Exam CFU 6</a> · <a href="07_DI_Exam_PDF_Exact.html">PDF exact</a> · <a href="05_DI_Practice_Mega.html">Practice</a></p>
    <h1>Digital Innovation — Authors</h1>
    <p class="sub">20 authors from the course table · English first · Russian memory hooks · flashcards + quiz</p>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="cards">Flashcards</button>
      <button type="button" class="tab" data-tab="table">Table</button>
      <button type="button" class="tab" data-tab="quiz">Quiz (20)</button>
    </div>

    <div id="panel-cards" class="panel active">
      <p class="progress" id="flash-progress"></p>
      <div class="flash" id="flash-card">
        <div class="flash-inner">
          <div class="flash-front">
            <div class="card-head" id="flash-author"></div>
            <div class="flash-hint">Tap or click to reveal</div>
          </div>
          <div class="flash-back">
            <div class="card-idea" id="flash-idea"></div>
            <div class="card-terms" id="flash-terms"></div>
            <div class="card-ru" id="flash-ru"></div>
          </div>
        </div>
      </div>
      <div class="flash-nav">
        <button type="button" class="secondary" id="flash-prev">← Prev</button>
        <button type="button" id="flash-flip">Flip</button>
        <button type="button" class="secondary" id="flash-next">Next →</button>
        <button type="button" class="secondary" id="flash-shuffle">Shuffle</button>
      </div>
    </div>

    <div id="panel-table" class="panel">
      <input type="search" class="search" id="search" placeholder="Search author, term, idea…" />
      <div class="table-wrap">
        <table class="authors">
          <thead>
            <tr>
              <th>Author</th>
              <th>Main idea</th>
              <th>Key terms</th>
              <th>Memory (RU)</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="panel-quiz" class="panel">
      <p class="sub">Who is the author? One question per author.</p>
      <div id="quiz-root"></div>
      <button type="button" id="quiz-check" style="margin-top:0.5rem">Check answers</button>
      <button type="button" class="secondary" id="quiz-reset" style="margin-top:0.5rem">Reset</button>
      <div id="quiz-score"></div>
    </div>
  </div>

  <script>
    const AUTHORS = [
      { group: "Digital life", author: "Floridi (2015)", idea: "Digital technologies merged online and offline life.", terms: "Onlife, infosphere", findings: "Digital reality is embedded into everyday life.", ru: "Онлайн и оффлайн объединились в одну цифровую реальность." },
      { group: "BPM", author: "Dumas et al. (2018)", idea: "Organizations improve through BPM.", terms: "BPM, process redesign", findings: "Processes must be continuously optimized.", ru: "Компании улучшаются через оптимизацию процессов." },
      { group: "BPM", author: "Vom Brocke & Schmiedel (2011)", idea: "BPM success depends on culture.", terms: "Process-oriented culture", findings: "People determine BPM success.", ru: "Без правильной культуры процессы не работают." },
      { group: "AI", author: "Dell'Acqua et al. (2023/2026)", idea: "AI improves productivity and levels performance.", terms: "Generative AI, productivity", findings: "AI helps weaker performers improve.", ru: "AI помогает слабым сотрудникам работать лучше." },
      { group: "AI", author: "Crowston & Bolici (2025)", idea: "AI changes organizational coordination.", terms: "Coordination, AI systems", findings: "AI becomes part of workflows.", ru: "AI меняет координацию работы." },
      { group: "AI", author: "Handa et al. (2025)", idea: "AI has limitations and risks.", terms: "Hallucinations, trust", findings: "Human oversight remains necessary.", ru: "AI нельзя полностью доверять." },
      { group: "AI / HCI", author: "Crowston & Bolici (2019)", idea: "Usability shapes technology adoption.", terms: "HCI, usability", findings: "Good interaction increases adoption.", ru: "Удобные системы люди принимают легче." },
      { group: "AI", author: "Dellermann et al. (2019)", idea: "Humans and AI complement each other.", terms: "Hybrid Intelligence", findings: "Human + AI collaboration improves outcomes.", ru: "Лучшие результаты — работа человека и AI вместе." },
      { group: "Blockchain", author: "Nakamoto (2008)", idea: "Bitcoin enables decentralized digital transactions.", terms: "Blockchain, Bitcoin", findings: "Trust created through cryptography.", ru: "Блокчейн заменяет доверие к банкам." },
      { group: "Blockchain", author: "Zheng et al. (2018)", idea: "Blockchain creates secure distributed systems.", terms: "Distributed ledger", findings: "Blockchain supports transparent coordination.", ru: "Блокчейн создаёт прозрачную систему." },
      { group: "AI", author: "Varone et al. (2025)", idea: "AI changes skill development.", terms: "Deskilling, leveling effect", findings: "AI boosts performance but may weaken expertise.", ru: "AI ускоряет работу, но может ослаблять навыки." },
      { group: "Value models", author: "Stabell & Fjeldstad (1998)", idea: "Organizations create value differently.", terms: "Value Chain, Shop, Network", findings: "Different business logics create value differently.", ru: "Компании создают ценность разными способами." },
      { group: "Value models", author: "Fjeldstad & Snow (2018)", idea: "Organizations increasingly act as ecosystems.", terms: "Ecosystems, networks", findings: "Firms move from hierarchies to networks.", ru: "Современные фирмы становятся экосистемами." },
      { group: "Business models", author: "Osterwalder & Pigneur", idea: "BMC visualizes business logic.", terms: "Business Model Canvas", findings: "Business models must adapt dynamically.", ru: "BMC помогает понять бизнес-модель." },
      { group: "Industry", author: "Leng et al. (2022)", idea: "Industry 5.0 is human-centered.", terms: "Industry 5.0", findings: "Humans collaborate with intelligent systems.", ru: "Будущее — сотрудничество человека и технологий." },
      { group: "Adoption", author: "Rogers (1983)", idea: "Innovations spread socially.", terms: "Diffusion of Innovation", findings: "Adoption depends on social perception.", ru: "Технологии распространяются через влияние людей." },
      { group: "Adoption", author: "Davis (1981)", idea: "Technology acceptance depends on usefulness and ease.", terms: "TAM, PU, PEOU", findings: "Users adopt useful and easy systems.", ru: "Люди используют полезные и удобные технологии." },
      { group: "Adoption", author: "Venkatesh et al. (2003)", idea: "Social and organizational factors shape adoption.", terms: "UTAUT", findings: "Technology acceptance is social.", ru: "На принятие технологий влияет окружение." },
      { group: "Platforms", author: "Parker (2016)", idea: "Platforms enable interactions.", terms: "Platforms, ecosystems", findings: "Platforms orchestrate value creation.", ru: "Платформы создают ценность через взаимодействия." },
      { group: "Platforms", author: "Van Alstyne et al. (2016)", idea: "Platforms grow through network effects.", terms: "Network effects", findings: "More users create more value.", ru: "Чем больше пользователей — тем сильнее платформа." },
    ];

  // --- Flashcards ---
    let flashOrder = AUTHORS.map((_, i) => i);
    let flashIdx = 0;
    let flipped = false;

    function showFlash() {
      const a = AUTHORS[flashOrder[flashIdx]];
      document.getElementById('flash-author').textContent = a.author;
      document.getElementById('flash-idea').textContent = a.idea;
      document.getElementById('flash-terms').textContent = 'Terms: ' + a.terms;
      document.getElementById('flash-ru').textContent = '🇷🇺 ' + a.ru;
      document.getElementById('flash-progress').textContent =
        `Card ${flashIdx + 1} / ${AUTHORS.length} · ${a.group}`;
      const el = document.getElementById('flash-card');
      el.classList.remove('flipped');
      flipped = false;
    }

    function toggleFlip() {
      flipped = !flipped;
      document.getElementById('flash-card').classList.toggle('flipped', flipped);
    }

    document.getElementById('flash-card').addEventListener('click', toggleFlip);
    document.getElementById('flash-flip').addEventListener('click', toggleFlip);
    document.getElementById('flash-prev').addEventListener('click', () => {
      flashIdx = (flashIdx - 1 + AUTHORS.length) % AUTHORS.length;
      showFlash();
    });
    document.getElementById('flash-next').addEventListener('click', () => {
      flashIdx = (flashIdx + 1) % AUTHORS.length;
      showFlash();
    });
    document.getElementById('flash-shuffle').addEventListener('click', () => {
      for (let i = flashOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashOrder[i], flashOrder[j]] = [flashOrder[j], flashOrder[i]];
      }
      flashIdx = 0;
      showFlash();
    });
    showFlash();

  // --- Table ---
    function renderTable(filter = '') {
      const q = filter.trim().toLowerCase();
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      AUTHORS.filter(a => {
        if (!q) return true;
        const blob = [a.author, a.idea, a.terms, a.findings, a.ru, a.group].join(' ').toLowerCase();
        return blob.includes(q);
      }).forEach(a => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><strong>${a.author}</strong><br><span style="color:#888;font-size:0.78rem">${a.group}</span></td><td>${a.idea}<br><span style="color:#666;font-size:0.8rem">${a.findings}</span></td><td>${a.terms}</td><td>${a.ru}</td>`;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('search').addEventListener('input', e => renderTable(e.target.value));
    renderTable();

  // --- Cards list (optional grouped view in table tab we have table; add grouped cards in cards? skip)

  // --- Quiz ---
    const quizData = AUTHORS.map((a, i) => {
      const others = AUTHORS.filter((_, j) => j !== i);
      const distractors = [];
      while (distractors.length < 3) {
        const pick = others[Math.floor(Math.random() * others.length)].author;
        if (!distractors.includes(pick)) distractors.push(pick);
      }
      const options = [a.author, ...distractors].sort(() => Math.random() - 0.5);
      return {
        id: 'aq' + i,
        en: `Main idea: «${a.idea}»`,
        ru: `Ключевые термины: ${a.terms}`,
        correct: a.author,
        options,
        memory: a.ru,
      };
    });

    function renderQuiz() {
      const root = document.getElementById('quiz-root');
      root.innerHTML = '';
      quizData.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'q';
        div.dataset.id = q.id;
        div.innerHTML = `
          <div style="font-weight:700;color:#7b4397;margin-bottom:0.35rem">Q${idx + 1}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          ${q.options.map(o => `
            <label class="opt"><input type="radio" name="${q.id}" value="${o.replace(/"/g, '&quot;')}" /> ${o}</label>
          `).join('')}
          <div class="feedback" hidden></div>`;
        root.appendChild(div);
      });
      document.getElementById('quiz-score').textContent = '';
    }

    document.getElementById('quiz-check').addEventListener('click', () => {
      let ok = 0;
      quizData.forEach(q => {
        const card = document.querySelector(`[data-id="${q.id}"]`);
        const sel = document.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('correct', 'wrong');
        if (!sel) {
          fb.className = 'feedback bad';
          fb.textContent = `No answer. Correct: ${q.correct} — ${q.memory}`;
          return;
        }
        if (sel.value === q.correct) {
          ok++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.textContent = `✓ Correct · ${q.memory}`;
        } else {
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.textContent = `✗ ${q.correct} · ${q.memory}`;
        }
      });
      document.getElementById('quiz-score').textContent = `Score: ${ok} / ${quizData.length}`;
    });
    document.getElementById('quiz-reset').addEventListener('click', () => {
      quizData.forEach((q, i) => {
        const others = AUTHORS.filter((_, j) => j !== i);
        const distractors = [];
        while (distractors.length < 3) {
          const pick = others[Math.floor(Math.random() * others.length)].author;
          if (!distractors.includes(pick)) distractors.push(pick);
        }
        q.options = [q.correct, ...distractors].sort(() => Math.random() - 0.5);
      });
      renderQuiz();
    });
    renderQuiz();

  // --- Tabs ---
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });
  </script>
</body>
</html>
