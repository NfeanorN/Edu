  <script>
    const SCORING = {"correct": 1, "wrong": 0, "max": null};
    const QUESTIONS = [{"num":"Variant 01 · Q1","id":"v01_mcq1","en":"Positioning is:","ru":"Позиционирование (positioning) — это:","options":[{"id":"a","en":"a process in which a Company seeks to fix the product price","ru":"процесс фиксации цены продукта"},{"id":"b","en":"a process in which a Company seeks to establish perceptions of its product offering that are consistent with customers' needs and preferences","ru":"процесс формирования восприятия предложения в соответствии с потребностями клиентов"},{"id":"c","en":"a process in which a Company seeks to establish perceptions explaining the price and the quality of the product","ru":"процесс объяснения цены и качества продукта"}],"correct":"b","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q2","id":"v01_mcq2","en":"Place Marketing is:","ru":"Place Marketing — это:","options":[{"id":"a","en":"Company marketing applied on the territories","ru":"корпоративный маркетинг, применённый к территориям"},{"id":"b","en":"The strategy of the Place","ru":"стратегия места"},{"id":"c","en":"The activity, set of institutions and processes for creating, communicating, delivering and exchanging offerings of the place that have value for place stakeholders (target markets) and its community at large","ru":"деятельность и процессы создания, коммуникации и обмена ценностными предложениями места для стейкхолдеров и сообщества"}],"correct":"c","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 02 · Q1","id":"v02_mcq1","en":"__________ is about matching market opportunities to the organization's resources (what it can do) and objectives (what management wants to do).","ru":"__________ — это согласование рыночных возможностей с ресурсами организации и её целями.","options":[{"id":"a","en":"Marketing communications","ru":"Маркетинговые коммуникации"},{"id":"b","en":"Market research","ru":"Исследование рынка"},{"id":"c","en":"Marketing strategy","ru":"Маркетинговая стратегия"},{"id":"d","en":"Market segmentation","ru":"Сегментация рынка"}],"correct":"c","section":"Variant 02 — Part I (MCQ)"},{"num":"Variant 02 · Q2","id":"v02_mcq2","en":"The standardization of the offering is:","ru":"Стандартизация предложения (offering) — это:","options":[{"id":"a","en":"the solution to \"sell\" your Place in the world","ru":"решение «продать» место в мире"},{"id":"b","en":"the solution to \"sell\" your Place in your Country","ru":"решение «продать» место в стране"},{"id":"c","en":"could be a solution in some situations","ru":"может быть решением в некоторых ситуациях"}],"correct":"c","section":"Variant 02 — Part I (MCQ)","explain_ru":"Стандартизация не универсальное решение — зависит от целевого рынка и позиционирования."},{"num":"Variant 03 · Q1","id":"v03_mcq1","en":"A market orientation recognizes that:","ru":"Рыночная ориентация признаёт, что:","options":[{"id":"a","en":"price is the most important variable for customers","ru":"цена — главная переменная для клиентов"},{"id":"b","en":"market intelligence relating to current and future customer needs is important","ru":"важна рыночная информация о текущих и будущих потребностях"},{"id":"c","en":"selling and marketing are essentially the same thing","ru":"продажи и маркетинг — одно и то же"},{"id":"d","en":"sales depend predominantly on an aggressive sales force","ru":"продажи зависят от агрессивного отдела продаж"}],"correct":"b","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q2","id":"v03_mcq2","en":"Place marketing analysis elements:","ru":"Элементы анализа place marketing:","options":[{"id":"a","en":"Place identification, Swot analysis, Positioning, Strategy","ru":"Идентификация места, SWOT, позиционирование, стратегия"},{"id":"b","en":"Place identification, Place reputation analysis, Marketing Mix, control","ru":"Идентификация, репутация, marketing mix, контроль"},{"id":"c","en":"Place identification, Place reputation analysis, Assets analysis, Driver analysis, Swot analysis, Positioning, segmentation and targeting of the Place","ru":"Идентификация, репутация, активы, драйверы, SWOT, позиционирование, сегментация и таргетинг"}],"correct":"c","section":"Variant 03 — Part I (MCQ)","explain_ru":"Полный цикл анализа включает активы, драйверы, репутацию, SWOT и STP."},{"num":"Variant 04 · Q1","id":"v04_mcq1","en":"Which of the following is not an element of the marketing mix?","ru":"Что НЕ является элементом marketing mix?","options":[{"id":"a","en":"Distribution","ru":"Distribution (место/дистрибуция)"},{"id":"b","en":"Product","ru":"Product"},{"id":"c","en":"Target market","ru":"Target market (целевой рынок)"},{"id":"d","en":"Pricing","ru":"Pricing"}],"correct":"c","section":"Variant 04 — Part I (MCQ)","explain_ru":"Target market — результат STP, не элемент 4P."},{"num":"Variant 04 · Q2","id":"v04_mcq2","en":"Place marketing analysis elements:","ru":"Элементы анализа place marketing:","options":[{"id":"a","en":"Place identification, Swot analysis, Positioning, Strategy","ru":"Идентификация места, SWOT, позиционирование, стратегия"},{"id":"b","en":"Place identification, Place reputation analysis, Marketing Mix, control","ru":"Идентификация, репутация, marketing mix, контроль"},{"id":"c","en":"Place identification, Place reputation analysis, Assets analysis, Driver analysis, Swot analysis, Positioning, segmentation and targeting of the Place","ru":"Идентификация, репутация, активы, драйверы, SWOT, позиционирование, сегментация и таргетинг"}],"correct":"c","section":"Variant 04 — Part I (MCQ)","explain_ru":"Полный цикл анализа включает активы, драйверы, репутацию, SWOT и STP."},{"num":"Variant 05 · Q1","id":"v05_mcq1","en":"Four competing philosophies strongly influence the role of marketing and marketing activities within an organization. Which of the following is not a component of market orientation?","ru":"Что НЕ является компонентом market orientation?","options":[{"id":"a","en":"Customer orientation.","ru":"Customer orientation"},{"id":"b","en":"Profitability orientation.","ru":"Profitability orientation"},{"id":"c","en":"Marketing orientation.","ru":"Marketing orientation"},{"id":"d","en":"Competitor orientation.","ru":"Competitor orientation"}],"correct":"b","section":"Variant 05 — Part I (MCQ)","explain_ru":"Market orientation: customer, competitor, interfunctional coordination — не «profitability orientation» как отдельный компонент."},{"num":"Variant 05 · Q2","id":"v05_mcq2","en":"Which one is right:","ru":"Какое утверждение верно:","options":[{"id":"a","en":"The territory emerges as a place through the perception of an observer and the emergent characteristics of the place, which interact with each other.","ru":"Территория становится местом через восприятие наблюдателя и эмерджентные характеристики места"},{"id":"b","en":"The territory is a place with specific features interacting with each other.","ru":"Территория — это место с взаимодействующими характеристиками"},{"id":"c","en":"The territory emerges as a place through the efforts of a strong government body and by the stakeholders investments.","ru":"Место возникает только через усилия власти и инвестиции стейкхолдеров"}],"correct":"a","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 07 · Q1","id":"v07_mcq1","en":"In relationship marketing firms focus on __________ relationships with __________","ru":"В relationship marketing фирмы фокусируются на __________ отношениях с __________","options":[{"id":"a","en":"short-term; customers and suppliers","ru":"краткосрочных; клиентами и поставщиками"},{"id":"b","en":"long-term; customers and suppliers","ru":"долгосрочных; клиентами и поставщиками"},{"id":"c","en":"short-term; customers","ru":"краткосрочных; клиентами"},{"id":"d","en":"long-term; customers","ru":"долгосрочных; клиентами"}],"correct":"b","section":"Variant 07 — Part I (MCQ)"},{"num":"Variant 07 · Q2","id":"v07_mcq2","en":"It is the sum of beliefs, ideas, impressions that people have of a brand or a place","ru":"Это сумма убеждений, идей и впечатлений о бренде или месте","options":[{"id":"a","en":"we are talking about identity","ru":"речь об identity (идентичности)"},{"id":"b","en":"we are talking about image","ru":"речь об image (имидже)"},{"id":"c","en":"we are talking about positioning","ru":"речь о positioning"}],"correct":"b","section":"Variant 07 — Part I (MCQ)","explain_ru":"Image — восприятие аудитории; identity — то, что место о себе заявляет."},{"num":"Variant 08 · Q1","id":"v08_mcq1","en":"__________ is about matching market opportunities to the organization's resources (what it can do) and objectives (what management wants to do).","ru":"__________ — это согласование рыночных возможностей с ресурсами организации и её целями.","options":[{"id":"a","en":"Marketing communications","ru":"Маркетинговые коммуникации"},{"id":"b","en":"Market research","ru":"Исследование рынка"},{"id":"c","en":"Marketing strategy","ru":"Маркетинговая стратегия"},{"id":"d","en":"Market segmentation","ru":"Сегментация рынка"}],"correct":"c","section":"Variant 08 — Part I (MCQ)"},{"num":"Variant 08 · Q2","id":"v08_mcq2","en":"The standardization of the offering is:","ru":"Стандартизация предложения (offering) — это:","options":[{"id":"a","en":"the solution to \"sell\" your Place in the world","ru":"решение «продать» место в мире"},{"id":"b","en":"the solution to \"sell\" your Place in your Country","ru":"решение «продать» место в стране"},{"id":"c","en":"could be a solution in some situations","ru":"может быть решением в некоторых ситуациях"}],"correct":"c","section":"Variant 08 — Part I (MCQ)","explain_ru":"Стандартизация не универсальное решение — зависит от целевого рынка и позиционирования."},{"num":"Variant 09 · Q10","id":"v09_mcq1","en":"In place marketing, the 'Place' element of the marketing mix refers to:","ru":"В place marketing элемент «Place» в marketing mix — это:","options":[{"id":"a","en":"The positioning of a website in global search engines.","ru":"Позиционирование сайта в поисковиках"},{"id":"b","en":"The spatial context in which it is possible to enjoy the value proposition.","ru":"Пространственный контекст, где можно получить value proposition"},{"id":"c","en":"The way shops are organized in the city.","ru":"Как организованы магазины в городе"},{"id":"d","en":"The urban organization of TCM.","ru":"Городская организация TCM"}],"correct":"b","section":"Variant 09 — Part I (MCQ)","explain_ru":"Place = доступ и пространство, где пользователь получает ценность места (distribution)."},{"num":"Variant 09 · Q11","id":"v09_mcq2","en":"Caroli's first strategy (1999) foresees:","ru":"Первая стратегия Caroli (1999) предполагает:","options":[{"id":"a","en":"The abandonment of the current vocation to attract new industrial sectors.","ru":"Отказ от текущей vocation ради новых отраслей"},{"id":"b","en":"The optimization of existing resources by reinforcing the current territorial vocation.","ru":"Оптимизацию ресурсов через усиление текущей территориальной vocation"},{"id":"c","en":"The sale of natural resources to finance local public debt.","ru":"Продажу природных ресурсов для погашения долга"},{"id":"d","en":"Encouraging citizens to carry on their traditions.","ru":"Сохранение традиций гражданами"}],"correct":"b","section":"Variant 09 — Part I (MCQ)","explain_ru":"Стратегия 1 Caroli: не ломать specialization, а усилить существующую vocation территории."},{"num":"Variant 09 · Q12","id":"v09_mcq3","en":"\"Friction between actors\" occurs when:","ru":"«Friction between actors» возникает, когда:","options":[{"id":"a","en":"Individual goals are in strong conflict with the ultimate purpose of the place-system.","ru":"Личные цели конфликтуют с общей целью place-system"},{"id":"b","en":"Two people actively participate in living labs.","ru":"Двое активно участвуют в living labs"},{"id":"c","en":"Living labs do not work.","ru":"Living labs не работают"},{"id":"d","en":"Tourists and residents have the same interests.","ru":"У туристов и жителей одинаковые интересы"}],"correct":"a","section":"Variant 09 — Part I (MCQ)","explain_ru":"Трение — когда цели актора идут против общей цели системы места."},{"num":"Variant 09 · Q13","id":"v09_mcq4","en":"According to the Viable Systems Approach (VSA), a system is \"viable\" if:","ru":"По VSA (Viable Systems Approach) система «viable», если:","options":[{"id":"a","en":"It possesses a high endowment of tangible resources.","ru":"Много материальных ресурсов"},{"id":"b","en":"It is isolated from global market dynamics to preserve its identity.","ru":"Изолирована от глобального рынка"},{"id":"c","en":"It is capable of surviving over time by adapting to changes in the context and environment.","ru":"Может выживать, адаптируясь к изменениям среды"},{"id":"d","en":"It possesses a high endowment of intangible resources.","ru":"Много нематериальных ресурсов"}],"correct":"c","section":"Variant 09 — Part I (MCQ)","explain_ru":"Viable = жизнеспособная система, которая адаптируется к изменениям."},{"num":"Variant 09 · Q14","id":"v09_mcq5","en":"What characterizes Quadrant \"b\" (Medium technology, Medium relationship)?","ru":"Что характеризует квадрант «b» (средняя technology, средняя relationship)?","options":[{"id":"a","en":"A smart city evolving according to value co-creation.","ru":"Smart city с value co-creation"},{"id":"b","en":"Absence of operational territorial marketing.","ru":"Отсутствие территориального маркетинга"},{"id":"c","en":"A Demand-driven approach focused on satisfying a specific target.","ru":"Demand-driven подход для конкретного target"},{"id":"d","en":"A technological dictatorship that limits the real needs of residents.","ru":"Технологическая диктатура"}],"correct":"c","section":"Variant 09 — Part I (MCQ)","explain_ru":"Квадрант b (средняя tech + средние отношения) = demand-driven, продаём место целевой группе."},{"num":"Variant 09 · Q15","id":"v09_mcq6","en":"What is the main risk of the presence of \"free-riders\" in a CCN project?","ru":"Главный риск «free-riders» в проекте CCN:","options":[{"id":"a","en":"The depletion of collective resources due to those who benefit from advantages without contributing.","ru":"Истощение общих ресурсов: пользуются выгодами, но не вносят вклад"},{"id":"b","en":"An excessive increase in commercial competition among shops in the same center.","ru":"Рост конкуренции между магазинами"},{"id":"c","en":"The closure of small independent shops in favor of extra-urban shopping malls.","ru":"Закрытие малых магазинов из-за ТЦ"},{"id":"d","en":"Excessive tax pressure on residential property owners.","ru":"Высокие налоги на жильё"}],"correct":"a","section":"Variant 09 — Part I (MCQ)","explain_ru":"Free-rider = получает пользу от общего проекта, но не платит/не участвует → ресурсы кончаются."},{"num":"Variant 09 · Q16","id":"v09_mcq7","en":"Why does territorial innovation require \"Inclusion\"?","ru":"Почему территориальные инновации требуют Inclusion?","options":[{"id":"a","en":"Because it is a constraint imposed by the regulations and directives of the European Commission.","ru":"Это требование Еврокомиссии"},{"id":"b","en":"To increase the number of physical participants at technical and political tables.","ru":"Чтобы больше людей сидело за столом переговоров"},{"id":"c","en":"Because true innovation does not exist without the active and convinced participation of the system of actors.","ru":"Настоящих инноваций нет без активного участия акторов системы"},{"id":"d","en":"To multiply the decision-making autonomy of primary stakeholders and the government.","ru":"Чтобы умножить автономию стейкхолдеров и власти"}],"correct":"c","section":"Variant 09 — Part I (MCQ)","explain_ru":"Инновация на территории = co-creation; без включения акторов она не работает."},{"num":"Variant 09 · Q17","id":"v09_mcq8","en":"The role of the University in a place strategy is that of:","ru":"Роль университета в place strategy:","options":[{"id":"a","en":"Catalyst and provider of knowledge for the application of the marketing framework to marketing management.","ru":"Катализатор знаний для marketing management"},{"id":"b","en":"Catalyst and provider of knowledge for attracting investments.","ru":"Катализатор знаний для привлечения инвестиций"},{"id":"c","en":"Catalyst and provider of knowledge for brand development.","ru":"Катализатор знаний для бренда"},{"id":"d","en":"Catalyst and provider of value through the dissemination of knowledge, projects, and human capital.","ru":"Катализатор ценности через знания, проекты и human capital"}],"correct":"d","section":"Variant 09 — Part I (MCQ)","explain_ru":"Университет даёт знания, проекты, кадры — связь с местом (onlife/onplace)."},{"num":"Variant 09 · Q18","id":"v09_mcq9","en":"What is meant by \"Place Brand Equity\"?","ru":"Что такое «Place Brand Equity»?","options":[{"id":"a","en":"The systematic result of the place's image and identity in the minds of stakeholders.","ru":"Результат image и identity в головах стейкхолдеров"},{"id":"b","en":"The total equity value expressed in euros of the city's brand.","ru":"Стоимость бренда города в евро"},{"id":"c","en":"The brand of the natural shopping center born from the TCM model.","ru":"Бренд natural shopping center из TCM"},{"id":"d","en":"The value of the total visitors to the city center.","ru":"Число посетителей центра"}],"correct":"a","section":"Variant 09 — Part I (MCQ)","explain_ru":"Brand equity места = накопленный образ (image + identity), не деньги на счёте."},{"num":"Variant 09 · Q19","id":"v09_mcq10","en":"The concept of \"Mutuality\" implies that actors:","ru":"Концепция «Mutuality» означает, что акторы:","options":[{"id":"a","en":"Participate in the co-design of the marketing plan.","ru":"Участвуют в co-design marketing plan"},{"id":"b","en":"Help each other to overcome the economic crisis.","ru":"Помогают друг другу пережить кризис"},{"id":"c","en":"Work for a common ultimate purpose, sharing expectations, risks, and strategic results.","ru":"Работают на общую цель, деля ожидания, риски и результаты"},{"id":"d","en":"All possess the same annual income level and professional qualification.","ru":"Имеют одинаковый доход и квалификацию"}],"correct":"c","section":"Variant 09 — Part I (MCQ)","explain_ru":"Mutuality = общая финальная цель места; акторы разделяют риски и результаты."},{"num":"Variant 10 · Q1","id":"v10_mcq1","en":"What does it mean to be an \"intentional observer\" in the context of perceiving complexity?","ru":"Что значит быть «intentional observer» при восприятии сложности?","options":[{"id":"a","en":"One who perceives and analyzes the system by coming into contact with it from a specific perspective.","ru":"Тот, кто воспринимает и анализирует систему, вступая с ней в контакт с определённой позиции"},{"id":"b","en":"A data analysis software that monitors tourist flows in an automated way.","ru":"ПО для автоматического мониторинга туристических потоков"},{"id":"c","en":"The policy maker who imposes a top-down vision without consulting stakeholders.","ru":"Политик, навязывающий top-down видение без консультаций"},{"id":"d","en":"A passive user who receives the value proposition without contributing to its definition.","ru":"Пассивный пользователь, получающий value proposition без участия в её определении"}],"correct":"a","section":"Variant 10 — Part I (MCQ)","explain_ru":"Intentional observer — активный наблюдатель с позиции, а не пассивный пользователь и не автоматика."},{"num":"Variant 10 · Q2","id":"v10_mcq2","en":"What is the difference between \"Place Image\" and \"Place Brand\" according to Kavaratzis?","ru":"Разница между Place Image и Place Brand по Kavaratzis:","options":[{"id":"a","en":"There is no difference; they are interchangeable synonyms.","ru":"Разницы нет, это синонимы"},{"id":"b","en":"Image is the mental perception of users; the brand includes relationships and strategic actions.","ru":"Image — ментальное восприятие; brand включает отношения и стратегические действия"},{"id":"c","en":"Image is managed by the State, the brand is created exclusively by private entities.","ru":"Image управляет государство, brand — только частный сектор"},{"id":"d","en":"Image concerns tourists, the brand concerns only local residents.","ru":"Image — для туристов, brand — только для жителей"}],"correct":"b","section":"Variant 10 — Part I (MCQ)","explain_ru":"Kavaratzis: image = восприятие; brand шире — стратегия, отношения, действия."},{"num":"Variant 10 · Q3","id":"v10_mcq3","en":"The local government as a \"Movie Director\" must:","ru":"Местная власть как «Movie Director» должна:","options":[{"id":"a","en":"Control every single word spoken by citizens.","ru":"Контролировать каждое слово граждан"},{"id":"b","en":"Replace local inhabitants with professional actors for promotional videos.","ru":"Заменять жителей профессиональными актёрами в роликах"},{"id":"c","en":"Exclusively produce documentaries on the ancient history of the place.","ru":"Только снимать документалки об истории места"},{"id":"d","en":"Encourage actors to suggest ideas and projects aligned with the general strategy.","ru":"Поощрять акторов предлагать идеи и проекты в русле общей стратегии"}],"correct":"d","section":"Variant 10 — Part I (MCQ)","explain_ru":"Режиссёр задаёт стратегию, но не диктует всё — акторы предлагают идеи в её рамках."},{"num":"Variant 10 · Q4","id":"v10_mcq4","en":"Why does territorial innovation require \"Inclusion\"?","ru":"Почему территориальные инновации требуют Inclusion?","options":[{"id":"a","en":"Because true innovation does not exist without the active participation of the system of actors.","ru":"Настоящих инноваций нет без активного участия системы акторов"},{"id":"b","en":"Because it is a legal requirement imposed by European Commission directives.","ru":"Это юридическое требование Еврокомиссии"},{"id":"c","en":"To artificially increase the number of participants at technical roundtables.","ru":"Чтобы искусственно увеличить число участников круглых столов"},{"id":"d","en":"To reduce the decision-making power of marketing experts in favor of the crowd.","ru":"Чтобы снизить власть маркетологов в пользу толпы"}],"correct":"a","section":"Variant 10 — Part I (MCQ)","explain_ru":"Инновация = co-creation; без включения акторов она не работает."},{"num":"Variant 10 · Q5","id":"v10_mcq5","en":"The role of the University in a place strategy is that of:","ru":"Роль университета в place strategy:","options":[{"id":"a","en":"A simple provider of degrees detached from the real economy.","ru":"Просто выдаёт дипломы, оторванные от экономики"},{"id":"b","en":"A catalyst and provider of value through the dissemination of knowledge and projects.","ru":"Катализатор ценности через распространение знаний и проектов"},{"id":"c","en":"A censorship body for residents' critical opinions toward the government.","ru":"Орган цензуры критики жителей к власти"},{"id":"d","en":"A purely theoretical entity that must remain isolated from market dynamics.","ru":"Чисто теоретическая сущность, изолированная от рынка"}],"correct":"b","section":"Variant 10 — Part I (MCQ)","explain_ru":"Университет — катализатор знаний, проектов и human capital для территории."},{"num":"Variant 10 · Q6","id":"v10_mcq6","en":"What is meant by \"Place Brand Equity\"?","ru":"Что такое «Place Brand Equity»?","options":[{"id":"a","en":"The asset value of historical buildings located in the city center.","ru":"Стоимость исторических зданий в центре"},{"id":"b","en":"The net profit generated by the commercial activities of a Natural Shopping Center.","ru":"Чистая прибыль Natural Shopping Center"},{"id":"c","en":"The systematic result of the place's image and identity in the minds of stakeholders.","ru":"Системный результат image и identity в сознании стейкхолдеров"},{"id":"d","en":"The number of annual visitors multiplied by the average per capita expenditure.","ru":"Число посетителей × средние траты на человека"}],"correct":"c","section":"Variant 10 — Part I (MCQ)","explain_ru":"Brand equity места — накопленный образ (image + identity), не деньги на счёте."},{"num":"Variant 10 · Q7","id":"v10_mcq7","en":"The concept of \"Mutuality\" implies that actors:","ru":"Концепция «Mutuality» означает, что акторы:","options":[{"id":"a","en":"Are all related to one another.","ru":"Все связаны друг с другом"},{"id":"b","en":"Are obliged to sign a financial mutual assistance contract.","ru":"Обязаны подписать договор взаимопомощи"},{"id":"c","en":"All have the same income and education level.","ru":"Имеют одинаковый доход и образование"},{"id":"d","en":"Work for a common ultimate purpose, sharing expectations and results.","ru":"Работают на общую цель, деля ожидания и результаты"}],"correct":"d","section":"Variant 10 — Part I (MCQ)","explain_ru":"Mutuality = общая финальная цель места; акторы разделяют риски и результаты."},{"num":"Variant 10 · Q8","id":"v10_mcq8","en":"The \"Placement\" lever in place marketing concerns:","ru":"Рычаг «Placement» в place marketing касается:","options":[{"id":"a","en":"The delivery channels of place marketing communication.","ru":"Каналов коммуникации place marketing"},{"id":"b","en":"The positioning of the place marketing strategy.","ru":"Позиционирования стратегии place marketing"},{"id":"c","en":"The spatial context where the user recognizes and enjoys the value proposition.","ru":"Пространственного контекста, где пользователь получает value proposition"},{"id":"d","en":"A strategic element of the marketing plan.","ru":"Стратегического элемента marketing plan"}],"correct":"c","section":"Variant 10 — Part I (MCQ)","explain_ru":"Placement = distribution: пространство/доступ, где пользователь получает ценность места."},{"num":"Variant 10 · Q9","id":"v10_mcq9","en":"The \"PESTEL\" analysis in the marketing plan serves to monitor:","ru":"PESTEL-анализ в marketing plan служит для мониторинга:","options":[{"id":"a","en":"Elements of the marketing microenvironment.","ru":"Элементов микросреды маркетинга"},{"id":"b","en":"Direct competition between two commercial businesses on the same street.","ru":"Прямой конкуренции двух магазинов на одной улице"},{"id":"c","en":"The level of street cleanliness and maintenance of public gardens.","ru":"Чистоты улиц и содержания парков"},{"id":"d","en":"External Political, Economic, Social, Technological, Environmental, and Legal factors.","ru":"Внешних политических, экономических, социальных, технологических, экологических и правовых факторов"}],"correct":"d","section":"Variant 10 — Part I (MCQ)","explain_ru":"PESTEL = макросреда (внешние факторы), не микросреда."},{"num":"Variant 10 · Q10","id":"v10_mcq10","en":"What is the primary purpose of Town Centre Management (TCM) schemes?","ru":"Главная цель схем Town Centre Management (TCM)?","options":[{"id":"a","en":"To revitalize city centers through public-private partnerships.","ru":"Ревитализация центров через public-private partnerships"},{"id":"b","en":"To shift downtown commerce toward large shopping malls outside the city.","ru":"Перенос торговли в ТЦ за городом"},{"id":"c","en":"To eliminate the presence of independent shops in favor of an association.","ru":"Устранение независимых магазинов ради ассоциации"},{"id":"d","en":"To limit the installation of shopping centers in the city center.","ru":"Ограничение ТЦ в центре города"}],"correct":"a","section":"Variant 10 — Part I (MCQ)","explain_ru":"TCM = партнёрство власти, бизнеса и жителей для оживления центра."},{"num":"Variant 10 · Q11","id":"v10_mcq11","en":"\"Big Data\" in place marketing are useful because:","ru":"«Big Data» в place marketing полезны, потому что:","options":[{"id":"a","en":"They allow collecting information for the management of the municipality's strategy.","ru":"Позволяют собирать данные для стратегии муниципалитета"},{"id":"b","en":"They improve the understanding of social dynamics and markets through flow analysis.","ru":"Улучшают понимание социальной динамики и рынков через анализ потоков"},{"id":"c","en":"They reduce the need to interact with the real population.","ru":"Снижают необходимость взаимодействия с населением"},{"id":"d","en":"They allow automating completely the creation of the Place Image.","ru":"Полностью автоматизируют создание Place Image"}],"correct":"b","section":"Variant 10 — Part I (MCQ)","explain_ru":"Big Data помогают понять потоки и поведение, но не заменяют участие людей."},{"num":"Variant 10 · Q12","id":"v10_mcq12","en":"What is the role of \"Nudges\" (gentle pushes) according to the sources?","ru":"Роль «Nudges» (мягких подталкиваний)?","options":[{"id":"a","en":"Non-monetary sanctions for those who do not respect the environment.","ru":"Неденежные санкции за нарушение экологии"},{"id":"b","en":"Orders issued by the municipality in relation to TCM.","ru":"Приказы муниципалитета по TCM"},{"id":"c","en":"Small informational stimuli to guide citizens toward virtuous and conscious behaviors.","ru":"Небольшие информационные стимулы к добросовестному поведению"},{"id":"d","en":"Advertising to attract tourists.","ru":"Реклама для привлечения туристов"}],"correct":"c","section":"Variant 10 — Part I (MCQ)","explain_ru":"Nudge = мягкий стимул (подсказка), а не штраф и не приказ."},{"num":"Variant 10 · Q13","id":"v10_mcq13","en":"An \"Adaptive\" system in territorial marketing is a system that:","ru":"«Adaptive» система в территориальном маркетинге — это система, которая:","options":[{"id":"a","en":"Refuses to change to keep its historical image unaltered.","ru":"Отказывается меняться ради исторического имиджа"},{"id":"b","en":"Changes strategy every day based on feedback from social networks.","ru":"Меняет стратегию каждый день по соцсетям"},{"id":"c","en":"Is imposed by the central government without direct local consultation.","ru":"Навязана центральной властью без консультаций"},{"id":"d","en":"Follows rules shared by stakeholders to respond to environmental changes.","ru":"Следует общим правилам стейкхолдеров и адаптируется к изменениям среды"}],"correct":"d","section":"Variant 10 — Part I (MCQ)","explain_ru":"Adaptive (VSA) = жизнеспособная система, адаптирующаяся по общим правилам."},{"num":"Variant 10 · Q14","id":"v10_mcq14","en":"In a marketing plan for a CCN, the \"Safety\" lever is measured through:","ru":"В marketing plan для CCN рычаг «Safety» измеряется через:","options":[{"id":"a","en":"The reduction of real crime and the improvement of users' perception of protection.","ru":"Снижение реальной преступности и улучшение восприятия безопасности"},{"id":"b","en":"It is a KPI and indicates the number of fines issued by the municipal police for parking violations.","ru":"Число штрафов за парковку"},{"id":"c","en":"The number of surveillance interventions arranged during the year.","ru":"Число операций видеонаблюдения за год"},{"id":"d","en":"The response speed of local police in the city.","ru":"Скорость реакции полиции"}],"correct":"a","section":"Variant 10 — Part I (MCQ)","explain_ru":"Safety = реальная безопасность + восприятие защиты пользователями."},{"num":"Variant 10 · Q15","id":"v10_mcq15","en":"In a \"Smart City\", technology must be understood as:","ru":"В «Smart City» технологию следует понимать как:","options":[{"id":"a","en":"An ultimate goal of urban development to which privacy is sacrificed.","ru":"Конечную цель развития, ради которой жертвуют privacy"},{"id":"b","en":"A tool to optimize the co-creation of value and the well-being of citizens.","ru":"Инструмент для co-creation ценности и благополучия граждан"},{"id":"c","en":"An incidental cost to be eliminated to balance the municipal budget.","ru":"Побочные расходы, которые надо убрать"},{"id":"d","en":"A substitute for human skills in the political decision process.","ru":"Замену человеческим навыкам в политических решениях"}],"correct":"b","section":"Variant 10 — Part I (MCQ)","explain_ru":"Tech — средство для co-creation и wellbeing, не самоцель."},{"num":"Variant 10 · Q16","id":"v10_mcq16","en":"In the \"movie director\" governance model, the role of government is:","ru":"В модели governance «movie director» роль власти:","options":[{"id":"a","en":"To write the strategy and objectives and suggest actions to the actors.","ru":"Писать стратегию и цели и предлагать действия акторам"},{"id":"b","en":"To passively monitor markets without intervening in the strategy.","ru":"Пассивно наблюдать за рынками без вмешательства"},{"id":"c","en":"To encourage actors to integrate knowledge for a common ultimate purpose.","ru":"Поощрять акторов интегрировать знания ради общей цели"},{"id":"d","en":"To manage the legal and bureaucratic aspects of the territory.","ru":"Управлять только юридическими и бюрократическими аспектами"}],"correct":"a","section":"Variant 10 — Part I (MCQ)","explain_ru":"Режиссёр задаёт стратегию, цели и направляет акторов — не пассивный наблюдатель."},{"num":"Variant 10 · Q17","id":"v10_mcq17","en":"\"Co-production\" differs from \"co-creation\" because:","ru":"«Co-production» отличается от «co-creation», потому что:","options":[{"id":"a","en":"It only concerns the experiential value-in-use of the final user.","ru":"Касается только experiential value-in-use конечного пользователя"},{"id":"b","en":"It implies the direct participation of the customer in the design or realization of the offering.","ru":"Подразумевает прямое участие клиента в проектировании или реализации предложения"},{"id":"c","en":"It is a process that partially excludes the public administration.","ru":"Частично исключает public administration"},{"id":"d","en":"It applies exclusively to services in the city.","ru":"Применяется только к городским услугам"}],"correct":"b","section":"Variant 10 — Part I (MCQ)","explain_ru":"Co-production = пользователь участвует в создании услуги; co-creation шире (вся система акторов)."},{"num":"Variant 10 · Q18","id":"v10_mcq18","en":"The urban \"Servicescape\" concept problematizes the city as:","ru":"Концепция urban «Servicescape» рассматривает город как:","options":[{"id":"a","en":"A setting where the interaction among actors creates and perceives the service offering.","ru":"Среду, где взаимодействие акторов создаёт и воспринимает услугу"},{"id":"b","en":"A context in which the services of the city develop.","ru":"Контекст развития городских услуг"},{"id":"c","en":"A non-place devoid of identity and meaningful social relationships.","ru":"Non-place без идентичности и социальных связей"},{"id":"d","en":"An administrative structure aimed at managing public services.","ru":"Административную структуру управления услугами"}],"correct":"a","section":"Variant 10 — Part I (MCQ)","explain_ru":"Servicescape (Bitner) — физическая и социальная среда, где создаётся опыт услуги."},{"num":"Variant 10 · Q19","id":"v10_mcq19","en":"\"Change Aversion\" can be overcome through:","ru":"«Change Aversion» можно преодолеть через:","options":[{"id":"a","en":"Limits generated by those who hinder development.","ru":"Ограничения для тех, кто мешает развитию"},{"id":"b","en":"Proposing the replacement of downtown entrepreneurs not aligned with TCM.","ru":"Замену предпринимателей, не согласных с TCM"},{"id":"c","en":"The dissemination of knowledge and the involvement of stakeholders in the design process.","ru":"Распространение знаний и вовлечение стейкхолдеров в проектирование"},{"id":"d","en":"The total elimination of every existing rule in the territory.","ru":"Полную отмену всех существующих правил"}],"correct":"c","section":"Variant 10 — Part I (MCQ)","explain_ru":"Сопротивление изменениям снимают знания и участие в co-design, не принуждением."}];
    const OPEN_ITEMS = [];
    const SNA_ITEMS = [];

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Вопрос ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span>
                  <div class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</div>
                  <div class="opt-ru">${o.ru}</div>
                </span>
              </label>`).join('')}
          </div>
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let currentPart = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const part = item.part || 'II';
        if (part !== currentPart) {
          currentPart = part;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = part === 'III'
            ? 'Part III — Brief Answers (5 marks) / Развёрнутые ответы'
            : 'Part II — Brief Answers (3 marks) / Краткие ответы';
          container.appendChild(h);
        }
        const ansEn = item.sample_en || '';
        const ansRu = item.sample_ru || '';
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-num">${item.label ? part + ' ' + item.label : item.title_ru}</div>
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <div class="answer-box">
            <div class="answer-label">Sample answer / Эталонный ответ</div>
            ${ansEn ? `<div class="answer-en">${ansEn}</div>` : ''}
            ${ansRu ? `<div class="answer-ru">${ansRu}</div>` : ''}
          </div>
          <details class="practice-note">
            <summary>Write your own answer / Свой ответ (optional)</summary>
            <textarea name="open_${idx}" rows="4" placeholder="Compare with the sample above / Сравните с эталоном"></textarea>
          </details>`;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — расчёты';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-ru">${item.ru}</div>
          <div class="q-en">${item.en}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Ваш ответ..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let unanswered = 0;
      let correct = 0;
      let wrong = 0;
      const warnEl = document.getElementById('warn-text');

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Ответьте на все вопросы с вариантами (${unanswered} без ответа).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Ответ не выбран. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Correct / Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Ваш ответ: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

            container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Пустой ответ. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Correct / Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Результат: ${correct} из ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Баллы: ${score.toFixed(1)} · Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`
          : `Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
