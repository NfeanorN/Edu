  <script>
    const SCORING = {"correct":1,"wrong":0,"max":null};
    const QUESTIONS = [{"num":"Variant 01 · Q1","id":"v01_mcq1","en":"According to Le Moigne (1985), how should the \"complexity\" of a system be understood?","options":[{"id":"a","en":"As a series of structural complications solvable through linear planning."},{"id":"b","en":"As a property of the system whose behaviors are not all pre-determinable by the observer."},{"id":"c","en":"As the absence of shared rules and norms within a local government system."},{"id":"d","en":"As the dynamics of entropy that inevitably leads to the collapse of relations between actors."}],"correct":"b","section":"Variant 01 — Part I (MCQ)","explain":"Complexity = not everything is predictable from the observer's viewpoint (Le Moigne)."},{"num":"Variant 01 · Q2","id":"v01_mcq2","en":"What is the mission of \"Onplace Universities\" in the post-pandemic period?","options":[{"id":"a","en":"To transform into purely digital universities to reduce fixed costs."},{"id":"b","en":"To prohibit the use of the internet to recover the tradition of classical teaching."},{"id":"c","en":"To integrate online activities with the real experience of the place and social life."},{"id":"d","en":"To compete with foreign universities exclusively on the price of tuition fees."}],"correct":"c","section":"Variant 01 — Part I (MCQ)","explain":"Onplace = onlife/onplace: digital + physical place experience together."},{"num":"Variant 01 · Q3","id":"v01_mcq3","en":"A \"Natural Shopping Center\" (CCN - Centro Commerciale Naturale) is defined as:","options":[{"id":"a","en":"A modern architectural structure built with biocompaticle materials."},{"id":"b","en":"A consumer association dedicated exclusively to the bartering of goods."},{"id":"c","en":"A disused industrial area converted into a natural theme park."},{"id":"d","en":"A group of commercial activities spontaneously organized in historical centers or neighborhoods."}],"correct":"d","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q4","id":"v01_mcq4","en":"Why did the \"Belgrade Waterfront\" project generate protests among citizens?","options":[{"id":"a","en":"Because housing prices were too low compared to the market."},{"id":"b","en":"Due to the lack of dialogue with the community and the unshared skyline impact."},{"id":"c","en":"Because it used too much onlife digital technology."},{"id":"d","en":"Because it was realized entirely with public funds without involving private entities."}],"correct":"b","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q5","id":"v01_mcq5","en":"Why can the \"Passage of Time\" reduce the effectiveness of a project?","options":[{"id":"a","en":"Because initial goals can become obsolete if they are not constantly adapted."},{"id":"b","en":"Because buildings age and fall apart."},{"id":"c","en":"Because citizens lose memory of the benefits received in the past."},{"id":"d","en":"Because national laws change every 15 days."}],"correct":"a","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q6","id":"v01_mcq6","en":"Using Cresswell's metaphor, with which concept is \"Place\" associated?","options":[{"id":"a","en":"With the \"House\", understood as the physical and objective structure of the territory."},{"id":"b","en":"With the \"Servicescape\", understood as the setting for the delivery of material services."},{"id":"c","en":"With the \"Home\", understood as a lived space, dense with meanings and bonds."},{"id":"d","en":"With the \"District\", understood as an industrial agglomeration devoid of social connotation."}],"correct":"c","section":"Variant 01 — Part I (MCQ)","explain":"Territory = house (map); Place = home (meaning, lived experience)."},{"num":"Variant 01 · Q7","id":"v01_mcq7","en":"A territorial strategy that presents \"Strategy + Substance - Symbolic actions\" results as:","options":[{"id":"a","en":"Anonymous, because it lacks actions capable of capturing user attention."},{"id":"b","en":"Incoherent, because it is devoid of a long-term vision."},{"id":"c","en":"Winning, because substance is the only element that matters for the market."},{"id":"d","en":"Propaganda, because it is based only on unfulfilled promises."}],"correct":"a","section":"Variant 01 — Part I (MCQ)","explain":"Strategy + substance without symbolic communication stays invisible (anonymous)."},{"num":"Variant 01 · Q8","id":"v01_mcq8","en":"What does \"Self-funding\" mean for a CCN project?","options":[{"id":"a","en":"Waiting for the State to send the necessary funds."},{"id":"b","en":"Generating own revenues through events, sponsorships, or value-added services."},{"id":"c","en":"Asking for a non-repayable loan from a foreign bank."},{"id":"d","en":"Selling the artistic heritage of the city to the highest bidder."}],"correct":"b","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q9","id":"v01_mcq9","en":"Which of the following factors is identified as a \"change-generating force\"?","options":[{"id":"a","en":"The stability of bureaucratic and jurisdictional boundaries."},{"id":"b","en":"The reduction of migratory flows and technological decrease."},{"id":"c","en":"The diffusion of knowledge and the use of data (Big Data)."},{"id":"d","en":"The maintenance of traditional transactional marketing approaches."}],"correct":"c","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q10","id":"v01_mcq10","en":"\"Demand-driven\" Place Marketing (second perspective) is characterized by:","options":[{"id":"a","en":"The centrality of co-creation and the win-win approach."},{"id":"b","en":"The management of the territory as a common good without market objectives."},{"id":"c","en":"The total absence of territorial economic competitiveness goals."},{"id":"d","en":"The generation of value by the government to satisfy a specific demand."}],"correct":"d","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q11","id":"v01_mcq11","en":"What does the example of the Emilian \"Food Valley\" teach about the coexistence of systems?","options":[{"id":"a","en":"That different Places and Systems can coexist on the same physical base (territory)."},{"id":"b","en":"That a territory can host only one value system at a time."},{"id":"c","en":"That quality agriculture prevents the development of the automotive industry."},{"id":"d","en":"That territorial marketing must always unify all sectors under a single logo."}],"correct":"a","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q12","id":"v01_mcq12","en":"The UK's TCM model (ATCM) is based on a partnership that aims to:","options":[{"id":"a","en":"Completely privatize public areas to increase efficiency."},{"id":"b","en":"Ban online commerce to protect traditional physical shops."},{"id":"c","en":"Make urban centers desirable and competitive places through cooperation."},{"id":"d","en":"Transform historical centers into open-air museums without productive activities."}],"correct":"c","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q13","id":"v01_mcq13","en":"According to the Place Marketing Manifesto, the discipline must be:","options":[{"id":"a","en":"A magical art based on the leader's intuition."},{"id":"b","en":"A branch of architecture that deals only with urban aesthetics."},{"id":"c","en":"A technique of political propaganda to manipulate consensus."},{"id":"d","en":"A scientific discipline based on managerial processes and market orientation."}],"correct":"d","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q14","id":"v01_mcq14","en":"What is meant by \"Authenticity\" in the development of a place's brand?","options":[{"id":"a","en":"The involvement of stakeholders in identifying real identity traits."},{"id":"b","en":"The creation of an invented historical legend to attract visitors."},{"id":"c","en":"The legal certification of local gastronomic products by the EU."},{"id":"d","en":"Architectural restoration that eliminates any trace of the past."}],"correct":"a","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q15","id":"v01_mcq15","en":"What characterizes Quadrant \"a\" of the matrix \"Relation among technology-knowledge-information diffusion and actors engagement\"?","options":[{"id":"a","en":"A strong identification of stakeholders with the territorial project."},{"id":"b","en":"A management based exclusively on the primary needs of residents."},{"id":"c","en":"The use of technology to communicate in a single direction with low involvement."},{"id":"d","en":"The absolute lack of any digital infrastructure in the territory."}],"correct":"a","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q16","id":"v01_mcq16","en":"Place Marketing is defined as a \"Social Process\" because:","options":[{"id":"a","en":"It takes place exclusively during local festivals and village fairs."},{"id":"b","en":"It is regulated by laws on social services and assistance to the elderly."},{"id":"c","en":"It requires the mandatory use of social networks for every communication."},{"id":"d","en":"It aims at collective well-being through interaction among members of society."}],"correct":"d","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q17","id":"v01_mcq17","en":"In \"Onlife Universities\", the choice of software must be based on:","options":[{"id":"a","en":"Ease of use (user-friendly) and the capacity to include people and share data."},{"id":"b","en":"Exclusively the lowest economic cost for the administration."},{"id":"c","en":"Technical complexity to exclude non-experts from the educational process."},{"id":"d","en":"The exclusive ownership of the source code by the rectorate."}],"correct":"a","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q18","id":"v01_mcq18","en":"In the matrix \"Relation among technology-knowledge-information diffusion and actors engagement\", the quadrant \"e\" (Low technology and Low relationship) exposes the territory to:","options":[{"id":"a","en":"Excessive democratic participation that blocks decisions."},{"id":"b","en":"Risk of resource exploitation by unregulated external actions."},{"id":"c","en":"Economic growth that is too rapid compared to the system's capacities."},{"id":"d","en":"An effective protection of local traditions through isolation."}],"correct":"b","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 01 · Q19","id":"v01_mcq19","en":"In the matrix \"Relation among technology-knowledge-information diffusion and actors engagement\", what characterizes Quadrant \"b\" (Medium technology, Medium relationship)?","options":[{"id":"a","en":"An advanced smart city based on co-creation."},{"id":"b","en":"The total absence of any form of territorial marketing."},{"id":"c","en":"A technological dictatorship that ignores the needs of residents."},{"id":"d","en":"A Demand-driven approach focused on satisfying a specific target."}],"correct":"d","section":"Variant 01 — Part I (MCQ)"},{"num":"Variant 02 · Q1","id":"v02_mcq1","en":"__________ is about matching market opportunities to the organization's resources (what it can do) and objectives (what management wants to do).","options":[{"id":"a","en":"Marketing communications"},{"id":"b","en":"Market research"},{"id":"c","en":"Marketing strategy"},{"id":"d","en":"Market segmentation"}],"correct":"c","section":"Variant 02 — Part I (MCQ)"},{"num":"Variant 02 · Q2","id":"v02_mcq2","en":"The standardization of the offering is:","options":[{"id":"a","en":"the solution to \"sell\" your Place in the world"},{"id":"b","en":"the solution to \"sell\" your Place in your Country"},{"id":"c","en":"could be a solution in some situations"}],"correct":"c","section":"Variant 02 — Part I (MCQ)"},{"num":"Variant 03 · Q1","id":"v03_mcq1","en":"What does it mean to be an \"intentional observer\" in the context of perceiving complexity?","options":[{"id":"a","en":"One who perceives and analyzes the system by coming into contact with it from a specific perspective."},{"id":"b","en":"A data analysis software that monitors tourist flows in an automated way."},{"id":"c","en":"The policy maker who imposes a top-down vision without consulting stakeholders."},{"id":"d","en":"A passive user who receives the value proposition without contributing to its definition."}],"correct":"a","section":"Variant 03 — Part I (MCQ)","explain":"Intentional observer = active analysis from a specific perspective, not a passive user."},{"num":"Variant 03 · Q2","id":"v03_mcq2","en":"What is the difference between \"Place Image\" and \"Place Brand\" according to Kavaratzis?","options":[{"id":"a","en":"There is no difference; they are interchangeable synonyms."},{"id":"b","en":"Image is the mental perception of users; the brand includes relationships and strategic actions."},{"id":"c","en":"Image is managed by the State, the brand is created exclusively by private entities."},{"id":"d","en":"Image concerns tourists, the brand concerns only local residents."}],"correct":"b","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q3","id":"v03_mcq3","en":"The local government as a \"Movie Director\" must:","options":[{"id":"a","en":"Control every single word spoken by citizens."},{"id":"b","en":"Replace local inhabitants with professional actors for promotional videos."},{"id":"c","en":"Exclusively produce documentaries on the ancient history of the place."},{"id":"d","en":"Encourage actors to suggest ideas and projects aligned with the general strategy."}],"correct":"d","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q4","id":"v03_mcq4","en":"Why does territorial innovation require \"Inclusion\"?","options":[{"id":"a","en":"Because true innovation does not exist without the active participation of the system of actors."},{"id":"b","en":"Because it is a legal requirement imposed by European Commission directives."},{"id":"c","en":"To artificially increase the number of participants at technical roundtables."},{"id":"d","en":"To reduce the decision-making power of marketing experts in favor of the crowd."}],"correct":"a","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q5","id":"v03_mcq5","en":"The role of the University in a place strategy is that of:","options":[{"id":"a","en":"A simple provider of degrees detached from the real economy."},{"id":"b","en":"A catalyst and provider of value through the dissemination of knowledge and projects."},{"id":"c","en":"A censorship body for residents' critical opinions toward the government."},{"id":"d","en":"A purely theoretical entity that must remain isolated from market dynamics."}],"correct":"b","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q6","id":"v03_mcq6","en":"What is meant by \"Place Brand Equity\"?","options":[{"id":"a","en":"The asset value of historical buildings located in the city center."},{"id":"b","en":"The net profit generated by the commercial activities of a Natural Shopping Center."},{"id":"c","en":"The systematic result of the place's image and identity in the minds of stakeholders."},{"id":"d","en":"The number of annual visitors multiplied by the average per capita expenditure."}],"correct":"c","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q7","id":"v03_mcq7","en":"The concept of \"Mutuality\" implies that actors:","options":[{"id":"a","en":"Are all related to one another."},{"id":"b","en":"Are obliged to sign a financial mutual assistance contract."},{"id":"c","en":"All have the same income and education level."},{"id":"d","en":"Work for a common ultimate purpose, sharing expectations and results."}],"correct":"d","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q8","id":"v03_mcq8","en":"The \"Placement\" lever in place marketing concerns:","options":[{"id":"a","en":"The delivery channels of place marketing communication."},{"id":"b","en":"The positioning of the place marketing strategy."},{"id":"c","en":"The spatial context where the user recognizes and enjoys the value proposition."},{"id":"d","en":"A strategic element of the marketing plan."}],"correct":"c","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q9","id":"v03_mcq9","en":"The \"PESTEL\" analysis in the marketing plan serves to monitor:","options":[{"id":"a","en":"Elements of the marketing microenvironment."},{"id":"b","en":"Direct competition between two commercial businesses on the street."},{"id":"c","en":"The level of street cleanliness and maintenance of public spaces."},{"id":"d","en":"External Political, Economic, Social, Technological, Environmental, and Legal factors."}],"correct":"d","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q10","id":"v03_mcq10","en":"What is the primary purpose of Town Centre Management (TCM)?","options":[{"id":"a","en":"To revitalize city centers through public-private partnerships."},{"id":"b","en":"To shift downtown commerce toward large shopping malls outside the city."},{"id":"c","en":"To eliminate the presence of independent shops in favor of an association."},{"id":"d","en":"To limit the installation of shopping centers in the city center."}],"correct":"a","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q11","id":"v03_mcq11","en":"\"Big Data\" in place marketing are useful because:","options":[{"id":"a","en":"They allow collecting information for the management of the municipality's strategy."},{"id":"b","en":"They improve the understanding of social dynamics and markets through flow analysis."},{"id":"c","en":"They reduce the need to interact with the real population."},{"id":"d","en":"They allow automating completely the creation of the Place Image."}],"correct":"b","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q12","id":"v03_mcq12","en":"What is the role of \"Nudges\" (gentle pushes) according to the sources?","options":[{"id":"a","en":"Non-monetary sanctions for those who do not respect the environment."},{"id":"b","en":"Orders issued by the municipality in relation to TCM."},{"id":"c","en":"Small informational stimuli to guide citizens toward virtuous and conscious behaviors."},{"id":"d","en":"Advertising to attract tourists."}],"correct":"c","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q13","id":"v03_mcq13","en":"An \"Adaptive\" system in territorial marketing is a system that:","options":[{"id":"a","en":"Refuses to change to keep its historical image unaltered."},{"id":"b","en":"Changes strategy every day based on feedback from social networks."},{"id":"c","en":"Is imposed by the central government without direct local consultation."},{"id":"d","en":"Follows rules shared by stakeholders to respond to environmental changes."}],"correct":"d","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q14","id":"v03_mcq14","en":"In a marketing plan for a CCN, the \"Safety\" lever is measured through:","options":[{"id":"a","en":"The reduction of real crime and the improvement of users' perception of protection."},{"id":"b","en":"It is a KPI and indicates the number of fines issued by the municipal police for parking violations."},{"id":"c","en":"The number of surveillance interventions arranged during the year."},{"id":"d","en":"The response speed of local police in the city."}],"correct":"a","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q15","id":"v03_mcq15","en":"In a \"Smart City\", technology must be understood as:","options":[{"id":"a","en":"An ultimate goal of urban development to which privacy is sacrificed."},{"id":"b","en":"A tool to optimize the co-creation of value and the well-being of citizens."},{"id":"c","en":"An incidental cost to be eliminated to balance the municipal budget."},{"id":"d","en":"A substitute for human skills in the political decision process."}],"correct":"b","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q16","id":"v03_mcq16","en":"In the \"movie director\" governance model, the role of government is:","options":[{"id":"a","en":"To write the strategy and objectives and suggest actions to the actors."},{"id":"b","en":"To passively monitor markets without intervening in the strategy."},{"id":"c","en":"To encourage actors to integrate knowledge for a common ultimate purpose."},{"id":"d","en":"To manage the legal and bureaucratic aspects of the territory."}],"correct":"a","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q17","id":"v03_mcq17","en":"\"Co-production\" differs from \"co-creation\" because:","options":[{"id":"a","en":"It only concerns the experiential value-in-use of the final user."},{"id":"b","en":"It implies the direct participation of the customer in the design or realization of the offering."},{"id":"c","en":"It is a process that partially excludes the public administration."},{"id":"d","en":"It applies exclusively to services in the city."}],"correct":"b","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q18","id":"v03_mcq18","en":"The urban \"Servicescape\" concept problematizes the city as:","options":[{"id":"a","en":"A setting where the interaction among actors creates and perceives the service offering."},{"id":"b","en":"A context in which the services of the city develop."},{"id":"c","en":"A non-place devoid of identity and meaningful social relationships."},{"id":"d","en":"An administrative structure aimed at managing public services."}],"correct":"a","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 03 · Q19","id":"v03_mcq19","en":"\"Change Aversion\" can be overcome through:","options":[{"id":"a","en":"Limits generated by those who hinder development."},{"id":"b","en":"Proposing the replacement of downtown entrepreneurs not aligned with TCM."},{"id":"c","en":"The dissemination of knowledge and the involvement of stakeholders in the design process."},{"id":"d","en":"The total elimination of every existing rule in the territory."}],"correct":"c","section":"Variant 03 — Part I (MCQ)"},{"num":"Variant 04 · Q1","id":"v04_mcq1","en":"What does it mean that value in a Place has \"no sign\"?","options":[{"id":"a","en":"That the value is zero or null if everyone contributes.","ru":"Что ценность равна нулю, если все вносят вклад."},{"id":"b","en":"That there are no indications on how to understand value.","ru":"Что нет указаний, как понимать ценность."},{"id":"c","en":"That its valence (positive or negative) depends on the subjective experience of the user.","ru":"Что её валентность (+/−) зависит от субъективного опыта пользователя."},{"id":"d","en":"That the government has decided not to give clear indications on the strategy.","ru":"Что правительство решило не давать ясных указаний по стратегии."}],"correct":"c","section":"Variant 04 — Part I (MCQ)","ru":"Что значит, что ценность Place «не имеет знака»?","explain":"Place value has no fixed sign — users may perceive it as positive or negative."},{"num":"Variant 04 · Q2","id":"v04_mcq2","en":"In the \"Product\" lever, the \"Place Value Proposition\" is defined as:","options":[{"id":"a","en":"A system of physical elements representing the value of the place.","ru":"Система физических элементов, выражающих ценность места."},{"id":"b","en":"A package of benefits and solutions that the place-system intends to offer to users.","ru":"Пакет выгод и решений, который place-система предлагает пользователям."},{"id":"c","en":"The sum of all tangible elements of the place.","ru":"Сумма всех tangible элементов места."},{"id":"d","en":"The intangible elements of the place.","ru":"Intangible элементы места."}],"correct":"b","section":"Variant 04 — Part I (MCQ)","ru":"В рычаге Product «Place Value Proposition» — это:"},{"num":"Variant 04 · Q3","id":"v04_mcq3","en":"What happens in an \"Overtourism\" situation?","options":[{"id":"a","en":"Excessive tourism degrades resources and limits the quality of life of residents.","ru":"Избыточный туризм портит ресурсы и ухудшает качество жизни жителей."},{"id":"b","en":"The place marketing plan reaches the maximum success foreseen by the budget.","ru":"План place marketing достигает максимума успеха по бюджету."},{"id":"c","en":"Numerous opportunities that come from a correct tourist strategy.","ru":"Много возможностей от правильной туристической стратегии."},{"id":"d","en":"The territory receives funding to build tourist opportunities.","ru":"Территория получает финансирование на туристические проекты."}],"correct":"a","section":"Variant 04 — Part I (MCQ)","ru":"Что происходит при overtourism?"},{"num":"Variant 04 · Q4","id":"v04_mcq4","en":"What is a crucial challenge for \"Onplace\" Universities in the New Normal?","options":[{"id":"a","en":"Becoming e-learning centers.","ru":"Стать центрами e-learning."},{"id":"b","en":"Using online activity to generate the need to physically experience the local university life.","ru":"Через online создать потребность физически прожить локальную uni-жизнь."},{"id":"c","en":"Increasing the presence of new technological infrastructures.","ru":"Увеличить новые технологические инфраструктуры."},{"id":"d","en":"Encouraging the presence of students who study online.","ru":"Поощрять студентов, которые учатся только online."}],"correct":"b","section":"Variant 04 — Part I (MCQ)","ru":"Ключевой вызов для Onplace Universities в New Normal?","explain":"Onplace universities use online to strengthen the desire for on-campus, local experience."},{"num":"Variant 04 · Q5","id":"v04_mcq5","en":"How can a museum offer an \"onlife\" experience?","options":[{"id":"a","en":"By closing physical rooms and offering virtual tours.","ru":"Закрыв залы и дав только virtual tours."},{"id":"b","en":"By integrating human guides with robots that repeat customized information.","ru":"Соединив гидов с роботами, которые повторяют кастомную информацию."},{"id":"c","en":"By integrating the use of smartphones inside exhibition areas.","ru":"Просто разрешив смартфоны в залах."},{"id":"d","en":"By integrating the physical path with digital contents that enrich the meaning of the visit.","ru":"Соединив физический маршрут с digital-контентом, обогащающим смысл визита."}],"correct":"d","section":"Variant 04 — Part I (MCQ)","ru":"Как музей может дать onlife-опыт?"},{"num":"Variant 04 · Q6","id":"v04_mcq6","en":"\"Knowledge diffusion\" is the responsibility of the local government because:","options":[{"id":"a","en":"It is the only entity that legally possesses the rights to the historical truth of the place.","ru":"Только оно законно владеет «исторической правдой» места."},{"id":"b","en":"It creates the pre-conditions so that actors can connect and co-create value.","ru":"Оно создаёт условия, чтобы actors связывались и co-create value."},{"id":"c","en":"It serves to explain political choices to the population.","ru":"Это нужно, чтобы объяснять политические решения населению."},{"id":"d","en":"It multiplies the dissemination of culture.","ru":"Оно просто умножает распространение культуры."}],"correct":"b","section":"Variant 04 — Part I (MCQ)","ru":"Knowledge diffusion — ответственность local government, потому что:"},{"num":"Variant 04 · Q7","id":"v04_mcq7","en":"A Place in Quadrant \"d\" has a high level of democracy but suffers from:","options":[{"id":"a","en":"Difficulties in evolution and adaptation to new market challenges.","ru":"Сложностей эволюции и адаптации к новым рыночным вызовам."},{"id":"b","en":"Lack of dialogue among citizens.","ru":"Нехватки диалога между гражданами."},{"id":"c","en":"An excessive exploitation of resources.","ru":"Чрезмерной эксплуатации ресурсов."},{"id":"d","en":"An internet connection that is too fast and distracts the inhabitants.","ru":"Слишком быстрого интернета, отвлекающего жителей."}],"correct":"a","section":"Variant 04 — Part I (MCQ)","ru":"Place в квадранте d имеет высокий уровень democracy, но страдает от:"},{"num":"Variant 04 · Q8","id":"v04_mcq8","en":"The \"Survival\" purpose of a territorial system (VSA) depends on its:","options":[{"id":"a","en":"Amount of capital useful to manage the city's activities.","ru":"Объёма капитала для управления городом."},{"id":"b","en":"Ability to maintain the balance between internal variety and external variability.","ru":"Способности держать баланс внутренней variety и внешней variability."},{"id":"c","en":"Ability to plan with the collaboration of administrators.","ru":"Способности планировать вместе с администраторами."},{"id":"d","en":"Defining strategic objectives.","ru":"Определения стратегических целей."}],"correct":"b","section":"Variant 04 — Part I (MCQ)","ru":"Цель Survival территориальной системы (VSA) зависит от:"},{"num":"Variant 04 · Q9","id":"v04_mcq9","en":"Who are considered the \"primary stakeholders\" of a place?","options":[{"id":"a","en":"International tourists who contribute to economic development.","ru":"Международные туристы, дающие экономике."},{"id":"b","en":"Large multinationals looking for production sites to provide employment.","ru":"Крупные мультинационалы, ищущие площадки и рабочие места."},{"id":"c","en":"Residents and citizens who live in the territory daily.","ru":"Жители / граждане, которые живут на территории каждый день."},{"id":"d","en":"Rating agencies that assess the financial soundness of the local entity.","ru":"Рейтинговые агентства, оценивающие финансы локального органа."}],"correct":"c","section":"Variant 04 — Part I (MCQ)","ru":"Кто «primary stakeholders» места?"},{"num":"Variant 04 · Q10","id":"v04_mcq10","en":"The \"Placement\" (Distribution) lever defines:","options":[{"id":"a","en":"The positioning of a website in global search engines.","ru":"Позиции сайта в поисковиках."},{"id":"b","en":"The spatial context in which it is possible to enjoy the value proposition.","ru":"Пространственный контекст, где можно «пользоваться» value proposition."},{"id":"c","en":"The way shops are organized in the city.","ru":"Как организованы магазины в городе."},{"id":"d","en":"The urban organization of TCM.","ru":"Городскую организацию TCM."}],"correct":"b","section":"Variant 04 — Part I (MCQ)","ru":"Рычаг Placement (Distribution) определяет:"},{"num":"Variant 04 · Q11","id":"v04_mcq11","en":"Caroli's first strategy (1999) foresees:","options":[{"id":"a","en":"The abandonment of the current vocation to attract new industrial sectors.","ru":"Отказ от текущей vocation ради новых промышленных секторов."},{"id":"b","en":"The optimization of existing resources by reinforcing the current territorial vocation.","ru":"Оптимизацию существующих ресурсов и усиление текущей territorial vocation."},{"id":"c","en":"The sale of natural resources to finance local public debt.","ru":"Продажу природных ресурсов для погашения долга."},{"id":"d","en":"Encouraging citizens to carry on their traditions.","ru":"Поощрение граждан хранить традиции."}],"correct":"b","section":"Variant 04 — Part I (MCQ)","ru":"Первая стратегия Caroli (1999) предусматривает:"},{"num":"Variant 04 · Q12","id":"v04_mcq12","en":"\"Friction between actors\" occurs when:","options":[{"id":"a","en":"Individual goals are in strong conflict with the ultimate purpose of the place-system.","ru":"Индивидуальные цели сильно конфликтуют с ultimate purpose place-системы."},{"id":"b","en":"Two people actively participate in living labs.","ru":"Два человека активно участвуют в living labs."},{"id":"c","en":"Living labs do not work.","ru":"Living labs не работают."},{"id":"d","en":"Tourists and residents have the same interests.","ru":"Туристы и жители имеют одинаковые интересы."}],"correct":"a","section":"Variant 04 — Part I (MCQ)","ru":"Friction between actors возникает, когда:"},{"num":"Variant 04 · Q13","id":"v04_mcq13","en":"According to the Viable Systems Approach (VSA), a system is \"viable\" if:","options":[{"id":"a","en":"It possesses a high endowment of tangible resources.","ru":"У неё много tangible ресурсов."},{"id":"b","en":"It is isolated from global market dynamics to preserve its identity.","ru":"Она изолирована от мирового рынка, чтобы сохранить identity."},{"id":"c","en":"It is capable of surviving over time by adapting to changes in the context and environment.","ru":"Она способна выживать во времени, адаптируясь к изменениям контекста и среды."},{"id":"d","en":"It possesses a high endowment of intangible resources.","ru":"У неё много intangible ресурсов."}],"correct":"c","section":"Variant 04 — Part I (MCQ)","ru":"По VSA система viable, если:"},{"num":"Variant 04 · Q14","id":"v04_mcq14","en":"What characterizes Quadrant \"b\" (Medium technology, Medium relationship)?","options":[{"id":"a","en":"A smart city evolving according to value co-creation.","ru":"Smart city, эволюционирующий через value co-creation."},{"id":"b","en":"Absence of operational territorial marketing.","ru":"Отсутствие operational territorial marketing."},{"id":"c","en":"A Demand-driven approach focused on satisfying a specific target.","ru":"Demand-driven подход: удовлетворение конкретного target."},{"id":"d","en":"A technological dictatorship that limits the real needs of residents.","ru":"Технологическая диктатура, ограничивающая нужды жителей."}],"correct":"c","section":"Variant 04 — Part I (MCQ)","ru":"Что характеризует квадрант b (Medium tech, Medium relationship)?"},{"num":"Variant 04 · Q15","id":"v04_mcq15","en":"What is the main risk of the presence of \"free-riders\" in a CCN project?","options":[{"id":"a","en":"The depletion of collective resources due to those who benefit from advantages without contributing.","ru":"Истощение общих ресурсов теми, кто берёт выгоду, не внося вклад."},{"id":"b","en":"An excessive increase in commercial competition among shops in the same center.","ru":"Чрезмерный рост конкуренции между магазинами центра."},{"id":"c","en":"The closure of small independent shops in favor of extra-urban shopping malls.","ru":"Закрытие мелких магазинов в пользу загородных моллов."},{"id":"d","en":"Excessive tax pressure on residential property owners.","ru":"Чрезмерное налоговое давление на владельцев жилья."}],"correct":"a","section":"Variant 04 — Part I (MCQ)","ru":"Главный риск free-riders в проекте CCN?"},{"num":"Variant 04 · Q16","id":"v04_mcq16","en":"Why does territorial innovation require \"Inclusion\"?","options":[{"id":"a","en":"Because it is a constraint imposed by the regulations and directives of the European Commission.","ru":"Потому что так требуют директивы Еврокомиссии."},{"id":"b","en":"To increase the number of physical participants at technical and political tables.","ru":"Чтобы увеличить число людей за техническими/политическими столами."},{"id":"c","en":"Because true innovation does not exist without the active and convinced participation of the system of actors.","ru":"Потому что настоящей инновации нет без активного участия системы actors."},{"id":"d","en":"To multiply the decision-making autonomy of primary stakeholders and the government.","ru":"Чтобы умножить автономию решений stakeholders и правительства."}],"correct":"c","section":"Variant 04 — Part I (MCQ)","ru":"Почему территориальной инновации нужна Inclusion?"},{"num":"Variant 04 · Q17","id":"v04_mcq17","en":"The role of the University in a place strategy is that of:","options":[{"id":"a","en":"Catalyst and provider of knowledge for the application of the marketing framework to marketing management.","ru":"Катализатор знаний для применения marketing framework к marketing management."},{"id":"b","en":"Catalyst and provider of knowledge for attracting investments.","ru":"Катализатор знаний для привлечения инвестиций."},{"id":"c","en":"Catalyst and provider of knowledge for brand development.","ru":"Катализатор знаний для развития бренда."},{"id":"d","en":"Catalyst and provider of value through the dissemination of knowledge, projects, and human capital.","ru":"Катализатор ценности через распространение знаний, проектов и human capital."}],"correct":"d","section":"Variant 04 — Part I (MCQ)","ru":"Роль University в place-стратегии:"},{"num":"Variant 04 · Q18","id":"v04_mcq18","en":"What is meant by \"Place Brand Equity\"?","options":[{"id":"a","en":"The systematic result of the place's image and identity in the minds of stakeholders.","ru":"Системный результат image и identity места в головах stakeholders."},{"id":"b","en":"The total equity value expressed in euros of the city's brand.","ru":"Полная стоимость бренда города в евро."},{"id":"c","en":"The brand of the natural shopping center born from the TCM model.","ru":"Бренд natural shopping center из модели TCM."},{"id":"d","en":"The value of the total visitors to the city center.","ru":"Ценность всех посетителей центра города."}],"correct":"a","section":"Variant 04 — Part I (MCQ)","ru":"Что такое Place Brand Equity?"},{"num":"Variant 04 · Q19","id":"v04_mcq19","en":"The concept of \"Mutuality\" implies that actors:","options":[{"id":"a","en":"Participate in the co-design of the marketing plan.","ru":"Участвуют в co-design marketing plan."},{"id":"b","en":"Help each other to overcome the economic crisis.","ru":"Помогают друг другу пережить экономический кризис."},{"id":"c","en":"Work for a common ultimate purpose, sharing expectations, risks, and strategic results.","ru":"Работают на общую ultimate purpose, деля ожидания, риски и стратегические результаты."},{"id":"d","en":"All possess the same annual income level and professional qualification.","ru":"Все имеют одинаковый доход и квалификацию."}],"correct":"c","section":"Variant 04 — Part I (MCQ)","ru":"Mutuality значит, что actors:"},{"num":"Variant 05 · Q1","id":"v05_mcq1","en":"In an \"Actor-for-Actor\" (A4A) relationship, actors are characterized by:","options":[{"id":"a","en":"Competition aimed at reducing local opportunities in the city center."},{"id":"b","en":"Mutual support, tolerance, and shared systemic goals."},{"id":"c","en":"Mutual support and tolerance between businesses and the municipality."},{"id":"d","en":"Mutual support and tolerance between the municipality and stakeholders."}],"correct":"b","section":"Variant 05 — Part I (MCQ)","explain":"A4A = actors support one another for the shared goals of the whole place-system."},{"num":"Variant 05 · Q2","id":"v05_mcq2","en":"\"Mutuality\" among actors in an ecosystem means that:","options":[{"id":"a","en":"Each actor acts to maximize their own objective."},{"id":"b","en":"There is a legal contract that obliges merchants to provide mutual financial assistance."},{"id":"c","en":"Interactions are guided by respect for the final and common purpose of the place."},{"id":"d","en":"The actors must collaborate."}],"correct":"c","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q3","id":"v05_mcq3","en":"\"Soft Conditions\" include elements such as:","options":[{"id":"a","en":"The presence of widespread knowledge in the territory."},{"id":"b","en":"The number of banks and financial branches present in the municipal territory."},{"id":"c","en":"The training of operators."},{"id":"d","en":"The presence of strong social networks, creativity, and open-mindedness of the community."}],"correct":"d","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q4","id":"v05_mcq4","en":"What was the predominant focus of Place Marketing in the 1990s (first perspective)?","options":[{"id":"a","en":"Value co-creation based on horizontal relationships and well-being in use."},{"id":"b","en":"The development of complex smart mobility systems and urban big data management."},{"id":"c","en":"Place promotion and the selling of the territory."},{"id":"d","en":"The structural involvement of resident citizens in the design of community services."}],"correct":"c","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q5","id":"v05_mcq5","en":"Why is Place Marketing considered a \"complex\" process?","options":[{"id":"a","en":"Because it implies managing non-linear interactions among a multitude of actors and objectives."},{"id":"b","en":"Because it exclusively requires the use of high financial resources and state subsidies."},{"id":"c","en":"Because administrative boundaries prevent forms of inter-provincial collaboration."},{"id":"d","en":"Because it is complex to identify the real beneficiaries of the value proposition."}],"correct":"a","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q6","id":"v05_mcq6","en":"What is the ultimate goal of \"Value Co-creation Driven\" Place Marketing?","options":[{"id":"a","en":"Maximizing the profit of real estate companies and citizens in the city center."},{"id":"b","en":"The exponential increase in the number of tourists regardless of carrying capacity sustainability."},{"id":"c","en":"A centralization of all decisions in the hands of the municipality."},{"id":"d","en":"The well-being, satisfaction, and quality of life of stakeholders (internal and external)."}],"correct":"d","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q7","id":"v05_mcq7","en":"The \"15-minute neighbourhood\" is an urban model that aims to:","options":[{"id":"a","en":"Guarantee access to all essential services within a 15-minute radius on foot or by bicycle."},{"id":"b","en":"Improve collective decisions in the neighborhood."},{"id":"c","en":"Limit the maximum stay of tourists in premium areas of the historic center."},{"id":"d","en":"Reduce free parking time in urban lots to increase municipal revenues."}],"correct":"a","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q8","id":"v05_mcq8","en":"In the transition from transactional to relational marketing, the orientation shifts from:","options":[{"id":"a","en":"Collaboration to systemic conflict."},{"id":"b","en":"Conflict to collaboration and long-term trust."},{"id":"c","en":"Customer satisfaction to speculative maximization of sales volumes."},{"id":"d","en":"Open horizontal relationships to rigid and punitive vertical hierarchies."}],"correct":"b","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q9","id":"v05_mcq9","en":"What is meant by \"Value-in-use\" in the territorial context?","options":[{"id":"a","en":"The market price or cadastral value of a property located in a prestigious area."},{"id":"b","en":"The net cost of essential public services provided by the local administration."},{"id":"c","en":"The value predetermined by the local government and transferred linearly to the population."},{"id":"d","en":"The value that emerges during the process of consumption and resource integration by the user."}],"correct":"d","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q10","id":"v05_mcq10","en":"What is a frequent cause of failure in network projects (e.g., CCN - Natural Shopping Centers)?","options":[{"id":"a","en":"An excessive availability of non-repayable European financial funds."},{"id":"b","en":"Resistance to change and the lack of a shared strategic vision."},{"id":"c","en":"Too low a number of visitors in the city center."},{"id":"d","en":"The presence of an outdated commercial offer."}],"correct":"b","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q11","id":"v05_mcq11","en":"What is the role of \"Genius Loci\" in strategic positioning?","options":[{"id":"a","en":"A system of tangible assets."},{"id":"b","en":"The distinctive intangible asset that allows the place to differentiate itself from competitors."},{"id":"c","en":"The distinctive tangible asset that allows the place to differentiate itself from competitors."},{"id":"d","en":"A system of intangible assets."}],"correct":"b","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q12","id":"v05_mcq12","en":"What is meant by the \"Vocation\" of a territory in the sources?","options":[{"id":"a","en":"The identity and distinctive aptitude of an area toward specific activities (e.g., agricultural, industrial)."},{"id":"b","en":"The political and strategic direction of the municipality."},{"id":"c","en":"The placement of the municipality."},{"id":"d","en":"The logic of genius loci applied to strategy."}],"correct":"a","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q13","id":"v05_mcq13","en":"What characterizes an \"Onlife\" experience in urban commerce?","options":[{"id":"a","en":"The ban on using smartphones inside traditional physical stores."},{"id":"b","en":"The integration of e-commerce into traditional stores."},{"id":"c","en":"The integration between physical purchasing, social interaction, and personalized digital services."},{"id":"d","en":"The use of information technology to enhance the commercial offer."}],"correct":"c","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q14","id":"v05_mcq14","en":"What is the purpose of a territorial SWOT analysis?","options":[{"id":"a","en":"Identify strengths/weaknesses of primary stakeholders and opportunities/threats from the municipality."},{"id":"b","en":"Identify external strengths/weaknesses and internal opportunities/threats of the place-system."},{"id":"c","en":"Identify internal strengths/weaknesses and external opportunities/threats of the place-system."},{"id":"d","en":"Define the organizational chart and bureaucratic hierarchy within the municipal marketing office."}],"correct":"c","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q15","id":"v05_mcq15","en":"The \"Motor Valley\" case shows how a territorial system can:","options":[{"id":"a","en":"The positive role generated by automotive companies on the territory."},{"id":"b","en":"Enhance the territory by giving birth to places characterized by industrial production."},{"id":"c","en":"Enhance a territory with the presence of strategic organizations."},{"id":"d","en":"Bring forth a \"Place\" of global excellence through the integration of actors and skills."}],"correct":"d","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q16","id":"v05_mcq16","en":"In the evolutionary process of TCM (Town Centre Management), the first steps usually focus on:","options":[{"id":"a","en":"Generation of living labs."},{"id":"b","en":"Advanced management of complex algorithmic Big Data for consumer profiling."},{"id":"c","en":"Retail sector, property owners, and aesthetic improvement of the urban area."},{"id":"d","en":"Creation of a digital identity to integrate all actors."}],"correct":"c","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q17","id":"v05_mcq17","en":"The effectiveness of a CCN over time depends, among other things, on:","options":[{"id":"a","en":"Sharing a common strategy and implementing a single integrated collective activity among all actors managed by TCM managers."},{"id":"b","en":"Developing the knowledge of the private actors involved to speed up operational decisions."},{"id":"c","en":"Categorical exclusion of public bodies to avoid the delays of administrative bureaucracy."},{"id":"d","en":"Sharing a common vision and mutual long-term cooperation among actors."}],"correct":"d","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q18","id":"v05_mcq18","en":"What is meant by \"intentional observer\" in the context of perceiving complexity?","options":[{"id":"a","en":"One who studies the territory-place system and observes SWOT dynamics."},{"id":"b","en":"One who perceives and analyzes the system by coming into contact with it according to a specific perspective."},{"id":"c","en":"The policy maker presenting a top-down vision."},{"id":"d","en":"A passive user who receives the territorial value proposition without contributing to its evolution."}],"correct":"b","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 05 · Q19","id":"v05_mcq19","en":"What is the difference between \"Place Image\" and \"Place Brand\" according to Kavaratzis?","options":[{"id":"a","en":"The image is the mental perception of users; the brand includes relationships and strategic actions."},{"id":"b","en":"There is no conceptual or operational difference, they are interchangeable commercial synonyms."},{"id":"c","en":"The image is managed by the central State, the brand is created exclusively by private consortia."},{"id":"d","en":"The image concerns foreign tourists, the brand targets local residents."}],"correct":"a","section":"Variant 05 — Part I (MCQ)"},{"num":"Variant 06 · Q1","id":"v06_mcq1","en":"An \"Adaptive\" system in territorial marketing is a system that:","options":[{"id":"a","en":"Maintains its governance architecture unaltered regardless of external competitive pressures."},{"id":"b","en":"Modifies its strategic positioning exclusively based on seasonal fluctuations in tourist demand."},{"id":"c","en":"Follows rules shared by stakeholders to respond dynamically and homeostatically to environmental changes."},{"id":"d","en":"Delegates strategic decision-making processes to higher-level coordination bodies exogenous to the local network."}],"correct":"c","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q2","id":"v06_mcq2","en":"In a marketing plan for a CCN, the \"Safety\" lever is measured by:","options":[{"id":"a","en":"The increase in physical private security presence along the commercial perimeters of the urban district."},{"id":"b","en":"The reduction of real crime and the parallel improvement in users' perception of protection."},{"id":"c","en":"The statistical reduction of real crime and the parallel improvement in users' perception on safety at work."},{"id":"d","en":"The degree of compliance of physical commercial infrastructures with European regulations on safety at work."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q3","id":"v06_mcq3","en":"In a \"Smart City\", technology must be understood as:","options":[{"id":"a","en":"The primary and self-sufficient infrastructure to which the relational dynamics of the actors must be subordinated."},{"id":"b","en":"An enabling tool to optimize value co-creation, efficiency, and well-being of the actors."},{"id":"c","en":"A purely tangible operant resource aimed at reducing fixed costs of the Public Administration."},{"id":"d","en":"A proprietary framework aimed at the acquisition and monetization of behavioral profiles."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q4","id":"v06_mcq4","en":"What is the most relevant indicator (KPI) to evaluate \"Town Center Progress\"?","options":[{"id":"a","en":"The rate of increase in private vehicle traffic flows recorded during peak commercial hours."},{"id":"b","en":"The variety of the offer and the quality of maintenance of streets and public services."},{"id":"c","en":"The overall volume of administrative sanctions issued by local police bodies in the district."},{"id":"d","en":"The share of budget allocations exclusively destined for asynchronous promotional activities."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q5","id":"v06_mcq5","en":"\"Co-production\" differs from \"co-creation\" because it:","options":[{"id":"a","en":"Implies the direct and operational participation of the customer or stakeholder in the design or realization of the offer."},{"id":"b","en":"Focuses solely on the phenomenological and experiential dimension of value-in-use within the context."},{"id":"c","en":"Implies the direct and operational participation of the municipality in the development of ideas deriving from external investors."},{"id":"d","en":"Presupposes the absence of institutional arrangements and shared norms at the transactional ecosystem level."}],"correct":"a","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q6","id":"v06_mcq6","en":"The concept of urban \"Servicescape\" problematizes the city as:","options":[{"id":"a","en":"A logistical agglomeration mainly aimed at the efficient movement of material operant resources."},{"id":"b","en":"A structured physical and relational scenario of delivery and enjoyment in which the interaction between actors creates and perceives the service."},{"id":"c","en":"A purely digital architecture in which onlife interactions disregard spatial proximity constraints."},{"id":"d","en":"A vertically integrated production district where value is embedded in distributed physical goods."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q7","id":"v06_mcq7","en":"The concept of \"Value Co-creation\" implies that:","options":[{"id":"a","en":"Value is uniquely predetermined by the producer actor and expressed through exchange value."},{"id":"b","en":"Value emerges from interaction, collaboration, and resource integration among a plurality of actors."},{"id":"c","en":"Value equates exclusively with the marginal utility extracted by the consumer in isolation."},{"id":"d","en":"Value is configured through top-down processes regulated by centralized institutions of the State."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q8","id":"v06_mcq8","en":"In the classification of drivers of change, \"exogenous\" factors are:","options":[{"id":"a","en":"Forces external to the place-system, which favor the practical transformation of place marketing strategies."},{"id":"b","en":"Structural innovation demands raised by trade associations rooted in the district."},{"id":"c","en":"Forces external to the place-system, such as global technological macro-trends, climate change, or pandemic events."},{"id":"d","en":"Internal demographic dynamics connected to the residential mobility flows of the historical population."}],"correct":"c","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q9","id":"v06_mcq9","en":"A territorial service ecosystem (Service Ecosystem) is defined as stable when:","options":[{"id":"a","en":"It is regulated by shared institutions, norms, and meanings that facilitate coordination and adaptation."},{"id":"b","en":"It consolidates rigid entry barriers that inhibit the access of new external operant actors."},{"id":"c","en":"It neutralizes digitalization processes to preserve the balance of traditional relationships."},{"id":"d","en":"It adopts hierarchical and inflexible governance that excludes local actor participation."}],"correct":"a","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q10","id":"v06_mcq10","en":"What specifically describes the phenomenon of \"Overtourism\"?","options":[{"id":"a","en":"A greater tourism opportunity generated by place marketing that needs no further monitoring."},{"id":"b","en":"A greater tourism opportunity to be monitored because it is generated by place marketing."},{"id":"c","en":"A greater tourism opportunity generated by place marketing."},{"id":"d","en":"An excessive anthropogenic load that compromises the quality of life of residents and the integrity of the local ecosystem."}],"correct":"d","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q11","id":"v06_mcq11","en":"In the \"Promotion\" lever of place marketing, the main objective is to:","options":[{"id":"a","en":"Generate tariff economies of scale to increase raw access volumes to the territorial system."},{"id":"b","en":"Communicate the Place Value Proposition to align the perceived image with the real identity of the territory."},{"id":"c","en":"Implement integrated information systems to monitor the onlife consumption behaviors of stakeholders."},{"id":"d","en":"Restructure traditional distribution channels by modifying vertical relationships between market intermediaries."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q12","id":"v06_mcq12","en":"Town Centre Management (TCM) was originally born as a response to:","options":[{"id":"a","en":"The strong competition exerted by out-of-town shopping centres."},{"id":"b","en":"The drives toward privatization of essential public services imposed by spending review regulations."},{"id":"c","en":"The need to redefine the administrative and electoral boundaries of metropolitan municipalities."},{"id":"d","en":"De-industrialization tendencies of urban centers in favor of peripheral manufacturing districts."}],"correct":"a","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q13","id":"v06_mcq13","en":"What is meant by \"Place Brand Identity\"?","options":[{"id":"a","en":"The set of stereotypical perceptions and mental associations developed by external demand markets."},{"id":"b","en":"The complex of visual elements, graphics, and registered trademarks filed by the management consortium."},{"id":"c","en":"The set of distinctive, historical, cultural, and value traits that the territory stably decides to propose."},{"id":"d","en":"The competitive positioning of the place-system within international place brand rankings."}],"correct":"c","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q14","id":"v06_mcq14","en":"Why is the \"Bottom-up\" approach considered crucial in Natural Shopping Center (CCN) projects?","options":[{"id":"a","en":"It accelerates the adoption of emergency administrative ordinances, bypassing trade union consultation tables."},{"id":"b","en":"It favors spontaneous engagement of actors, mutual trust, and reduces resistance to change."},{"id":"c","en":"It allows the elimination of public structural investment costs through recourse to venture capital."},{"id":"d","en":"It favors spontaneous engagement of actors, developing the work of the municipality."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q15","id":"v06_mcq15","en":"The \"Genius Loci\" represents:","options":[{"id":"a","en":"A predictive mathematical model applied to the logistics optimization of smart mobility flows."},{"id":"b","en":"The professional profile of the manager responsible for the operational coordination of the place branding agency."},{"id":"c","en":"A theoretical framework aimed at measuring the concentration of place marketing principles."},{"id":"d","en":"The spirit of the place, namely the unique intertwining of historical, cultural, material, and intangible elements that characterize it."}],"correct":"d","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q16","id":"v06_mcq16","en":"The model of the \"15-minute city\" aims to:","options":[{"id":"a","en":"Guarantee physical proximity and access to essential services to increase collaboration in the city center."},{"id":"b","en":"Guarantee physical proximity and access to essential services to raise sustainability and quality of life."},{"id":"c","en":"Rationalize public transport vectors by abolishing intermediate low-density stations."},{"id":"d","en":"Standardize the offer of central commercial districts to align it with urban commuting rhythms."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q17","id":"v06_mcq17","en":"An evident limitation of territorial marketing projects based on \"Promotion\" alone is:","options":[{"id":"a","en":"The creation of high expectations not supported by the real substance of the place."},{"id":"b","en":"Financial unsustainability deriving from fixed maintenance costs of onlife server infrastructures."},{"id":"c","en":"The loss of jurisdictional autonomy of the local authority in favor of external communication agencies."},{"id":"d","en":"The exclusive polarization of positioning on low-income resident demand segments."}],"correct":"a","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q18","id":"v06_mcq18","en":"What does the concept of \"Value-in-context\" properly express?","options":[{"id":"a","en":"The equity value of a territorial asset estimated using only local real estate indicators."},{"id":"b","en":"That the utility of an operant resource remains constant as the cultural characteristics of the beneficiary vary."},{"id":"c","en":"The equilibrium price defined by competitive interaction between demand and supply in a closed market."},{"id":"d","en":"That the value of a resource strictly depends on contingencies, relationships, and the specific environment."}],"correct":"d","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 06 · Q19","id":"v06_mcq19","en":"A \"Free-rider\" within a Natural Shopping Center is:","options":[{"id":"a","en":"An end user who enjoys free logistics services of the district without generating commercial transactions."},{"id":"b","en":"A network actor who benefits from collective advantages without contributing in any way to costs or activities."},{"id":"c","en":"A non-authorized commercial operator practicing dumping outside the urban perimeter."},{"id":"d","en":"An exogenous investor acquiring real estate assets in the historic center for purely speculative purposes."}],"correct":"b","section":"Variant 06 — Part I (MCQ)"},{"num":"Variant 07 · Q1","id":"v07_mcq1","en":"In relationship marketing firms focus on __________ relationships with __________","options":[{"id":"a","en":"short-term; customers and suppliers"},{"id":"b","en":"long-term; customers and suppliers"},{"id":"c","en":"short-term; customers"},{"id":"d","en":"long-term; customers"}],"correct":"b","section":"Variant 07 — Part I (MCQ)"},{"num":"Variant 07 · Q2","id":"v07_mcq2","en":"It is the sum of beliefs, ideas, impressions that people have of a brand or a place","options":[{"id":"a","en":"we are talking about identity"},{"id":"b","en":"we are talking about image"},{"id":"c","en":"we are talking about positioning"}],"correct":"b","section":"Variant 07 — Part I (MCQ)"},{"num":"Variant 08 · Q1","id":"v08_mcq1","en":"__________ is about matching market opportunities to the organization's resources (what it can do) and objectives (what management wants to do).","options":[{"id":"a","en":"Marketing communications"},{"id":"b","en":"Market research"},{"id":"c","en":"Marketing strategy"},{"id":"d","en":"Market segmentation"}],"correct":"c","section":"Variant 08 — Part I (MCQ)"},{"num":"Variant 08 · Q2","id":"v08_mcq2","en":"The standardization of the offering is:","options":[{"id":"a","en":"the solution to \"sell\" your Place in the world"},{"id":"b","en":"the solution to \"sell\" your Place in your Country"},{"id":"c","en":"could be a solution in some situations"}],"correct":"c","section":"Variant 08 — Part I (MCQ)"},{"num":"Variant 09 · Q10","id":"v09_mcq1","en":"In place marketing, the 'Place' element of the marketing mix refers to:","options":[{"id":"a","en":"The positioning of a website in global search engines."},{"id":"b","en":"The spatial context in which it is possible to enjoy the value proposition."},{"id":"c","en":"The way shops are organized in the city."},{"id":"d","en":"The urban organization of TCM."}],"correct":"b","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q11","id":"v09_mcq2","en":"Caroli's first strategy (1999) foresees:","options":[{"id":"a","en":"The abandonment of the current vocation to attract new industrial sectors."},{"id":"b","en":"The optimization of existing resources by reinforcing the current territorial vocation."},{"id":"c","en":"The sale of natural resources to finance local public debt."},{"id":"d","en":"Encouraging citizens to carry on their traditions."}],"correct":"b","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q12","id":"v09_mcq3","en":"\"Friction between actors\" occurs when:","options":[{"id":"a","en":"Individual goals are in strong conflict with the ultimate purpose of the place-system."},{"id":"b","en":"Two people actively participate in living labs."},{"id":"c","en":"Living labs do not work."},{"id":"d","en":"Tourists and residents have the same interests."}],"correct":"a","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q13","id":"v09_mcq4","en":"According to the Viable Systems Approach (VSA), a system is \"viable\" if:","options":[{"id":"a","en":"It possesses a high endowment of tangible resources."},{"id":"b","en":"It is isolated from global market dynamics to preserve its identity."},{"id":"c","en":"It is capable of surviving over time by adapting to changes in the context and environment."},{"id":"d","en":"It possesses a high endowment of intangible resources."}],"correct":"c","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q14","id":"v09_mcq5","en":"What characterizes Quadrant \"b\" (Medium technology, Medium relationship)?","options":[{"id":"a","en":"A smart city evolving according to value co-creation."},{"id":"b","en":"Absence of operational territorial marketing."},{"id":"c","en":"A Demand-driven approach focused on satisfying a specific target."},{"id":"d","en":"A technological dictatorship that limits the real needs of residents."}],"correct":"c","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q15","id":"v09_mcq6","en":"What is the main risk of the presence of \"free-riders\" in a CCN project?","options":[{"id":"a","en":"The depletion of collective resources due to those who benefit from advantages without contributing."},{"id":"b","en":"An excessive increase in commercial competition among shops in the same center."},{"id":"c","en":"The closure of small independent shops in favor of extra-urban shopping malls."},{"id":"d","en":"Excessive tax pressure on residential property owners."}],"correct":"a","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q16","id":"v09_mcq7","en":"Why does territorial innovation require \"Inclusion\"?","options":[{"id":"a","en":"Because it is a constraint imposed by the regulations and directives of the European Commission."},{"id":"b","en":"To increase the number of physical participants at technical and political tables."},{"id":"c","en":"Because true innovation does not exist without the active and convinced participation of the system of actors."},{"id":"d","en":"To multiply the decision-making autonomy of primary stakeholders and the government."}],"correct":"c","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q17","id":"v09_mcq8","en":"The role of the University in a place strategy is that of:","options":[{"id":"a","en":"Catalyst and provider of knowledge for the application of the marketing framework to marketing management."},{"id":"b","en":"Catalyst and provider of knowledge for attracting investments."},{"id":"c","en":"Catalyst and provider of knowledge for brand development."},{"id":"d","en":"Catalyst and provider of value through the dissemination of knowledge, projects, and human capital."}],"correct":"d","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q18","id":"v09_mcq9","en":"What is meant by \"Place Brand Equity\"?","options":[{"id":"a","en":"The systematic result of the place's image and identity in the minds of stakeholders."},{"id":"b","en":"The total equity value expressed in euros of the city's brand."},{"id":"c","en":"The brand of the natural shopping center born from the TCM model."},{"id":"d","en":"The value of the total visitors to the city center."}],"correct":"a","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 09 · Q19","id":"v09_mcq10","en":"The concept of \"Mutuality\" implies that actors:","options":[{"id":"a","en":"Participate in the co-design of the marketing plan."},{"id":"b","en":"Help each other to overcome the economic crisis."},{"id":"c","en":"Work for a common ultimate purpose, sharing expectations, risks, and strategic results."},{"id":"d","en":"All possess the same annual income level and professional qualification."}],"correct":"c","section":"Variant 09 — Part I (MCQ)"},{"num":"Variant 10 · Q1","id":"v10_mcq1","en":"What does it mean to be an \"intentional observer\" in the context of perceiving complexity?","options":[{"id":"a","en":"One who perceives and analyzes the system by coming into contact with it from a specific perspective."},{"id":"b","en":"A data analysis software that monitors tourist flows in an automated way."},{"id":"c","en":"The policy maker who imposes a top-down vision without consulting stakeholders."},{"id":"d","en":"A passive user who receives the value proposition without contributing to its definition."}],"correct":"a","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q2","id":"v10_mcq2","en":"What is the difference between \"Place Image\" and \"Place Brand\" according to Kavaratzis?","options":[{"id":"a","en":"There is no difference; they are interchangeable synonyms."},{"id":"b","en":"Image is the mental perception of users; the brand includes relationships and strategic actions."},{"id":"c","en":"Image is managed by the State, the brand is created exclusively by private entities."},{"id":"d","en":"Image concerns tourists, the brand concerns only local residents."}],"correct":"b","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q3","id":"v10_mcq3","en":"The local government as a \"Movie Director\" must:","options":[{"id":"a","en":"Control every single word spoken by citizens."},{"id":"b","en":"Replace local inhabitants with professional actors for promotional videos."},{"id":"c","en":"Exclusively produce documentaries on the ancient history of the place."},{"id":"d","en":"Encourage actors to suggest ideas and projects aligned with the general strategy."}],"correct":"d","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q4","id":"v10_mcq4","en":"Why does territorial innovation require \"Inclusion\"?","options":[{"id":"a","en":"Because true innovation does not exist without the active participation of the system of actors."},{"id":"b","en":"Because it is a legal requirement imposed by European Commission directives."},{"id":"c","en":"To artificially increase the number of participants at technical roundtables."},{"id":"d","en":"To reduce the decision-making power of marketing experts in favor of the crowd."}],"correct":"a","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q5","id":"v10_mcq5","en":"The role of the University in a place strategy is that of:","options":[{"id":"a","en":"A simple provider of degrees detached from the real economy."},{"id":"b","en":"A catalyst and provider of value through the dissemination of knowledge and projects."},{"id":"c","en":"A censorship body for residents' critical opinions toward the government."},{"id":"d","en":"A purely theoretical entity that must remain isolated from market dynamics."}],"correct":"b","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q6","id":"v10_mcq6","en":"What is meant by \"Place Brand Equity\"?","options":[{"id":"a","en":"The asset value of historical buildings located in the city center."},{"id":"b","en":"The net profit generated by the commercial activities of a Natural Shopping Center."},{"id":"c","en":"The systematic result of the place's image and identity in the minds of stakeholders."},{"id":"d","en":"The number of annual visitors multiplied by the average per capita expenditure."}],"correct":"c","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q7","id":"v10_mcq7","en":"The concept of \"Mutuality\" implies that actors:","options":[{"id":"a","en":"Are all related to one another."},{"id":"b","en":"Are obliged to sign a financial mutual assistance contract."},{"id":"c","en":"All have the same income and education level."},{"id":"d","en":"Work for a common ultimate purpose, sharing expectations and results."}],"correct":"d","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q8","id":"v10_mcq8","en":"The \"Placement\" lever in place marketing concerns:","options":[{"id":"a","en":"The delivery channels of place marketing communication."},{"id":"b","en":"The positioning of the place marketing strategy."},{"id":"c","en":"The spatial context where the user recognizes and enjoys the value proposition."},{"id":"d","en":"A strategic element of the marketing plan."}],"correct":"c","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q9","id":"v10_mcq9","en":"The \"PESTEL\" analysis in the marketing plan serves to monitor:","options":[{"id":"a","en":"Elements of the marketing microenvironment."},{"id":"b","en":"Direct competition between two commercial businesses on the same street."},{"id":"c","en":"The level of street cleanliness and maintenance of public gardens."},{"id":"d","en":"External Political, Economic, Social, Technological, Environmental, and Legal factors."}],"correct":"d","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q10","id":"v10_mcq10","en":"What is the primary purpose of Town Centre Management (TCM) schemes?","options":[{"id":"a","en":"To revitalize city centers through public-private partnerships."},{"id":"b","en":"To shift downtown commerce toward large shopping malls outside the city."},{"id":"c","en":"To eliminate the presence of independent shops in favor of an association."},{"id":"d","en":"To limit the installation of shopping centers in the city center."}],"correct":"a","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q11","id":"v10_mcq11","en":"\"Big Data\" in place marketing are useful because:","options":[{"id":"a","en":"They allow collecting information for the management of the municipality's strategy."},{"id":"b","en":"They improve the understanding of social dynamics and markets through flow analysis."},{"id":"c","en":"They reduce the need to interact with the real population."},{"id":"d","en":"They allow automating completely the creation of the Place Image."}],"correct":"b","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q12","id":"v10_mcq12","en":"What is the role of \"Nudges\" (gentle pushes) according to the sources?","options":[{"id":"a","en":"Non-monetary sanctions for those who do not respect the environment."},{"id":"b","en":"Orders issued by the municipality in relation to TCM."},{"id":"c","en":"Small informational stimuli to guide citizens toward virtuous and conscious behaviors."},{"id":"d","en":"Advertising to attract tourists."}],"correct":"c","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q13","id":"v10_mcq13","en":"An \"Adaptive\" system in territorial marketing is a system that:","options":[{"id":"a","en":"Refuses to change to keep its historical image unaltered."},{"id":"b","en":"Changes strategy every day based on feedback from social networks."},{"id":"c","en":"Is imposed by the central government without direct local consultation."},{"id":"d","en":"Follows rules shared by stakeholders to respond to environmental changes."}],"correct":"d","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q14","id":"v10_mcq14","en":"In a marketing plan for a CCN, the \"Safety\" lever is measured through:","options":[{"id":"a","en":"The reduction of real crime and the improvement of users' perception of protection."},{"id":"b","en":"It is a KPI and indicates the number of fines issued by the municipal police for parking violations."},{"id":"c","en":"The number of surveillance interventions arranged during the year."},{"id":"d","en":"The response speed of local police in the city."}],"correct":"a","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q15","id":"v10_mcq15","en":"In a \"Smart City\", technology must be understood as:","options":[{"id":"a","en":"An ultimate goal of urban development to which privacy is sacrificed."},{"id":"b","en":"A tool to optimize the co-creation of value and the well-being of citizens."},{"id":"c","en":"An incidental cost to be eliminated to balance the municipal budget."},{"id":"d","en":"A substitute for human skills in the political decision process."}],"correct":"b","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q16","id":"v10_mcq16","en":"In the \"movie director\" governance model, the role of government is:","options":[{"id":"a","en":"To write the strategy and objectives and suggest actions to the actors."},{"id":"b","en":"To passively monitor markets without intervening in the strategy."},{"id":"c","en":"To encourage actors to integrate knowledge for a common ultimate purpose."},{"id":"d","en":"To manage the legal and bureaucratic aspects of the territory."}],"correct":"a","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q17","id":"v10_mcq17","en":"\"Co-production\" differs from \"co-creation\" because:","options":[{"id":"a","en":"It only concerns the experiential value-in-use of the final user."},{"id":"b","en":"It implies the direct participation of the customer in the design or realization of the offering."},{"id":"c","en":"It is a process that partially excludes the public administration."},{"id":"d","en":"It applies exclusively to services in the city."}],"correct":"b","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q18","id":"v10_mcq18","en":"The urban \"Servicescape\" concept problematizes the city as:","options":[{"id":"a","en":"A setting where the interaction among actors creates and perceives the service offering."},{"id":"b","en":"A context in which the services of the city develop."},{"id":"c","en":"A non-place devoid of identity and meaningful social relationships."},{"id":"d","en":"An administrative structure aimed at managing public services."}],"correct":"a","section":"Variant 10 — Part I (MCQ)"},{"num":"Variant 10 · Q19","id":"v10_mcq19","en":"\"Change Aversion\" can be overcome through:","options":[{"id":"a","en":"Limits generated by those who hinder development."},{"id":"b","en":"Proposing the replacement of downtown entrepreneurs not aligned with TCM."},{"id":"c","en":"The dissemination of knowledge and the involvement of stakeholders in the design process."},{"id":"d","en":"The total elimination of every existing rule in the territory."}],"correct":"c","section":"Variant 10 — Part I (MCQ)"}];
    const OPEN_ITEMS = [];
    const SNA_ITEMS = [];

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    const VARIANT_PAGES = (() => {
      const order = [];
      const map = new Map();
      QUESTIONS.forEach((q) => {
        const m = q.section?.match(/Variant (\d+)/);
        if (!m) return;
        const v = m[1];
        if (!map.has(v)) {
          map.set(v, order.length);
          order.push(v);
        }
      });
      return { order, map };
    })();

    let currentPage = 0;
    let paginatorTop = null;
    let paginatorBottom = null;
    let paginationLocked = false;

    function pageForQuestion(q) {
      const m = q.section?.match(/Variant (\d+)/);
      if (!m) return 0;
      return VARIANT_PAGES.map.get(m[1]) ?? 0;
    }

    function totalPageCount() {
      return Math.max(1, VARIANT_PAGES.order.length);
    }

    function needsPagination() {
      return totalPageCount() > 1;
    }

    function pageLabel(page) {
      const v = VARIANT_PAGES.order[page];
      const count = QUESTIONS.filter((q) => pageForQuestion(q) === page).length;
      return 'Variant ' + v + ' · ' + count + ' MCQ · page ' + (page + 1) + ' of ' + totalPageCount();
    }

    function createPaginator(className) {
      const el = document.createElement('div');
      el.className = className;
      el.innerHTML = '<span class="paginator-info"></span><div class="paginator-btns">' +
        '<button type="button" class="secondary" data-nav="prev">← Previous</button>' +
        '<button type="button" class="secondary" data-nav="next">Next →</button></div>';
      el.querySelector('[data-nav="prev"]').addEventListener('click', () => goToPage(currentPage - 1));
      el.querySelector('[data-nav="next"]').addEventListener('click', () => goToPage(currentPage + 1));
      return el;
    }

    function updatePaginator() {
      const show = needsPagination() && !paginationLocked;
      [paginatorTop, paginatorBottom].forEach((p) => {
        if (!p) return;
        p.style.display = show ? '' : 'none';
        if (!show) return;
        p.querySelector('.paginator-info').textContent = pageLabel(currentPage);
        p.querySelector('[data-nav="prev"]').disabled = currentPage <= 0;
        p.querySelector('[data-nav="next"]').disabled = currentPage >= totalPageCount() - 1;
      });
      updateCheckButton();
    }

    function applyPageVisibility() {
      container.querySelectorAll('[data-page]').forEach((el) => {
        const p = Number(el.dataset.page);
        el.classList.toggle('page-hidden', paginationLocked ? false : p !== currentPage);
      });
      updatePaginator();
    }

    function goToPage(page) {
      if (paginationLocked) return;
      currentPage = Math.max(0, Math.min(totalPageCount() - 1, page));
      applyPageVisibility();
