  <script>
    const SCORING = {"correct":1,"wrong":0,"max":19};
    const QUESTIONS = [{"num":1,"id":"q1","en":"What does it mean to be an \"intentional observer\" in the context of perceiving complexity?","ru":"Что значит быть «intentional observer» при восприятии сложности?","options":[{"id":"a","en":"One who perceives and analyzes the system by coming into contact with it from a specific perspective.","ru":"Тот, кто воспринимает и анализирует систему, вступая с ней в контакт с определённой позиции"},{"id":"b","en":"A data analysis software that monitors tourist flows in an automated way.","ru":"ПО для автоматического мониторинга туристических потоков"},{"id":"c","en":"The policy maker who imposes a top-down vision without consulting stakeholders.","ru":"Политик, навязывающий top-down видение без консультаций"},{"id":"d","en":"A passive user who receives the value proposition without contributing to its definition.","ru":"Пассивный пользователь, получающий value proposition без участия в её определении"}],"correct":"a","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Intentional observer — активный наблюдатель с позиции, а не пассивный пользователь и не автоматика."},{"num":2,"id":"q2","en":"What is the difference between \"Place Image\" and \"Place Brand\" according to Kavaratzis?","ru":"Разница между Place Image и Place Brand по Kavaratzis:","options":[{"id":"a","en":"There is no difference; they are interchangeable synonyms.","ru":"Разницы нет, это синонимы"},{"id":"b","en":"Image is the mental perception of users; the brand includes relationships and strategic actions.","ru":"Image — ментальное восприятие; brand включает отношения и стратегические действия"},{"id":"c","en":"Image is managed by the State, the brand is created exclusively by private entities.","ru":"Image управляет государство, brand — только частный сектор"},{"id":"d","en":"Image concerns tourists, the brand concerns only local residents.","ru":"Image — для туристов, brand — только для жителей"}],"correct":"b","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Kavaratzis: image = восприятие; brand шире — стратегия, отношения, действия."},{"num":3,"id":"q3","en":"The local government as a \"Movie Director\" must:","ru":"Местная власть как «Movie Director» должна:","options":[{"id":"a","en":"Control every single word spoken by citizens.","ru":"Контролировать каждое слово граждан"},{"id":"b","en":"Replace local inhabitants with professional actors for promotional videos.","ru":"Заменять жителей профессиональными актёрами в роликах"},{"id":"c","en":"Exclusively produce documentaries on the ancient history of the place.","ru":"Только снимать документалки об истории места"},{"id":"d","en":"Encourage actors to suggest ideas and projects aligned with the general strategy.","ru":"Поощрять акторов предлагать идеи и проекты в русле общей стратегии"}],"correct":"d","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Режиссёр задаёт стратегию, но не диктует всё — акторы предлагают идеи в её рамках."},{"num":4,"id":"q4","en":"Why does territorial innovation require \"Inclusion\"?","ru":"Почему территориальные инновации требуют Inclusion?","options":[{"id":"a","en":"Because true innovation does not exist without the active participation of the system of actors.","ru":"Настоящих инноваций нет без активного участия системы акторов"},{"id":"b","en":"Because it is a legal requirement imposed by European Commission directives.","ru":"Это юридическое требование Еврокомиссии"},{"id":"c","en":"To artificially increase the number of participants at technical roundtables.","ru":"Чтобы искусственно увеличить число участников круглых столов"},{"id":"d","en":"To reduce the decision-making power of marketing experts in favor of the crowd.","ru":"Чтобы снизить власть маркетологов в пользу толпы"}],"correct":"a","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Инновация = co-creation; без включения акторов она не работает."},{"num":5,"id":"q5","en":"The role of the University in a place strategy is that of:","ru":"Роль университета в place strategy:","options":[{"id":"a","en":"A simple provider of degrees detached from the real economy.","ru":"Просто выдаёт дипломы, оторванные от экономики"},{"id":"b","en":"A catalyst and provider of value through the dissemination of knowledge and projects.","ru":"Катализатор ценности через распространение знаний и проектов"},{"id":"c","en":"A censorship body for residents' critical opinions toward the government.","ru":"Орган цензуры критики жителей к власти"},{"id":"d","en":"A purely theoretical entity that must remain isolated from market dynamics.","ru":"Чисто теоретическая сущность, изолированная от рынка"}],"correct":"b","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Университет — катализатор знаний, проектов и human capital для территории."},{"num":6,"id":"q6","en":"What is meant by \"Place Brand Equity\"?","ru":"Что такое «Place Brand Equity»?","options":[{"id":"a","en":"The asset value of historical buildings located in the city center.","ru":"Стоимость исторических зданий в центре"},{"id":"b","en":"The net profit generated by the commercial activities of a Natural Shopping Center.","ru":"Чистая прибыль Natural Shopping Center"},{"id":"c","en":"The systematic result of the place's image and identity in the minds of stakeholders.","ru":"Системный результат image и identity в сознании стейкхолдеров"},{"id":"d","en":"The number of annual visitors multiplied by the average per capita expenditure.","ru":"Число посетителей × средние траты на человека"}],"correct":"c","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Brand equity места — накопленный образ (image + identity), не деньги на счёте."},{"num":7,"id":"q7","en":"The concept of \"Mutuality\" implies that actors:","ru":"Концепция «Mutuality» означает, что акторы:","options":[{"id":"a","en":"Are all related to one another.","ru":"Все связаны друг с другом"},{"id":"b","en":"Are obliged to sign a financial mutual assistance contract.","ru":"Обязаны подписать договор взаимопомощи"},{"id":"c","en":"All have the same income and education level.","ru":"Имеют одинаковый доход и образование"},{"id":"d","en":"Work for a common ultimate purpose, sharing expectations and results.","ru":"Работают на общую цель, деля ожидания и результаты"}],"correct":"d","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Mutuality = общая финальная цель места; акторы разделяют риски и результаты."},{"num":8,"id":"q8","en":"The \"Placement\" lever in place marketing concerns:","ru":"Рычаг «Placement» в place marketing касается:","options":[{"id":"a","en":"The delivery channels of place marketing communication.","ru":"Каналов коммуникации place marketing"},{"id":"b","en":"The positioning of the place marketing strategy.","ru":"Позиционирования стратегии place marketing"},{"id":"c","en":"The spatial context where the user recognizes and enjoys the value proposition.","ru":"Пространственного контекста, где пользователь получает value proposition"},{"id":"d","en":"A strategic element of the marketing plan.","ru":"Стратегического элемента marketing plan"}],"correct":"c","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Placement = distribution: пространство/доступ, где пользователь получает ценность места."},{"num":9,"id":"q9","en":"The \"PESTEL\" analysis in the marketing plan serves to monitor:","ru":"PESTEL-анализ в marketing plan служит для мониторинга:","options":[{"id":"a","en":"Elements of the marketing microenvironment.","ru":"Элементов микросреды маркетинга"},{"id":"b","en":"Direct competition between two commercial businesses on the same street.","ru":"Прямой конкуренции двух магазинов на одной улице"},{"id":"c","en":"The level of street cleanliness and maintenance of public gardens.","ru":"Чистоты улиц и содержания парков"},{"id":"d","en":"External Political, Economic, Social, Technological, Environmental, and Legal factors.","ru":"Внешних политических, экономических, социальных, технологических, экологических и правовых факторов"}],"correct":"d","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"PESTEL = макросреда (внешние факторы), не микросреда."},{"num":10,"id":"q10","en":"What is the primary purpose of Town Centre Management (TCM) schemes?","ru":"Главная цель схем Town Centre Management (TCM)?","options":[{"id":"a","en":"To revitalize city centers through public-private partnerships.","ru":"Ревитализация центров через public-private partnerships"},{"id":"b","en":"To shift downtown commerce toward large shopping malls outside the city.","ru":"Перенос торговли в ТЦ за городом"},{"id":"c","en":"To eliminate the presence of independent shops in favor of an association.","ru":"Устранение независимых магазинов ради ассоциации"},{"id":"d","en":"To limit the installation of shopping centers in the city center.","ru":"Ограничение ТЦ в центре города"}],"correct":"a","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"TCM = партнёрство власти, бизнеса и жителей для оживления центра."},{"num":11,"id":"q11","en":"\"Big Data\" in place marketing are useful because:","ru":"«Big Data» в place marketing полезны, потому что:","options":[{"id":"a","en":"They allow collecting information for the management of the municipality's strategy.","ru":"Позволяют собирать данные для стратегии муниципалитета"},{"id":"b","en":"They improve the understanding of social dynamics and markets through flow analysis.","ru":"Улучшают понимание социальной динамики и рынков через анализ потоков"},{"id":"c","en":"They reduce the need to interact with the real population.","ru":"Снижают необходимость взаимодействия с населением"},{"id":"d","en":"They allow automating completely the creation of the Place Image.","ru":"Полностью автоматизируют создание Place Image"}],"correct":"b","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Big Data помогают понять потоки и поведение, но не заменяют участие людей."},{"num":12,"id":"q12","en":"What is the role of \"Nudges\" (gentle pushes) according to the sources?","ru":"Роль «Nudges» (мягких подталкиваний)?","options":[{"id":"a","en":"Non-monetary sanctions for those who do not respect the environment.","ru":"Неденежные санкции за нарушение экологии"},{"id":"b","en":"Orders issued by the municipality in relation to TCM.","ru":"Приказы муниципалитета по TCM"},{"id":"c","en":"Small informational stimuli to guide citizens toward virtuous and conscious behaviors.","ru":"Небольшие информационные стимулы к добросовестному поведению"},{"id":"d","en":"Advertising to attract tourists.","ru":"Реклама для привлечения туристов"}],"correct":"c","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Nudge = мягкий стимул (подсказка), а не штраф и не приказ."},{"num":13,"id":"q13","en":"An \"Adaptive\" system in territorial marketing is a system that:","ru":"«Adaptive» система в территориальном маркетинге — это система, которая:","options":[{"id":"a","en":"Refuses to change to keep its historical image unaltered.","ru":"Отказывается меняться ради исторического имиджа"},{"id":"b","en":"Changes strategy every day based on feedback from social networks.","ru":"Меняет стратегию каждый день по соцсетям"},{"id":"c","en":"Is imposed by the central government without direct local consultation.","ru":"Навязана центральной властью без консультаций"},{"id":"d","en":"Follows rules shared by stakeholders to respond to environmental changes.","ru":"Следует общим правилам стейкхолдеров и адаптируется к изменениям среды"}],"correct":"d","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Adaptive (VSA) = жизнеспособная система, адаптирующаяся по общим правилам."},{"num":14,"id":"q14","en":"In a marketing plan for a CCN, the \"Safety\" lever is measured through:","ru":"В marketing plan для CCN рычаг «Safety» измеряется через:","options":[{"id":"a","en":"The reduction of real crime and the improvement of users' perception of protection.","ru":"Снижение реальной преступности и улучшение восприятия безопасности"},{"id":"b","en":"It is a KPI and indicates the number of fines issued by the municipal police for parking violations.","ru":"Число штрафов за парковку"},{"id":"c","en":"The number of surveillance interventions arranged during the year.","ru":"Число операций видеонаблюдения за год"},{"id":"d","en":"The response speed of local police in the city.","ru":"Скорость реакции полиции"}],"correct":"a","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Safety = реальная безопасность + восприятие защиты пользователями."},{"num":15,"id":"q15","en":"In a \"Smart City\", technology must be understood as:","ru":"В «Smart City» технологию следует понимать как:","options":[{"id":"a","en":"An ultimate goal of urban development to which privacy is sacrificed.","ru":"Конечную цель развития, ради которой жертвуют privacy"},{"id":"b","en":"A tool to optimize the co-creation of value and the well-being of citizens.","ru":"Инструмент для co-creation ценности и благополучия граждан"},{"id":"c","en":"An incidental cost to be eliminated to balance the municipal budget.","ru":"Побочные расходы, которые надо убрать"},{"id":"d","en":"A substitute for human skills in the political decision process.","ru":"Замену человеческим навыкам в политических решениях"}],"correct":"b","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Tech — средство для co-creation и wellbeing, не самоцель."},{"num":16,"id":"q16","en":"In the \"movie director\" governance model, the role of government is:","ru":"В модели governance «movie director» роль власти:","options":[{"id":"a","en":"To write the strategy and objectives and suggest actions to the actors.","ru":"Писать стратегию и цели и предлагать действия акторам"},{"id":"b","en":"To passively monitor markets without intervening in the strategy.","ru":"Пассивно наблюдать за рынками без вмешательства"},{"id":"c","en":"To encourage actors to integrate knowledge for a common ultimate purpose.","ru":"Поощрять акторов интегрировать знания ради общей цели"},{"id":"d","en":"To manage the legal and bureaucratic aspects of the territory.","ru":"Управлять только юридическими и бюрократическими аспектами"}],"correct":"a","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Режиссёр задаёт стратегию, цели и направляет акторов — не пассивный наблюдатель."},{"num":17,"id":"q17","en":"\"Co-production\" differs from \"co-creation\" because:","ru":"«Co-production» отличается от «co-creation», потому что:","options":[{"id":"a","en":"It only concerns the experiential value-in-use of the final user.","ru":"Касается только experiential value-in-use конечного пользователя"},{"id":"b","en":"It implies the direct participation of the customer in the design or realization of the offering.","ru":"Подразумевает прямое участие клиента в проектировании или реализации предложения"},{"id":"c","en":"It is a process that partially excludes the public administration.","ru":"Частично исключает public administration"},{"id":"d","en":"It applies exclusively to services in the city.","ru":"Применяется только к городским услугам"}],"correct":"b","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Co-production = пользователь участвует в создании услуги; co-creation шире (вся система акторов)."},{"num":18,"id":"q18","en":"The urban \"Servicescape\" concept problematizes the city as:","ru":"Концепция urban «Servicescape» рассматривает город как:","options":[{"id":"a","en":"A setting where the interaction among actors creates and perceives the service offering.","ru":"Среду, где взаимодействие акторов создаёт и воспринимает услугу"},{"id":"b","en":"A context in which the services of the city develop.","ru":"Контекст развития городских услуг"},{"id":"c","en":"A non-place devoid of identity and meaningful social relationships.","ru":"Non-place без идентичности и социальных связей"},{"id":"d","en":"An administrative structure aimed at managing public services.","ru":"Административную структуру управления услугами"}],"correct":"a","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Servicescape (Bitner) — физическая и социальная среда, где создаётся опыт услуги."},{"num":19,"id":"q19","en":"\"Change Aversion\" can be overcome through:","ru":"«Change Aversion» можно преодолеть через:","options":[{"id":"a","en":"Limits generated by those who hinder development.","ru":"Ограничения для тех, кто мешает развитию"},{"id":"b","en":"Proposing the replacement of downtown entrepreneurs not aligned with TCM.","ru":"Замену предпринимателей, не согласных с TCM"},{"id":"c","en":"The dissemination of knowledge and the involvement of stakeholders in the design process.","ru":"Распространение знаний и вовлечение стейкхолдеров в проектирование"},{"id":"d","en":"The total elimination of every existing rule in the territory.","ru":"Полную отмену всех существующих правил"}],"correct":"c","section":"Part I — Multiple Choice (1 mark each)","explain_ru":"Сопротивление изменениям снимают знания и участие в co-design, не принуждением."}];
    const OPEN_ITEMS = [];
    const SNA_ITEMS = [];

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Вопрос ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span>
                  <div class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</div>
                  <div class="opt-ru">${o.ru}</div>
                </span>
              </label>`).join('')}
          </div>
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let currentPart = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const part = item.part || 'II';
        if (part !== currentPart) {
          currentPart = part;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = part === 'III'
            ? 'Part III — Brief Answers (5 marks) / Развёрнутые ответы'
            : 'Part II — Brief Answers (3 marks) / Краткие ответы';
          container.appendChild(h);
        }
        const ansEn = item.sample_en || '';
        const ansRu = item.sample_ru || '';
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-num">${item.label ? part + ' ' + item.label : item.title_ru}</div>
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <div class="answer-box">
            <div class="answer-label">Sample answer / Эталонный ответ</div>
            ${ansEn ? `<div class="answer-en">${ansEn}</div>` : ''}
            ${ansRu ? `<div class="answer-ru">${ansRu}</div>` : ''}
          </div>
          <details class="practice-note">
            <summary>Write your own answer / Свой ответ (optional)</summary>
            <textarea name="open_${idx}" rows="4" placeholder="Compare with the sample above / Сравните с эталоном"></textarea>
          </details>`;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — расчёты';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-ru">${item.ru}</div>
          <div class="q-en">${item.en}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Ваш ответ..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let unanswered = 0;
      let correct = 0;
      let wrong = 0;
      const warnEl = document.getElementById('warn-text');

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Ответьте на все вопросы с вариантами (${unanswered} без ответа).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Ответ не выбран. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Correct / Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Ваш ответ: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

            container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Пустой ответ. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Correct / Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Результат: ${correct} из ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Баллы: ${score.toFixed(1)} · Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`
          : `Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
