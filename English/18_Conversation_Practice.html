    <h1>Conversation Practice</h1>
    <p class="kk">Мақсат — сөйлесуді <strong>жалғастыра білу</strong>. Сөзді көп білу жеткіліксіз: жауап беріп, қарсы сұрақ қойып, қызығушылық танытып отыру керек. Осы бетте: техникалар, нағыз өмірден диалогтар, жауап таңдау жаттығуы және фразалар банкі.</p>

/* ---------------- RENDER ---------------- */
const TABS = [
  { id: "rules", label: "Жалғастыру техникасы" },
  { id: "dlg", label: "Диалогтар" },
  { id: "train", label: "Сенің кезегің" },
  { id: "bank", label: "Фразалар банкі" }
];
let current = "rules";
const tabsEl = document.getElementById("tabs");
const areaEl = document.getElementById("area");
const train = { i: 0, right: 0, done: 0 };

function renderTabs() {
  tabsEl.innerHTML = TABS.map(t =>
    `<button class="tab ${t.id === current ? "active" : ""}" type="button" data-id="${t.id}">${t.label}</button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => { current = b.dataset.id; renderTabs(); render(); }));
}

function render() {
  if (current === "rules") return renderRules();
  if (current === "dlg") return renderDialogues();
  if (current === "train") return renderTrainer();
  return renderBank();
}

function renderRules() {
  areaEl.innerHTML = `
    <div class="section">
      <h2>Сөйлесуді қалай жалғастыру керек</h2>
      <p class="lead">Алты техника. Әрқайсысында: неге керек, жаман мысал, жақсы мысал және дайын фразалар.</p>

            <div class="bad"><b>✗ Әлсіз</b><br>— ${r.bad.q}<br>— ${r.bad.a}</div>
            <div class="good"><b>✓ Күшті</b><br>— ${r.good.q}<br>— ${r.good.a}</div>
          </div>
          <ul class="phrases">
            ${r.phrases.map(p => `<li><span class="en">${p[0]}</span><br><span class="tr">${p[1]}</span></li>`).join("")}
          </ul>
        </div>`).join("")}
    </div>`;
}

function renderDialogues() {
  areaEl.innerHTML = `
    <div class="section">
      <h2>Нағыз өмірден диалогтар</h2>
      <p class="lead">Сары түспен белгіленген тіркестер — әңгімені жалғастыратын сөздер. Алдымен аудармасыз оқып көріңіз, сосын тексеріңіз. Дауыстап қайталаған тиімді.</p>
      <div class="toolbar">

function renderTrainer() {
  if (train.i >= PROMPTS.length) {
    const pct = Math.round(train.right / PROMPTS.length * 100);
    areaEl.innerHTML = `
      <div class="section">
        <h2>Сенің кезегің</h2>
        <p class="lead" style="font-size:1.15rem;color:#2c3e50">
          Нәтиже: <strong>${train.right} / ${PROMPTS.length}</strong> (${pct}%) —
          ${pct >= 80 ? "Тамаша! Әңгімені жақсы жүргізесің. 🎉" : pct >= 50 ? "Жақсы бастама. Техникалар бетін қайта оқып, тағы байқап көр." : "Алдымен «Жалғастыру техникасы» бетін оқы, сосын қайта кел."}
        </p>
        <button class="btn" id="againBtn" type="button">Қайтадан бастау</button>
      </div>`;
    document.getElementById("againBtn").addEventListener("click", () => {
      train.i = 0; train.right = 0; train.done = 0; renderTrainer();
    });
    return;
  }

  const p = PROMPTS[train.i];
  areaEl.innerHTML = `
    <div class="section">
      <h2>Сенің кезегің</h2>
      <p class="lead">Адам саған осылай айтты. Ең табиғи жауапты таңда.</p>
      <p class="counter">Сұрақ <b>${train.i + 1}</b> / ${PROMPTS.length} · Дұрыс: <b>${train.right}</b></p>
      <div class="prompt">
        <span class="sit">${p.sit}</span>
        <span class="said">${p.said}<span class="saidkk">${p.saidkk}</span></span>
      </div>
      <ul class="opts">
        ${p.opts.map((o, j) => `<li><button class="opt" type="button" data-j="${j}">${o}</button></li>`).join("")}
      </ul>
      <div class="fb" id="fb"></div>
      <div class="toolbar" id="nav" style="margin-top:1.2rem"></div>
    </div>`;

  areaEl.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => pick(parseInt(b.dataset.j, 10))));
}

function pick(j) {
  const p = PROMPTS[train.i];
  const correct = j === p.a;
  if (correct) train.right++;
  train.done++;

  areaEl.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const bj = parseInt(b.dataset.j, 10);
    if (bj === p.a) b.classList.add("ok");
    else if (bj === j) b.classList.add("no");
  });

  const fb = document.getElementById("fb");
  fb.className = "fb show " + (correct ? "ok" : "no");
  fb.innerHTML = correct
    ? `<span class="head">✓ Дұрыс</span>${p.ok}`
    : `<span class="head">✗ Табиғи емес</span>${p.no[j]}<span class="tip">Дұрыс жауап: <strong>${p.opts[p.a]}</strong> — ${p.ok}</span>`;

  const last = train.i === PROMPTS.length - 1;
  document.getElementById("nav").innerHTML =
    `<button class="btn" id="nextBtn" type="button">${last ? "Нәтижені көру" : "Келесі →"}</button>`;
  document.getElementById("nextBtn").addEventListener("click", () => { train.i++; renderTrainer(); });
  document.getElementById("nextBtn").focus();
}

          <table class="bank">
            <tr><th>English</th><th>Қазақша</th></tr>
            ${g.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
          </table>
        </div>`).join("")}
    </div>`;
}

renderTabs();
render();
</script>
</body>
