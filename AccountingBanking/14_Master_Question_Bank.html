<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Question Bank — missing topics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.65;
      margin: 0;
      padding: 2rem 1rem 3rem;
      color: #1a1a2e;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .back { margin-bottom: 1rem; }
    .back a { color: #16a085; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    h1 {
      color: #2c3e50;
      border-bottom: 4px solid #16a085;
      padding-bottom: 12px;
      font-size: 1.75rem;
    }
    .sub { color: #555; margin: 0.5rem 0 1.5rem; }
    .rules {
      background: #fff;
      border-left: 4px solid #16a085;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .section-title {
      font-size: 1.15rem;
      color: #16a085;
      margin: 2rem 0 1rem;
      font-weight: 600;
    }
    .q {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid #e8ecf1;
    }
    .q.unanswered { border-color: #e74c3c; }
    .q.correct { border-color: #27ae60; background: #f6fff9; }
    .q.wrong { border-color: #e74c3c; background: #fff8f8; }
    .q-num { font-weight: 700; color: #16a085; margin-bottom: 0.35rem; }
    .q-en { font-size: 1.02rem; margin-bottom: 0.35rem; }
    .opts { display: grid; gap: 0.45rem; }
    label.opt {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }
    label.opt:hover { background: #eef9f6; }
  .result-opt { cursor: default; }
    label.opt input { margin-top: 0.25rem; flex-shrink: 0; }
    .opt-en { font-size: 0.95rem; }
    .feedback {
      margin-top: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.92rem;
    }
    .feedback.ok { background: #e8f8ef; color: #1e7e45; }
    .feedback.bad { background: #fdecea; color: #c0392b; }
    .open-block {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .open-block textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 0.5rem;
      padding: 0.65rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }
    .sample {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #eefaf7;
      border-radius: 8px;
      border-left: 3px solid #16a085;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .matrix-wrap { overflow-x: auto; margin: 1rem 0; }
    table.matrix {
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 0 auto;
    }
    table.matrix th, table.matrix td {
      border: 1px solid #ccc;
      padding: 4px 8px;
      text-align: center;
    }
    table.matrix th { background: #16a085; color: #fff; }
    .actions {
      position: sticky;
      bottom: 0;
      background: rgba(245,247,250,.95);
      backdrop-filter: blur(6px);
      padding: 1rem 0;
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #16a085;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #138d75; }
    button.secondary {
      background: #fff;
      color: #16a085;
      border: 2px solid #16a085;
    }
    #results {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      border: 2px solid #16a085;
    }
    #results.visible { display: block; }
    .score { font-size: 1.35rem; font-weight: 700; color: #2c3e50; }
    .score-detail { color: #555; margin-top: 0.35rem; }
    .warn { color: #e74c3c; font-weight: 600; margin-top: 0.5rem; }
    mark.correct-mark { background: #d5f5e3; padding: 0 4px; border-radius: 3px; }
    mark.wrong-mark { background: #fadbd8; padding: 0 4px; border-radius: 3px; }
    .howto {
      margin-top: 0.75rem;
      padding: 0.85rem 1rem;
      background: #eefaf7;
      border-radius: 8px;
      border-left: 3px solid #16a085;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .explain { margin-top: 0.5rem; font-size: 0.88rem; opacity: 0.95; }
        .brief-answer {
      margin: 0.65rem 0 0.85rem;
      padding: 0.7rem 1rem;
      background: #e8f8ef;
      border-left: 4px solid #27ae60;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .brief-label { font-weight: 600; color: #1e7e45; font-size: 0.82rem; margin-bottom: 0.2rem; }
    .brief-text { color: #1a1a2e; }
    .answer-label { font-weight: 600; color: #16a085; margin-top: 0.75rem; font-size: 0.9rem; }
    .reveal-btn { margin-top: 0.6rem; font-size: 0.88rem; padding: 0.45rem 1rem; }
    details.solution { margin-top: 0.75rem; font-size: 0.9rem; }
    details.solution summary { cursor: pointer; color: #16a085; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="index.html">← Accounting & Banking tests</a></p>
    <h1>Master Question Bank — missing topics</h1>
    <p class="sub">SROI, Corporate Sustainability, Efficiency</p>
    
    <form id="test-form">
      <div id="questions"></div>
      
      <div class="actions">
        <button type="submit">Check answers</button>
        <button type="button" class="secondary" id="reset-btn">Reset</button>
      </div>
    </form>
    <div id="results">
      <div class="score" id="score-text"></div>
      <p class="score-detail" id="score-detail"></p>
      <p class="warn" id="warn-text" hidden></p>
    </div>
  </div>
  <script>
    const SCORING = {"correct": 1, "wrong": 0, "max": null};
    const QUESTIONS = [{"num":1,"id":"q1","en":"A Budget is:","correct":"a","section":"Management accounting","options":[{"id":"a","en":"A detailed quantitative plan for acquiring and using financial and other resources over a specified forthcoming time period"},{"id":"b","en":"A system that includes subsystems for planning, measuring and recording results and evaluating performance"},{"id":"c","en":"The force that moves different people in different ways for different reasons"},{"id":"d","en":"Concerned with the initiation of organized action and stimulating people to work"}]},{"num":2,"id":"q2","en":"The Indirect costs are:","correct":"d","section":"Management accounting","options":[{"id":"a","en":"Costs that vary directly and proportionately with changes in the activity level"},{"id":"b","en":"Costs that remain the same in total regardless of changes in the activity level"},{"id":"c","en":"Costs that can be easily and conveniently traced to a product or department"},{"id":"d","en":"Costs that must be allocated in order to be assigned to a product or department"}]},{"num":3,"id":"q3","en":"Diversification is:","correct":"a","section":"Banking & risk","options":[{"id":"a","en":"Reduce individual firm-specific credit risk"},{"id":"b","en":"Reduce systematic credit risk"},{"id":"c","en":"Increase individual firm-specific credit risk"},{"id":"d","en":"None of the answers"}]},{"num":4,"id":"q4","en":"The Banking Recovery and Resolution Directive (BRRD) is related to:","correct":"d","section":"EBU & regulation","options":[{"id":"a","en":"The fourth pillar of European Banking Union"},{"id":"b","en":"The third pillar of European Banking Union"},{"id":"c","en":"The first pillar of European Banking Union"},{"id":"d","en":"The second pillar of European Banking Union"}]},{"num":5,"id":"q5","en":"In order to evaluate financial instruments we can use:","correct":"c","section":"IFRS & instruments","options":[{"id":"a","en":"Fair value criteria"},{"id":"b","en":"Amortized cost criteria"},{"id":"c","en":"Both fair value and amortized cost criteria"},{"id":"d","en":"EAD criteria"}]},{"num":6,"id":"q6","en":"The definition of syndicated loan:","correct":"c","section":"Banking & instruments","options":[{"id":"a","en":"It is provided by only one financial institution"},{"id":"b","en":"It is provided by a group of financial institutions as opposed to multiple lenders"},{"id":"c","en":"It is provided by a group of financial institutions as opposed to a single lender"},{"id":"d","en":"None of the above"}]},{"num":7,"id":"q7","en":"In which valuation model is terminal cash flow used?","correct":"b","section":"Valuation","options":[{"id":"a","en":"Multiples method"},{"id":"b","en":"DCF"},{"id":"c","en":"EVA"},{"id":"d","en":"None of the answers"}]},{"num":8,"id":"q8","en":"Which standard is used to account for non-performing loans (NPLs)?","correct":"a","section":"IFRS & instruments","options":[{"id":"a","en":"IFRS 9"},{"id":"b","en":"IFRS 19"},{"id":"c","en":"IFRS 1"},{"id":"d","en":"None of the above"}]},{"num":9,"id":"q9","en":"The Financial Institutions' specialness is done by:","correct":"c","section":"Financial intermediaries","options":[{"id":"a","en":"Monitoring cost"},{"id":"b","en":"Liquidity"},{"id":"c","en":"Both of them"},{"id":"d","en":"None of the above"}]},{"num":10,"id":"q10","en":"Commercial banks, credit unions, saving institutions are:","correct":"a","section":"Bank types","options":[{"id":"a","en":"Depository institutions"},{"id":"b","en":"Specific type of investment banks"},{"id":"c","en":"Mutual funds"},{"id":"d","en":"Securities firms"}]},{"num":11,"id":"q11","en":"It is the document that allows you to read and analyze the bank's financial statements by tracking magnitudes and their evolution to operational and management aspects:","correct":"d","section":"Bank reporting","options":[{"id":"a","en":"Income statement"},{"id":"b","en":"Statement of Comprehensive Income"},{"id":"c","en":"Supplementary note"},{"id":"d","en":"Management report"}]},{"num":12,"id":"q12","en":"The risk that a sudden surge in liability withdrawals may require an FI to liquidate assets in a short period at less than fair market prices is:","correct":"b","section":"Banking & risk","options":[{"id":"a","en":"Credit risk"},{"id":"b","en":"Liquidity risk"},{"id":"c","en":"Market risk"},{"id":"d","en":"Operational risk"}]},{"num":13,"id":"q13","en":"A common stock:","correct":"a","section":"Equity & debt","options":[{"id":"a","en":"Has more voting rights"},{"id":"b","en":"Has more remuneration rights"},{"id":"c","en":"Has more rights in case of default"},{"id":"d","en":"None of the above"}]},{"num":14,"id":"q14","en":"In a syndicated loan:","correct":"a","section":"Banking & instruments","options":[{"id":"a","en":"There are several banks that cover the loan"},{"id":"b","en":"There is only one bank that covers the loan"},{"id":"c","en":"There is always a guarantee"},{"id":"d","en":"We can use only fixed rates"}]},{"num":15,"id":"q15","en":"In the measurement of credit risk, volatility of earnings:","correct":"d","section":"Credit risk","options":[{"id":"a","en":"Is a borrower specific factor of qualitative models"},{"id":"b","en":"Is a borrower specific factor of quantitative models"},{"id":"c","en":"Is a market specific factor of qualitative models"},{"id":"d","en":"Is a market specific factor of quantitative models"}]},{"num":16,"id":"q16","en":"The net interest margin is more important in:","correct":"c","section":"Bank ratios","options":[{"id":"a","en":"Pension funds"},{"id":"b","en":"Mutual funds"},{"id":"c","en":"Commercial banks"},{"id":"d","en":"Investment banks"}]},{"num":17,"id":"q17","en":"The intermediation margin is more important in:","correct":"c","section":"Bank ratios","options":[{"id":"a","en":"None of the answers"},{"id":"b","en":"Commercial banks focused on mortgage"},{"id":"c","en":"Commercial banks"},{"id":"d","en":"Investment banks"}]},{"num":18,"id":"q18","en":"The estimated amount of money a bank loses when a borrower defaults on a loan is:","correct":"b","section":"Credit risk","options":[{"id":"a","en":"The probability of default (PD)"},{"id":"b","en":"The expected loss (EL)"},{"id":"c","en":"The loss given default (LGD)"},{"id":"d","en":"The exposure at default (EAD)"}]},{"num":19,"id":"q19","en":"A preferred stock:","correct":"b","section":"Equity & debt","options":[{"id":"a","en":"Has more voting rights"},{"id":"b","en":"Has more remuneration rights"},{"id":"c","en":"Has not remuneration rights"},{"id":"d","en":"None of the above"}]},{"num":20,"id":"q20","en":"Equity investments in banks' reports are in:","correct":"a","section":"Bank balance sheet","options":[{"id":"a","en":"Assets"},{"id":"b","en":"Liabilities"},{"id":"c","en":"Shareholders' equity"},{"id":"d","en":"None of the above"}]},{"num":21,"id":"q21","en":"Altman's discriminant function is:","correct":"c","section":"Credit risk","options":[{"id":"a","en":"A qualitative measurement of credit risk"},{"id":"b","en":"A quantitative measurement of market risk"},{"id":"c","en":"A quantitative measurement of credit risk"},{"id":"d","en":"A qualitative measurement of market risk"}]},{"num":22,"id":"q22","en":"Using size, what is the largest group of depository institutions?","correct":"a","section":"Bank types","options":[{"id":"a","en":"Commercial banks"},{"id":"b","en":"Investment banks"},{"id":"c","en":"Credit unions"},{"id":"d","en":"Mutual funds"}]},{"num":23,"id":"q23","en":"\"An economic agent appointed to act on behalf of smaller agents in collecting information and/or investing funds on their behalf\" is the definition of:","correct":"a","section":"Financial intermediaries","options":[{"id":"a","en":"Bank's Role as Delegated Monitor"},{"id":"b","en":"Bank's Role as information producer"},{"id":"c","en":"Bank's Role for diversification"},{"id":"d","en":"None of the above"}]},{"num":24,"id":"q24","en":"Monetary policy actions include:","correct":"a","section":"Monetary policy","options":[{"id":"a","en":"All the answers"},{"id":"b","en":"Open market operations"},{"id":"c","en":"The choice of the central discount rate"},{"id":"d","en":"Setting reserve requirements"}]},{"num":25,"id":"q25","en":"They focus on consumer loans funded with member deposits:","correct":"a","section":"Bank types","options":[{"id":"a","en":"Credit unions"},{"id":"b","en":"Commercial banks"},{"id":"c","en":"Saving institutions"},{"id":"d","en":"Investment banks"}]},{"num":26,"id":"q26","en":"A loan backed by specific assets of the borrower; if the borrower defaults, the lender has a first lien on those assets:","correct":"a","section":"Credit risk","options":[{"id":"a","en":"Secured loan"},{"id":"b","en":"Unsecured loan"},{"id":"c","en":"Syndicated loan"},{"id":"d","en":"None of the above"}]},{"num":27,"id":"q27","en":"It arises because of the possibility that promised cash flows on financial claims held by banks will not be paid in full:","correct":"a","section":"Banking & risk","options":[{"id":"a","en":"Credit risk"},{"id":"b","en":"Market risk"},{"id":"c","en":"Sovereign risk"},{"id":"d","en":"Liquidity risk"}]},{"num":28,"id":"q28","en":"The risk incurred by a bank as a result of activities related to contingent assets and liabilities held off the balance sheet:","correct":"a","section":"Banking & risk","options":[{"id":"a","en":"Off-balance sheet risk"},{"id":"b","en":"Market risk"},{"id":"c","en":"Sovereign risk"},{"id":"d","en":"Liquidity risk"}]},{"num":29,"id":"q29","en":"An increase in the frequency of the coupons:","correct":"a","section":"Bonds & duration","options":[{"id":"a","en":"Reduces the duration"},{"id":"b","en":"Increases the duration"},{"id":"c","en":"Has no effect on the duration"},{"id":"d","en":"Increases the value of the equity"}]},{"num":30,"id":"q30","en":"Loans to banks are in:","correct":"a","section":"Bank balance sheet","options":[{"id":"a","en":"Assets section"},{"id":"b","en":"Liabilities section"},{"id":"c","en":"Expenses in the income statement"},{"id":"d","en":"Assets section in the income statement"}]},{"num":31,"id":"q31","en":"The internal financing of a firm depends directly on:","correct":"c","section":"Corporate finance","options":[{"id":"a","en":"Total financial debt"},{"id":"b","en":"Market price"},{"id":"c","en":"Firms' profitability"},{"id":"d","en":"None of the above"}]},{"num":32,"id":"q32","en":"Bank leverage is the ratio of the value of a bank's assets to the value of its:","correct":"a","section":"Bank ratios","options":[{"id":"a","en":"Equity (capital)"},{"id":"b","en":"Profitability"},{"id":"c","en":"ROE"},{"id":"d","en":"ROA"}]}]
    const OPEN_ITEMS = []
    const SNA_ITEMS = []

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</span>
              </label>`).join('')}
          </div>
          ${q.explain ? `<details class="solution"><summary>📗 Solution</summary><div class="howto">${q.explain}</div></details>` : ''}
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let openSection = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const sec = item.section || (item.howto_en ? 'Exercises' : 'Theory — short answers');
        if (sec !== openSection) {
          openSection = sec;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = sec;
          container.appendChild(h);
        }
        const block = document.createElement('div');
        block.className = 'open-block';
        const brief = item.sample_en || '';
        block.innerHTML = `
          <div class="q-num">${item.title_en || item.en}</div>
          <div class="q-en">${item.en}</div>
          ${brief ? `<div class="brief-answer"><div class="brief-label">Answer</div><div class="brief-text">${brief}</div></div>` : ''}
          <textarea name="open_${idx}" placeholder="Your answer (optional)..."></textarea>`;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — calculations';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let unanswered = 0;
      let correct = 0;
      let wrong = 0;
      const warnEl = document.getElementById('warn-text');

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Answer all MCQ questions (${unanswered} unanswered).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ No answer selected. Correct: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Correct' + (q.explain ? '<div class="explain">' + q.explain + '</div>' : '');
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Incorrect. Your answer: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Correct: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>' +
            (q.explain ? '<div class="explain">' + q.explain + '</div>' : '');
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

      container.querySelectorAll('.open-block .sample, .open-block .howto').forEach(el => { el.hidden = false; });

      container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Empty answer. Expected: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Correct' + (q.explain ? '<div class="explain">' + q.explain + '</div>' : '');
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Incorrect. Expected: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Score: ${correct} of ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Points: ${score.toFixed(1)} · Correct: ${correct} · Wrong: ${wrong} · Unanswered: ${unanswered}`
          : `Correct: ${correct} · Wrong: ${wrong} · Unanswered: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
