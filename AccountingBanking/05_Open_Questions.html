  <script>
    const SCORING = {"correct":0,"wrong":0,"max":null}
    const QUESTIONS = []
    const OPEN_ITEMS = [{"section":"Theory — short answers","title_en":"Functions of the financial system","en":"Explain the functions of the financial system","sample_en":"The financial system links people who save money with people and companies that need money. Banks take deposits and give loans, so credit is created in the economy. They also share risk — for example, one bank has many loans, so one bad loan does not destroy everything. Banks match the amount and the time of money: short deposits can fund longer loans. They run payment systems so transfers are safe. Markets also help set prices for financial products, so money goes where it is most useful."},{"section":"Theory — short answers","title_en":"Theories of financial intermediaries","en":"Explain the theories of the existence of financial intermediaries","sample_en":"Banks and other intermediaries exist because lending directly between individuals and firms is often hard and risky. A bank collects many small deposits and lends to many borrowers, so costs are lower and risk is spread. Savers do not know well if a borrower is good or bad — that is adverse selection. After getting a loan, a borrower may take more risk — that is moral hazard. Banks are better at checking borrowers and watching them over time. They also change the length of money: people save short-term, but firms often need long-term loans."},{"section":"Theory — short answers","title_en":"Bank balance sheet & ratios","en":"Talk about the balance sheets of banks and the most important indices","sample_en":"A bank balance sheet shows what the bank owns and what it owes on a given date. On the asset side you mainly see loans to customers, securities, and cash. On the liability side the biggest item is usually customer deposits, plus money the bank borrowed. Equity is the owners’ money — capital plus past profits kept in the bank. Important ratios: ROE and ROA show profit, NIM shows the margin on lending, CAR shows if capital is enough, LCR shows liquidity, and NPL shows bad loans. IFRS 9 rules also affect how loans and expected losses are recorded."},{"section":"Theory — short answers","title_en":"European Banking Union","en":"Highlight the main features of the European Banking Union","sample_en":"The European Banking Union has three main parts. First, common supervision (SSM): the ECB and national supervisors watch big banks with the same rules. Second, common resolution (SRM): if a bank fails, it is closed in an orderly way and bail-in is used so taxpayers do not pay everything. Third, deposit guarantees (DGS): small depositors are protected up to €100,000 per person per bank. The goal is safer banks, the same rules in different countries, and more trust in the banking system in the euro area."},{"section":"Theory — short answers","title_en":"Interest rate risk","en":"Talk about interest rate risk","sample_en":"Interest rate risk means a bank can lose when interest rates change because assets and liabilities do not adjust at the same speed. If short-term rates go up and deposits reprice faster than loans, the bank earns less — that is refinancing risk. If the bank must reinvest money at lower rates, that is reinvestment risk. The value of bonds and loans also changes when rates move. Banks manage this with gap analysis, duration, and hedging tools like interest-rate swaps."},{"section":"Theory — short answers","title_en":"DCF model","en":"Explain the DCF model","sample_en":"DCF estimates the value of a company from its future cash flows brought back to today using a discount rate. You can value the whole firm (cash flows discounted with WACC) or only equity (cash flows to shareholders discounted with cost of equity). After the forecast period you usually add a terminal value. DCF is popular because it uses real cash and is a standard method in finance. But the result depends a lot on your guesses about growth, the discount rate, and the terminal value."},{"section":"Theory — short answers","title_en":"Debt vs Equity","en":"Explain the difference between Debt and Equity","sample_en":"Debt is borrowed money: the firm must pay fixed interest (often with a tax benefit) and repay the principal on a schedule. If the firm has problems, lenders are paid before owners and usually do not run the company. Equity is ownership: investors get what is left after all debts are paid. Dividends are not fixed and are not tax-deductible. Shareholders take more risk but usually have voting rights and no fixed repayment date. The firm chooses debt or equity based on cost, risk, and how much control it wants to keep."},{"section":"Exam 16/06/2026 — Variant A","title_en":"First pillar of EBU","en":"Describe the first pillar of the European Banking Union","sample_en":"The first pillar is bank supervision through the Single Supervisory Mechanism (SSM). Since 2014, the ECB directly supervises the largest banks in EU countries that take part, while national supervisors watch smaller banks using the same framework. The aim is to use the same rules everywhere, find problems early, and stop one weak bank from hurting the whole system. Supervisors check capital, liquidity, how the bank is run, and how risks are managed."},{"section":"Exam 16/06/2026 — Variant A","title_en":"Private equity","en":"Describe private equity","sample_en":"Private equity means investing in companies that are not on the stock market, using money from big investors like pension funds. These funds are usually closed-end for about 10 years — you cannot take your money out anytime. The manager buys part of a company, tries to improve it (better strategy, management, sometimes more debt), and later sells it or lists it on the stock exchange in an IPO. Profit comes from making the company better and from a higher sale price at the end."},{"section":"Exam 16/06/2026 — Variant A","title_en":"Second pillar of EBU","en":"Describe the second pillar of the European Banking Union","sample_en":"The second pillar is the Single Resolution Mechanism (SRM). When a bank is failing or will probably fail, the Single Resolution Board organises an orderly closure instead of a sudden crash or a full bailout with public money. The main tool is bail-in: shareholders and some creditors lose money first before the state pays. Resolution funds help pay for the process. The idea is to keep the financial system stable but make the people who took the risk pay first."},{"section":"Exam 16/06/2026 — Variant A","title_en":"Third pillar of EBU","en":"Describe the third pillar of the European Banking Union","sample_en":"The third pillar is deposit protection through Deposit Guarantee Schemes (DGS). If a bank fails, ordinary depositors should still get their money back quickly, up to the legal limit — in the EU usually €100,000 per person per bank. This stops panic and bank runs and protects small savers. National funds are paid for by contributions from banks. The EU also wants a more common European Deposit Insurance Scheme (EDIS) in the future. Main point: people trust that their deposits are safe even when a bank is in trouble."},{"section":"Exam 16/06/2026 — Variant A","title_en":"IPO","en":"Describe IPO (Initial Public Offering)","sample_en":"An IPO (Initial Public Offering) is when a company sells its shares to the public for the first time and starts trading on a stock exchange. The company raises new money from investors and must publish more information to the market. Investment banks often help as underwriters: they help set the price, find buyers, and sometimes guarantee that enough shares will be sold. After the IPO, the shares that the public can freely buy and sell are called the free float."},{"section":"Exercises","title_en":"SoFP — smaller figures (5 pts)","en":"Build Statement of Financial Position for Uniclam Group Corp. (smaller figures)","sample_en":"Put each item in the right place: non-current assets, current assets, equity, non-current liabilities, or current liabilities, then add up each group. Non-current assets (goodwill, intangibles, PPE) = 124,950; current assets (inventory, receivables, cash) = 79,900 — total assets 204,850. On the other side: equity 66,300, non-current liabilities 87,550, current liabilities 51,000 — total 204,850. The two sides must be equal: Assets = Equity + Liabilities.","link":"09_Statement_of_Financial_Position.html","link_label":"Full solution on page 09"},{"section":"Exercises","title_en":"SoFP — exam version (6 pts)","en":"Statement of Financial Position — exam version (larger figures)","sample_en":"Same steps as the smaller version, but with bigger numbers from the exam. Non-current assets = 374,850, current assets = 239,700 — total assets 614,550. Equity = 198,900, non-current liabilities = 262,650, current liabilities = 153,000 — total 614,550. Check that Total Assets equals Total Equity and Liabilities.","link":"09_Statement_of_Financial_Position.html","link_label":"Full solution on page 09"},{"section":"Exercises","title_en":"Division table — 2024 exam","en":"Divisions A/B: revenue 108k/72k; indirect per direct labour; selling per revenue; electricity & financial per raw materials.","sample_en":"First split shared costs using the rules on the exam, then subtract all costs from revenue and take 30% tax. Division A gets net income 33,880; Division B gets 14,840. Do not forget any cost line, and use the right base for each overhead: direct labour, revenue, or raw materials.","howto_en":"Step 1 — allocation rules:\n  Indirect labour → by direct labour (A:B = 12:24)\n  Selling → by revenue (A:B = 108:72)\n  Electricity & Financial → by raw materials (A:B = 12:6)\n\nStep 2 — Division A:\n  Add direct costs + allocated overheads → total costs\n  Pre-tax profit = 108,000 − total costs = 48,400\n  Tax 30% = 14,520 → Net income = 33,880\n\nStep 3 — Division B:\n  Same method → Pre-tax 21,200 → Tax 6,360 → Net 14,840","link":"13_Divisions_and_DCF.html","link_label":"Worked example on page 13"},{"section":"Exercises","title_en":"Division table — 2025 tablet","en":"Divisions: revenue 144k/120k; indirect/selling/advertising/electricity/financial by allocation rules.","sample_en":"Split indirect labour by direct labour, selling and advertising by revenue, electricity and financial costs by raw materials. Division A earns well (net income 32,214). Division B almost has no profit (net income 126) because costs are almost equal to revenue. Before you start, check that your shared cost pools match the totals given.","howto_en":"Division A (revenue 144,000):\n  Indirect 2,800 · Selling 13,091 · Advertising 13,636\n  Electricity 10,453 · Financial 14,000\n  Total costs 97,980 → Pre-tax 46,020 → Tax 13,806 → Net 32,214\n\nDivision B (revenue 120,000):\n  Total costs 119,820 → Pre-tax 180 → Tax 54 → Net 126","link":"13_Divisions_and_DCF.html","link_label":"Full table on page 13"},{"section":"Exercises","title_en":"DCF — Cassino SpA (8 pts)","en":"Evaluate Cassino SpA using DCF. WACC 5%, g 1%. Cash flows 2024–2028. Complete discount coefficients, DCFs, and W.","sample_en":"For each year: discount factor = 1 / (1.05)^n, then multiply by the cash flow for that year. Add all discounted cash flows to get company value W ≈ 143,858. Each year gives about 24–31k after discounting. The 2028 number on the exam is usually the last cash flow in the table (sometimes treated as terminal value).","howto_en":"Discount factor = 1 / (1.05)^n\n\n2024 (n=1): 0.9524 × 25,000 = 23,810\n2025 (n=2): 0.9070 × 30,000 = 27,211\n2026 (n=3): 0.8638 × 35,000 = 30,234\n2027 (n=4): 0.8227 × 38,000 = 31,263\n2028 (n=5): 0.7835 × 40,000 = 31,341\n\nW = 23,810 + 27,211 + 30,234 + 31,263 + 31,341 = 143,858","link":"13_Divisions_and_DCF.html","link_label":"Full DCF table on page 13"},{"section":"Exercises","title_en":"Production budget — May","en":"Omega: budgeted production for May? Sales May 90k, June 80k, 30% ending inventory.","sample_en":"Production is not the same as sales. You need enough units for May sales plus ending stock, minus what you already have at the start. Ending inventory for May = 30% of June sales = 24,000 units. Beginning inventory = 30% of May sales = 27,000 units. So production = 90,000 + 24,000 − 27,000 = 87,000 units.","howto_en":"Formula: Production = Sales + Ending inventory − Beginning inventory\n\nEnding (May) = 30% × June sales = 0.30 × 80,000 = 24,000\nBeginning (May) = 30% × May sales = 0.30 × 90,000 = 27,000\n\nProduction = 90,000 + 24,000 − 27,000 = 87,000 units"},{"section":"Exercises","title_en":"Depreciation — Exercise 3 (8 pts)","en":"Cost $160,000, life 6 years, residual $28,000. (a) Annual charge straight-line and reducing balance 15%. (b) 6-year schedule for each method.","sample_en":"(a) Straight-line: divide depreciable amount evenly — (160,000 − 28,000) / 6 = $22,000 every year; after year 6 NBV = $28,000 (residual). Reducing balance: each year take 15% of carrying value, so the charge goes down each year; year 6 NBV is about $60,344. (b) Make a table for each method with cost, yearly depreciation, total depreciation so far, and NBV.","link":"10_Depreciation.html","link_label":"Full schedules on page 10"},{"section":"Exercises","title_en":"Depreciation — straight-line schedule","en":"Asset $160,000, life 6 years, residual $28,000 — build 6-year schedule (straight-line).","sample_en":"Straight-line means the same amount every year: (160,000 − 28,000) / 6 = $22,000. Each year add 22,000 to accumulated depreciation. NBV = cost minus accumulated depreciation. After year 6, NBV should be $28,000 — the residual value.","howto_en":"Annual dep = (160,000 − 28,000) / 6 = 22,000\n\nEach year:\n  Depreciation = 22,000\n  Accumulated dep += 22,000\n  NBV = 160,000 − Accumulated dep\n\nYear 6: NBV = 28,000 (= residual)","link":"10_Depreciation.html","link_label":"Full table on page 10"},{"section":"Exercises","title_en":"Depreciation — reducing balance 15%","en":"Reducing balance 15% — 6-year schedule.","sample_en":"With reducing balance, depreciation = 15% × opening carrying value each year, so the amount gets smaller over time. Year 1: 160,000 × 15% = 24,000 → NBV 136,000. Keep going for 6 years; year 6 NBV ≈ 60,344. Unlike straight-line, NBV does not automatically reach $28,000 residual unless you change the last year.","howto_en":"Each year: Dep = Carrying value × 15%, then NBV = Carrying − Dep\n\nYear 1: 24,000 dep → NBV 136,000\nYear 2: 20,400 dep → NBV 115,600\nYear 3: 17,340 → NBV 98,260\nYear 4: 14,739 → NBV 83,521\nYear 5: 12,528 → NBV 70,993\nYear 6: 10,649 → NBV 60,344","link":"10_Depreciation.html","link_label":"Full table on page 10"}]
    const SNA_ITEMS = []

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    const PAGE_SIZE = 20;
    let currentPage = 0;
    let paginatorTop = null;
    let paginatorBottom = null;
    let paginationLocked = false;

    function mcqPageCount() {
      return QUESTIONS.length ? Math.ceil(QUESTIONS.length / PAGE_SIZE) : 0;
    }

    function openPageCount() {
      return OPEN_ITEMS.length ? Math.ceil(OPEN_ITEMS.length / PAGE_SIZE) : 0;
    }

    function openItemPage(idx) {
      return mcqPageCount() + Math.floor(idx / PAGE_SIZE);
    }

    function totalPageCount() {
      let n = mcqPageCount();
      if (OPEN_ITEMS.length) n += openPageCount();
      if (SNA_ITEMS.length) n += 1;
      return Math.max(1, n);
    }

    function needsPagination() {
      return totalPageCount() > 1;
    }

    function pageLabel(page) {
      const mcqPages = mcqPageCount();
      if (page < mcqPages) {
        const from = page * PAGE_SIZE + 1;
        const to = Math.min((page + 1) * PAGE_SIZE, QUESTIONS.length);
        return 'Questions ' + from + '–' + to + ' · page ' + (page + 1) + ' of ' + totalPageCount();
      }
      const openStart = page - mcqPages;
      if (OPEN_ITEMS.length && page < mcqPages + openPageCount()) {
        const from = openStart * PAGE_SIZE + 1;
        const to = Math.min((openStart + 1) * PAGE_SIZE, OPEN_ITEMS.length);
        return 'Open questions ' + from + '–' + to + ' · page ' + (page + 1) + ' of ' + totalPageCount();
      }
      return 'Calculations · page ' + (page + 1) + ' of ' + totalPageCount();
    }

    function createPaginator(className) {
      const el = document.createElement('div');
      el.className = className;
      el.innerHTML = '<span class="paginator-info"></span><div class="paginator-btns">' +
        '<button type="button" class="secondary" data-nav="prev">← Previous</button>' +
        '<button type="button" class="secondary" data-nav="next">Next →</button></div>';
      el.querySelector('[data-nav="prev"]').addEventListener('click', () => goToPage(currentPage - 1));
      el.querySelector('[data-nav="next"]').addEventListener('click', () => goToPage(currentPage + 1));
      return el;
    }

    function updatePaginator() {
      const show = needsPagination() && !paginationLocked;
      [paginatorTop, paginatorBottom].forEach((p) => {
        if (!p) return;
        p.style.display = show ? '' : 'none';
        if (!show) return;
        p.querySelector('.paginator-info').textContent = pageLabel(currentPage);
        p.querySelector('[data-nav="prev"]').disabled = currentPage <= 0;
        p.querySelector('[data-nav="next"]').disabled = currentPage >= totalPageCount() - 1;
      });
      updateCheckButton();
    }

    function applyPageVisibility() {
      container.querySelectorAll('[data-page]').forEach((el) => {
        const p = Number(el.dataset.page);
        el.classList.toggle('page-hidden', paginationLocked ? false : p !== currentPage);
      });
      updatePaginator();
    }

    function goToPage(page) {
      if (paginationLocked) return;
      currentPage = Math.max(0, Math.min(totalPageCount() - 1, page));
      applyPageVisibility();
      const target = paginatorTop || container;
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setupPagination() {
      paginationLocked = false;
      currentPage = 0;
      if (paginatorTop) {
        paginatorTop.remove();
        paginatorBottom.remove();
        paginatorTop = paginatorBottom = null;
      }
      if (!needsPagination()) {
        updateCheckButton();
        return;
      }
      paginatorTop = createPaginator('paginator paginator-top');
      paginatorBottom = createPaginator('paginator paginator-bottom');
      container.before(paginatorTop);
      const actions = form.querySelector('.actions');
      form.insertBefore(paginatorBottom, actions);
      goToPage(0);
      updateCheckButton();
    }

    function showAllPages() {
      paginationLocked = true;
      applyPageVisibility();
    }

    function pageForMcqIndex(idx) {
      return Math.floor(idx / PAGE_SIZE);
    }

    function isMcqPage(page) {
      return page < mcqPageCount();
    }

    function questionsForPage(page) {
      const items = [];
      QUESTIONS.forEach((q, idx) => {
        if (pageForMcqIndex(idx) === page) items.push(q);
      });
      return items;
    }

    function questionsToCheck() {
      if (needsPagination() && isMcqPage(currentPage)) {
        return questionsForPage(currentPage);
      }
      return QUESTIONS;
    }

    function updateCheckButton() {
      const btn = form.querySelector('.actions button[type="submit"]');
      if (!btn) return;
      if (!btn.dataset.defaultLabel) btn.dataset.defaultLabel = btn.textContent;
      if (!QUESTIONS.length && OPEN_ITEMS.length) {
        const from = currentPage * PAGE_SIZE + 1;
        const to = Math.min((currentPage + 1) * PAGE_SIZE, OPEN_ITEMS.length);
        btn.textContent = 'Show sample answers (' + from + '–' + to + ')';
      } else if (needsPagination() && isMcqPage(currentPage)) {
        btn.textContent = 'Check this page (' + questionsForPage(currentPage).length + ')';
      } else {
        btn.textContent = btn.dataset.defaultLabel;
      }
    }

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q, idx) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.dataset.page = String(pageForMcqIndex(idx));
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.dataset.page = String(pageForMcqIndex(idx));
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</span>
              </label>`).join('')}
          </div>
          ${q.explain ? `<details class="solution"><summary>📗 Solution</summary><div class="howto">${q.explain}</div></details>` : ''}
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let openSection = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const sec = item.section || (item.howto_en ? 'Exercises' : 'Theory — short answers');
        if (sec !== openSection) {
          openSection = sec;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.dataset.page = String(openItemPage(idx));
          h.textContent = sec;
          container.appendChild(h);
        }
        const block = document.createElement('div');
        block.className = 'open-block';
        block.dataset.page = String(openItemPage(idx));
        const brief = item.sample_en || '';
        block.innerHTML = `
          <div class="q-num">${item.title_en || item.en}</div>
          <div class="q-en">${item.en}</div>
          ${brief ? `<div class="brief-answer"><div class="brief-label">Answer</div><div class="brief-text">${brief}</div></div>` : ''}
          <textarea name="open_${idx}" placeholder="Your answer (optional)..."></textarea>`;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.dataset.page = String(mcqPageCount() + openPageCount());
      h.textContent = 'SNA — calculations';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.dataset.page = String(mcqPageCount() + openPageCount());
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const page = currentPage;
      container.querySelectorAll('.open-block').forEach((block) => {
        if (Number(block.dataset.page) !== page) return;
        block.querySelectorAll('details.solution').forEach((d) => { d.open = true; });
      });
      resultsBox.classList.add('visible');
      document.getElementById('score-text').textContent =
        'Sample answers shown for page ' + (page + 1) + ' of ' + totalPageCount();
      document.getElementById('score-detail').textContent =
        'Write your answer first, then click to reveal samples. Use links for full worked solutions.';
      document.getElementById('warn-text').hidden = true;
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      setupPagination();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    setupPagination();
    
  </script>
</body>
</html>
