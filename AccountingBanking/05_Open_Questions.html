  <script>
    const SCORING = {"correct":0,"wrong":0,"max":null}
    const QUESTIONS = []
    const OPEN_ITEMS = [{"section":"Theory — short answers","title_en":"Functions of the financial system","en":"Explain the functions of the financial system","sample_en":"The financial system connects savers with borrowers and keeps the economy running. Banks collect deposits and channel them into loans, which creates credit. They also spread risk (for example by diversifying across many loans), match the size and maturity of funding to what borrowers need, and run payment systems so money can move safely. Finally, markets help price information — so capital flows to where it can be used best."},{"section":"Theory — short answers","title_en":"Theories of financial intermediaries","en":"Explain the theories of the existence of financial intermediaries","sample_en":"Financial intermediaries exist because direct lending between individuals and firms is often too costly and risky. Banks pool many small deposits, cut transaction costs, and diversify risk across a large loan book. Information asymmetry is central: savers cannot easily judge borrower quality (adverse selection), and behaviour may worsen after the loan (moral hazard) — banks specialise in screening and monitoring. They also transform maturities (short-term deposits funding longer loans) and apply expert knowledge that small investors lack."},{"section":"Theory — short answers","title_en":"Bank balance sheet & ratios","en":"Talk about the balance sheets of banks and the most important indices","sample_en":"A bank balance sheet shows what the bank owns and owes at a point in time. Assets mainly include loans to customers, securities, and cash/reserves. Liabilities are dominated by customer deposits, plus borrowings and other debt. Equity is the shareholders’ buffer — paid-in capital and retained earnings. Analysts watch ROE and ROA for profitability, NIM for the margin on lending, CAR for capital adequacy, LCR for liquidity, and the NPL ratio for credit quality. IFRS 9 also shapes how loans are measured and when expected credit losses are recognised."},{"section":"Theory — short answers","title_en":"European Banking Union","en":"Highlight the main features of the European Banking Union","sample_en":"The European Banking Union has three pillars. The first is the Single Supervisory Mechanism (SSM): the ECB and national supervisors jointly oversee major banks under one rulebook. The second is the Single Resolution Mechanism (SRM), with bail-in so failing banks can be resolved without always using taxpayer money. The third is deposit guarantee schemes (DGS), protecting retail deposits up to €100,000. Together, these aim for safer banks, consistent supervision, and a more integrated banking market in the euro area."},{"section":"Theory — short answers","title_en":"Interest rate risk","en":"Talk about interest rate risk","sample_en":"Interest rate risk hits a bank when assets and liabilities do not reprice at the same time. If short-term rates rise and more liabilities reprice upward than assets, net interest income falls — that is refinancing risk. If the bank holds shorter assets and must reinvest at lower rates, that is reinvestment risk. Bond and loan values also move when rates change. Banks manage this with repricing gap models, duration analysis, and hedging instruments such as interest-rate swaps."},{"section":"Theory — short answers","title_en":"DCF model","en":"Explain the DCF model","sample_en":"DCF values a company by forecasting future cash flows and bringing them back to today’s money using a discount rate. The asset-side approach uses free cash flows to the firm discounted at WACC; the equity-side approach uses cash flows to shareholders discounted at the cost of equity. You normally add a terminal value for the period after the explicit forecast. DCF is popular because it is based on cash and widely accepted, but results depend heavily on assumptions about growth, the discount rate, and the terminal value."},{"section":"Theory — short answers","title_en":"Debt vs Equity","en":"Explain the difference between Debt and Equity","sample_en":"Debt is a contractual claim: the firm must pay fixed interest (often tax-deductible) and repay principal on a schedule. In distress, debt holders are paid before shareholders and usually have no control over management. Equity is a residual claim — owners get what is left after all obligations. Dividends are optional and not tax-deductible; shareholders take the highest risk but typically have voting rights and no fixed maturity. Firms choose the mix based on cost of capital, risk appetite, and how much control they want to keep."},{"section":"Exam 16/06/2026 — Variant A","title_en":"First pillar of EBU","en":"Describe the first pillar of the European Banking Union","sample_en":"The first pillar is banking supervision through the Single Supervisory Mechanism (SSM). Since 2014, the ECB directly supervises the largest (“significant”) banks in participating EU countries, while national authorities supervise smaller banks under the same framework. The idea is to apply rules consistently, catch problems early, and reduce the risk that a weak bank in one country threatens the whole system. Supervision covers capital, liquidity, governance, and risk management."},{"section":"Exam 16/06/2026 — Variant A","title_en":"Private equity","en":"Describe private equity","sample_en":"Private equity means investing in companies that are not listed on a stock exchange, using capital raised from institutional investors such as pension funds. These are usually closed-end funds with a life of about 10 years — investors cannot withdraw whenever they want. The manager buys a stake, works on improving the business (strategy, governance, sometimes leverage), and exits by selling the company or taking it public through an IPO. Returns come from both operational improvement and the sale price at exit."},{"section":"Exam 16/06/2026 — Variant A","title_en":"Second pillar of EBU","en":"Describe the second pillar of the European Banking Union","sample_en":"The second pillar is the Single Resolution Mechanism (SRM). When a bank is failing or likely to fail, the Single Resolution Board plans an orderly wind-down instead of a disorderly collapse or an automatic taxpayer bailout. The key tool is bail-in: shareholders and certain creditors absorb losses before public funds are used. Resolution funds help stabilise the process. The goal is to protect financial stability while making those who took the risk pay first."},{"section":"Exam 16/06/2026 — Variant A","title_en":"Third pillar of EBU","en":"Describe the third pillar of the European Banking Union","sample_en":"The third pillar is deposit protection through Deposit Guarantee Schemes (DGS). If a bank fails, retail depositors should still get their money back quickly, up to the legal limit — in the EU typically €100,000 per person per bank. This reduces panic withdrawals and protects small savers. National guarantee funds are financed by contributions from banks. The EU is also working toward a more integrated European Deposit Insurance Scheme (EDIS), but the third pillar is mainly about confidence: people know deposits are safe even when a bank goes into resolution."},{"section":"Exam 16/06/2026 — Variant A","title_en":"IPO","en":"Describe IPO (Initial Public Offering)","sample_en":"An IPO (Initial Public Offering) is when a company sells its shares to the public for the first time and lists on a stock exchange. The firm raises new equity capital and becomes subject to disclosure rules and market scrutiny. Investment banks usually act as underwriters — they help set the price, place shares with investors, and often guarantee a minimum take-up. After listing, the shares that outsiders can freely buy and sell make up the free float."},{"section":"Exercises","title_en":"SoFP — smaller figures (5 pts)","en":"Build Statement of Financial Position for Uniclam Group Corp. (smaller figures)","sample_en":"Classify each item under non-current assets, current assets, equity, non-current liabilities, or current liabilities, then subtotal each block. Non-current assets (goodwill, intangibles, PPE) sum to 124,950; current assets (inventory, receivables, cash) to 79,900 — total assets 204,850. On the other side: equity 66,300, non-current liabilities 87,550, current liabilities 51,000 — total 204,850. Assets must equal equity plus liabilities.","link":"09_Statement_of_Financial_Position.html","link_label":"Full solution on page 09"},{"section":"Exercises","title_en":"SoFP — exam version (6 pts)","en":"Statement of Financial Position — exam version (larger figures)","sample_en":"Same logic as the smaller version, but with exam figures. Non-current assets total 374,850, current assets 239,700 — total assets 614,550. Equity 198,900, non-current liabilities 262,650, current liabilities 153,000 — total equity and liabilities 614,550. The balance must tie: Total Assets = Total Equity & Liabilities.","link":"09_Statement_of_Financial_Position.html","link_label":"Full solution on page 09"},{"section":"Exercises","title_en":"Division table — 2024 exam","en":"Divisions A/B: revenue 108k/72k; indirect per direct labour; selling per revenue; electricity & financial per raw materials.","sample_en":"First allocate shared costs using the rules given, then subtract total costs from revenue and apply 30% tax. Division A ends with net income 33,880; Division B with 14,840. The trick is not to forget any cost line and to apply each overhead to the correct base (direct labour, revenue, or raw materials).","howto_en":"Step 1 — allocation rules:\n  Indirect labour → by direct labour (A:B = 12:24)\n  Selling → by revenue (A:B = 108:72)\n  Electricity & Financial → by raw materials (A:B = 12:6)\n\nStep 2 — Division A:\n  Add direct costs + allocated overheads → total costs\n  Pre-tax profit = 108,000 − total costs = 48,400\n  Tax 30% = 14,520 → Net income = 33,880\n\nStep 3 — Division B:\n  Same method → Pre-tax 21,200 → Tax 6,360 → Net 14,840","link":"13_Divisions_and_DCF.html","link_label":"Worked example on page 13"},{"section":"Exercises","title_en":"Division table — 2025 tablet","en":"Divisions: revenue 144k/120k; indirect/selling/advertising/electricity/financial by allocation rules.","sample_en":"Allocate indirect labour by direct labour, selling and advertising by revenue, electricity and financial by raw materials. Division A is profitable (net income 32,214); Division B barely breaks even (net income 126) because its costs almost match revenue. Always check that shared costs add up to the totals given before splitting.","howto_en":"Division A (revenue 144,000):\n  Indirect 2,800 · Selling 13,091 · Advertising 13,636\n  Electricity 10,453 · Financial 14,000\n  Total costs 97,980 → Pre-tax 46,020 → Tax 13,806 → Net 32,214\n\nDivision B (revenue 120,000):\n  Total costs 119,820 → Pre-tax 180 → Tax 54 → Net 126","link":"13_Divisions_and_DCF.html","link_label":"Full table on page 13"},{"section":"Exercises","title_en":"DCF — Cassino SpA (8 pts)","en":"Evaluate Cassino SpA using DCF. WACC 5%, g 1%. Cash flows 2024–2028. Complete discount coefficients, DCFs, and W.","sample_en":"For each year, discount factor = 1 / (1.05)^n, then multiply by the cash flow. Sum all discounted cash flows to get enterprise value W ≈ 143,858. Each year’s contribution is roughly 24–31k after discounting; the 2028 figure is often the terminal cash flow given on the exam sheet.","howto_en":"Discount factor = 1 / (1.05)^n\n\n2024 (n=1): 0.9524 × 25,000 = 23,810\n2025 (n=2): 0.9070 × 30,000 = 27,211\n2026 (n=3): 0.8638 × 35,000 = 30,234\n2027 (n=4): 0.8227 × 38,000 = 31,263\n2028 (n=5): 0.7835 × 40,000 = 31,341\n\nW = 23,810 + 27,211 + 30,234 + 31,263 + 31,341 = 143,858","link":"13_Divisions_and_DCF.html","link_label":"Full DCF table on page 13"},{"section":"Exercises","title_en":"Production budget — May","en":"Omega: budgeted production for May? Sales May 90k, June 80k, 30% ending inventory.","sample_en":"Production is not the same as sales — you must cover ending inventory and use up beginning inventory. Ending inventory for May = 30% of June sales = 24,000 units. Beginning inventory = 30% of May sales = 27,000 units. So production = 90,000 + 24,000 − 27,000 = 87,000 units.","howto_en":"Formula: Production = Sales + Ending inventory − Beginning inventory\n\nEnding (May) = 30% × June sales = 0.30 × 80,000 = 24,000\nBeginning (May) = 30% × May sales = 0.30 × 90,000 = 27,000\n\nProduction = 90,000 + 24,000 − 27,000 = 87,000 units"},{"section":"Exercises","title_en":"Depreciation — Exercise 3 (8 pts)","en":"Cost $160,000, life 6 years, residual $28,000. (a) Annual charge straight-line and reducing balance 15%. (b) 6-year schedule for each method.","sample_en":"(a) Straight-line: spread depreciable amount evenly — (160,000 − 28,000) / 6 = $22,000 per year; after 6 years NBV equals residual $28,000. Reducing balance: each year charge 15% of the carrying value, so depreciation falls over time; year 6 NBV is about $60,344 (not equal to residual unless adjusted). (b) Build a table with cost, annual dep, accumulated dep, and NBV for each year under both methods.","link":"10_Depreciation.html","link_label":"Full schedules on page 10"},{"section":"Exercises","title_en":"Depreciation — straight-line schedule","en":"Asset $160,000, life 6 years, residual $28,000 — build 6-year schedule (straight-line).","sample_en":"Straight-line means the same depreciation every year: (160,000 − 28,000) / 6 = $22,000. Each year accumulated depreciation increases by 22,000 and NBV = cost − accumulated dep. After year 6, NBV should equal the residual value of $28,000.","howto_en":"Annual dep = (160,000 − 28,000) / 6 = 22,000\n\nEach year:\n  Depreciation = 22,000\n  Accumulated dep += 22,000\n  NBV = 160,000 − Accumulated dep\n\nYear 6: NBV = 28,000 (= residual)","link":"10_Depreciation.html","link_label":"Full table on page 10"},{"section":"Exercises","title_en":"Depreciation — reducing balance 15%","en":"Reducing balance 15% — 6-year schedule.","sample_en":"Under reducing balance, depreciation = 15% × opening carrying value each year, so the charge gets smaller as the asset ages. Year 1: 160,000 × 15% = 24,000 → NBV 136,000. Continue for 6 years; year 6 NBV ≈ 60,344. Unlike straight-line, NBV does not automatically reach the $28,000 residual unless you adjust the final year.","howto_en":"Each year: Dep = Carrying value × 15%, then NBV = Carrying − Dep\n\nYear 1: 24,000 dep → NBV 136,000\nYear 2: 20,400 dep → NBV 115,600\nYear 3: 17,340 → NBV 98,260\nYear 4: 14,739 → NBV 83,521\nYear 5: 12,528 → NBV 70,993\nYear 6: 10,649 → NBV 60,344","link":"10_Depreciation.html","link_label":"Full table on page 10"}]
    const SNA_ITEMS = []

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    const PAGE_SIZE = 20;
    let currentPage = 0;
    let paginatorTop = null;
    let paginatorBottom = null;
    let paginationLocked = false;

    function mcqPageCount() {
      return QUESTIONS.length ? Math.ceil(QUESTIONS.length / PAGE_SIZE) : 0;
    }

    function openPageCount() {
      return OPEN_ITEMS.length ? Math.ceil(OPEN_ITEMS.length / PAGE_SIZE) : 0;
    }

    function openItemPage(idx) {
      return mcqPageCount() + Math.floor(idx / PAGE_SIZE);
    }

    function totalPageCount() {
      let n = mcqPageCount();
      if (OPEN_ITEMS.length) n += openPageCount();
      if (SNA_ITEMS.length) n += 1;
      return Math.max(1, n);
    }

    function needsPagination() {
      return totalPageCount() > 1;
    }

    function pageLabel(page) {
      const mcqPages = mcqPageCount();
      if (page < mcqPages) {
        const from = page * PAGE_SIZE + 1;
        const to = Math.min((page + 1) * PAGE_SIZE, QUESTIONS.length);
        return 'Questions ' + from + '–' + to + ' · page ' + (page + 1) + ' of ' + totalPageCount();
      }
      const openStart = page - mcqPages;
      if (OPEN_ITEMS.length && page < mcqPages + openPageCount()) {
        const from = openStart * PAGE_SIZE + 1;
        const to = Math.min((openStart + 1) * PAGE_SIZE, OPEN_ITEMS.length);
        return 'Open questions ' + from + '–' + to + ' · page ' + (page + 1) + ' of ' + totalPageCount();
      }
      return 'Calculations · page ' + (page + 1) + ' of ' + totalPageCount();
    }

    function createPaginator(className) {
      const el = document.createElement('div');
      el.className = className;
      el.innerHTML = '<span class="paginator-info"></span><div class="paginator-btns">' +
        '<button type="button" class="secondary" data-nav="prev">← Previous</button>' +
        '<button type="button" class="secondary" data-nav="next">Next →</button></div>';
      el.querySelector('[data-nav="prev"]').addEventListener('click', () => goToPage(currentPage - 1));
      el.querySelector('[data-nav="next"]').addEventListener('click', () => goToPage(currentPage + 1));
      return el;
    }

    function updatePaginator() {
      const show = needsPagination() && !paginationLocked;
      [paginatorTop, paginatorBottom].forEach((p) => {
        if (!p) return;
        p.style.display = show ? '' : 'none';
        if (!show) return;
        p.querySelector('.paginator-info').textContent = pageLabel(currentPage);
        p.querySelector('[data-nav="prev"]').disabled = currentPage <= 0;
        p.querySelector('[data-nav="next"]').disabled = currentPage >= totalPageCount() - 1;
      });
      updateCheckButton();
    }

    function applyPageVisibility() {
      container.querySelectorAll('[data-page]').forEach((el) => {
        const p = Number(el.dataset.page);
        el.classList.toggle('page-hidden', paginationLocked ? false : p !== currentPage);
      });
      updatePaginator();
    }

    function goToPage(page) {
      if (paginationLocked) return;
      currentPage = Math.max(0, Math.min(totalPageCount() - 1, page));
      applyPageVisibility();
      const target = paginatorTop || container;
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setupPagination() {
      paginationLocked = false;
      currentPage = 0;
      if (paginatorTop) {
        paginatorTop.remove();
        paginatorBottom.remove();
        paginatorTop = paginatorBottom = null;
      }
      if (!needsPagination()) {
        updateCheckButton();
        return;
      }
      paginatorTop = createPaginator('paginator paginator-top');
      paginatorBottom = createPaginator('paginator paginator-bottom');
      container.before(paginatorTop);
      const actions = form.querySelector('.actions');
      form.insertBefore(paginatorBottom, actions);
      goToPage(0);
      updateCheckButton();
    }

    function showAllPages() {
      paginationLocked = true;
      applyPageVisibility();
    }

    function pageForMcqIndex(idx) {
      return Math.floor(idx / PAGE_SIZE);
    }

    function isMcqPage(page) {
      return page < mcqPageCount();
    }

    function questionsForPage(page) {
      const items = [];
      QUESTIONS.forEach((q, idx) => {
        if (pageForMcqIndex(idx) === page) items.push(q);
      });
      return items;
    }

    function questionsToCheck() {
      if (needsPagination() && isMcqPage(currentPage)) {
        return questionsForPage(currentPage);
      }
      return QUESTIONS;
    }

    function updateCheckButton() {
      const btn = form.querySelector('.actions button[type="submit"]');
      if (!btn) return;
      if (!btn.dataset.defaultLabel) btn.dataset.defaultLabel = btn.textContent;
      if (!QUESTIONS.length && OPEN_ITEMS.length) {
        const from = currentPage * PAGE_SIZE + 1;
        const to = Math.min((currentPage + 1) * PAGE_SIZE, OPEN_ITEMS.length);
        btn.textContent = 'Show sample answers (' + from + '–' + to + ')';
      } else if (needsPagination() && isMcqPage(currentPage)) {
        btn.textContent = 'Check this page (' + questionsForPage(currentPage).length + ')';
      } else {
        btn.textContent = btn.dataset.defaultLabel;
      }
    }

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q, idx) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.dataset.page = String(pageForMcqIndex(idx));
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.dataset.page = String(pageForMcqIndex(idx));
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</span>
              </label>`).join('')}
          </div>
          ${q.explain ? `<details class="solution"><summary>📗 Solution</summary><div class="howto">${q.explain}</div></details>` : ''}
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let openSection = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const sec = item.section || (item.howto_en ? 'Exercises' : 'Theory — short answers');
        if (sec !== openSection) {
          openSection = sec;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.dataset.page = String(openItemPage(idx));
          h.textContent = sec;
          container.appendChild(h);
        }
        const block = document.createElement('div');
        block.className = 'open-block';
        block.dataset.page = String(openItemPage(idx));
        const brief = item.sample_en || '';
        block.innerHTML = `
          <div class="q-num">${item.title_en || item.en}</div>
          <div class="q-en">${item.en}</div>
          ${brief ? `<div class="brief-answer"><div class="brief-label">Answer</div><div class="brief-text">${brief}</div></div>` : ''}
          <textarea name="open_${idx}" placeholder="Your answer (optional)..."></textarea>`;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.dataset.page = String(mcqPageCount() + openPageCount());
      h.textContent = 'SNA — calculations';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.dataset.page = String(mcqPageCount() + openPageCount());
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const page = currentPage;
      container.querySelectorAll('.open-block').forEach((block) => {
        if (Number(block.dataset.page) !== page) return;
        block.querySelectorAll('details.solution').forEach((d) => { d.open = true; });
      });
      resultsBox.classList.add('visible');
      document.getElementById('score-text').textContent =
        'Sample answers shown for page ' + (page + 1) + ' of ' + totalPageCount();
      document.getElementById('score-detail').textContent =
        'Write your answer first, then click to reveal samples. Use links for full worked solutions.';
      document.getElementById('warn-text').hidden = true;
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      setupPagination();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    setupPagination();
    
  </script>
</body>
</html>
