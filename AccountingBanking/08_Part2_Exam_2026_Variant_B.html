<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Part 2 — Exam 25/06/2026 (Variant B)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.65;
      margin: 0;
      padding: 2rem 1rem 3rem;
      color: #1a1a2e;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .back { margin-bottom: 1rem; }
    .back a { color: #16a085; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    h1 {
      color: #2c3e50;
      border-bottom: 4px solid #16a085;
      padding-bottom: 12px;
      font-size: 1.75rem;
    }
    .sub { color: #555; margin: 0.5rem 0 1.5rem; }
    .rules {
      background: #fff;
      border-left: 4px solid #16a085;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .section-title {
      font-size: 1.15rem;
      color: #16a085;
      margin: 2rem 0 1rem;
      font-weight: 600;
    }
    .q {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid #e8ecf1;
    }
    .q.unanswered { border-color: #e74c3c; }
    .q.correct { border-color: #27ae60; background: #f6fff9; }
    .q.wrong { border-color: #e74c3c; background: #fff8f8; }
    .q-num { font-weight: 700; color: #16a085; margin-bottom: 0.35rem; }
    .q-en { font-size: 1.02rem; margin-bottom: 0.35rem; }
    .q-ru { font-size: 0.88rem; color: #666; margin-bottom: 0.75rem; font-style: italic; }
    .opts { display: grid; gap: 0.45rem; }
    label.opt {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }
    label.opt:hover { background: #eef9f6; }
  .result-opt { cursor: default; }
    label.opt input { margin-top: 0.25rem; flex-shrink: 0; }
    .opt-en { font-size: 0.95rem; }
    .opt-ru { font-size: 0.82rem; color: #777; font-style: italic; }
    .feedback {
      margin-top: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.92rem;
    }
    .feedback.ok { background: #e8f8ef; color: #1e7e45; }
    .feedback.bad { background: #fdecea; color: #c0392b; }
    .open-block {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .open-block textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 0.5rem;
      padding: 0.65rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }
    .sample {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #eefaf7;
      border-radius: 8px;
      border-left: 3px solid #16a085;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .matrix-wrap { overflow-x: auto; margin: 1rem 0; }
    table.matrix {
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 0 auto;
    }
    table.matrix th, table.matrix td {
      border: 1px solid #ccc;
      padding: 4px 8px;
      text-align: center;
    }
    table.matrix th { background: #16a085; color: #fff; }
    .actions {
      position: sticky;
      bottom: 0;
      background: rgba(245,247,250,.95);
      backdrop-filter: blur(6px);
      padding: 1rem 0;
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #16a085;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #138d75; }
    button.secondary {
      background: #fff;
      color: #16a085;
      border: 2px solid #16a085;
    }
    #results {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      border: 2px solid #16a085;
    }
    #results.visible { display: block; }
    .score { font-size: 1.35rem; font-weight: 700; color: #2c3e50; }
    .score-detail { color: #555; margin-top: 0.35rem; }
    .warn { color: #e74c3c; font-weight: 600; margin-top: 0.5rem; }
    mark.correct-mark { background: #d5f5e3; padding: 0 4px; border-radius: 3px; }
    mark.wrong-mark { background: #fadbd8; padding: 0 4px; border-radius: 3px; }
    .howto {
      margin-top: 0.75rem;
      padding: 0.85rem 1rem;
      background: #eefaf7;
      border-radius: 8px;
      border-left: 3px solid #16a085;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .explain { margin-top: 0.5rem; font-size: 0.88rem; opacity: 0.95; }
        .brief-answer {
      margin: 0.65rem 0 0.85rem;
      padding: 0.7rem 1rem;
      background: #e8f8ef;
      border-left: 4px solid #27ae60;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .brief-label { font-weight: 600; color: #1e7e45; font-size: 0.82rem; margin-bottom: 0.2rem; }
    .brief-text { color: #1a1a2e; }
    .answer-label { font-weight: 600; color: #16a085; margin-top: 0.75rem; font-size: 0.9rem; }
    .reveal-btn { margin-top: 0.6rem; font-size: 0.88rem; padding: 0.45rem 1rem; }
    details.solution { margin-top: 0.75rem; font-size: 0.9rem; }
    details.solution summary { cursor: pointer; color: #16a085; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="index.html">← К тестам Accounting & Banking</a></p>
    <h1>Part 2 — Exam 25/06/2026 (Variant B)</h1>
    <p class="sub">18 MCQ — Basel I, IFRS 9, VaR, options</p>
    <div class="rules">1 балл за верный ответ. Без штрафа за ошибку.</div>
    <form id="test-form">
      <div id="questions"></div>
      
      <div class="actions">
        <button type="submit">Проверить ответы</button>
        <button type="button" class="secondary" id="reset-btn">Сбросить</button>
      </div>
    </form>
    <div id="results">
      <div class="score" id="score-text"></div>
      <p class="score-detail" id="score-detail"></p>
      <p class="warn" id="warn-text" hidden></p>
    </div>
  </div>
  <script>
    const SCORING = {"correct": 1, "wrong": 0, "max": null};
    const QUESTIONS = [{"num": 1, "id": "q1", "en": "What is the main risk considered by Basel I?", "ru": "Главный риск в Basel I:", "options": [{"id": "a", "en": "Interest rate risk", "ru": "Процентный риск"}, {"id": "b", "en": "Market risk", "ru": "Рыночный риск"}, {"id": "c", "en": "Credit risk", "ru": "Кредитный риск"}, {"id": "d", "en": "Concentration risk", "ru": "Риск концентрации"}], "correct": "c", "section": null}, {"num": 2, "id": "q2", "en": "Duration is useful for the evaluation of:", "ru": "Duration полезна для оценки:", "options": [{"id": "a", "en": "Bond", "ru": "Облигации"}, {"id": "b", "en": "Shares", "ru": "Акций"}, {"id": "c", "en": "Derivatives", "ru": "Производных инструментов"}, {"id": "d", "en": "None of the above", "ru": "Ни один из перечисленных"}], "correct": "a", "section": null}, {"num": 3, "id": "q3", "en": "In the financial system, exchange of money:", "ru": "В финансовой системе обмен денег:", "options": [{"id": "a", "en": "Indirect and direct circuit", "ru": "Прямой и непрямой контур"}, {"id": "b", "en": "Direct circuit only", "ru": "Только прямой"}, {"id": "c", "en": "Indirect circuit only", "ru": "Только непрямой"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 4, "id": "q4", "en": "Banks operate as credit intermediaries in:", "ru": "Банки как кредитные посредники действуют в:", "options": [{"id": "a", "en": "Indirect circuit but only for IPO", "ru": "Непрямом контуре, только IPO"}, {"id": "b", "en": "Direct circuit but only for IPO", "ru": "Прямом контуре, только IPO"}, {"id": "c", "en": "Direct circuit", "ru": "Прямом контуре"}, {"id": "d", "en": "Indirect circuit", "ru": "Непрямом контуре"}], "correct": "d", "section": null}, {"num": 5, "id": "q5", "en": "Total loans to customers are:", "ru": "Совокупные кредиты клиентам отражаются:", "options": [{"id": "a", "en": "In liabilities of balance sheet", "ru": "В обязательствах баланса"}, {"id": "b", "en": "In liabilities of income statement", "ru": "В обязательствах отчёта о прибылях"}, {"id": "c", "en": "In assets of income statement", "ru": "В активах отчёта о прибылях"}, {"id": "d", "en": "In assets of banks' balance sheet", "ru": "В активах баланса банка"}], "correct": "d", "section": null}, {"num": 6, "id": "q6", "en": "First pillar of European Banking Union:", "ru": "Первый столп EBU:", "options": [{"id": "a", "en": "Sustainability", "ru": "Устойчивость"}, {"id": "b", "en": "Deposit guarantee schemes", "ru": "Гарантии вкладов"}, {"id": "c", "en": "Resolution mechanisms", "ru": "Resolution"}, {"id": "d", "en": "Supervision", "ru": "Надзор"}], "correct": "d", "section": null}, {"num": 7, "id": "q7", "en": "In the DCF model we have:", "ru": "В модели DCF есть:", "options": [{"id": "a", "en": "Asset side and equity side approach", "ru": "Подход со стороны активов и equity"}, {"id": "b", "en": "Only asset side approach", "ru": "Только со стороны активов"}, {"id": "c", "en": "Only equity side approach", "ru": "Только со стороны equity"}, {"id": "d", "en": "Income approach", "ru": "Доходный подход"}], "correct": "a", "section": null}, {"num": 8, "id": "q8", "en": "Value at Risk (VaR) is useful to manage:", "ru": "VaR используется для управления:", "options": [{"id": "a", "en": "Market risk", "ru": "Рыночным риском"}, {"id": "b", "en": "Credit risk", "ru": "Кредитным риском"}, {"id": "c", "en": "Counterpart risk", "ru": "Риском контрагента"}, {"id": "d", "en": "None of the answers", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 9, "id": "q9", "en": "CAPM cost of equity uses:", "ru": "Стоимость equity по CAPM:", "options": [{"id": "a", "en": "Risk free rate, beta, market risk premium", "ru": "Rf, бета, премия за риск"}, {"id": "b", "en": "Beta and WACC", "ru": "Бета и WACC"}, {"id": "c", "en": "WACC", "ru": "WACC"}, {"id": "d", "en": "Only risk free rate", "ru": "Только Rf"}], "correct": "a", "section": null}, {"num": 10, "id": "q10", "en": "If price of underlying asset increases, payoff of call option buyer:", "ru": "Если цена базового актива растёт, payoff покупателя call:", "options": [{"id": "a", "en": "Higher", "ru": "Выше"}, {"id": "b", "en": "Lower", "ru": "Ниже"}, {"id": "c", "en": "Stable", "ru": "Стабилен"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 11, "id": "q11", "en": "IFRS 9 is divided into:", "ru": "IFRS 9 делится на:", "options": [{"id": "a", "en": "5 stages", "ru": "5 стадий"}, {"id": "b", "en": "3 stages", "ru": "3 стадии"}, {"id": "c", "en": "4 stages", "ru": "4 стадии"}, {"id": "d", "en": "6 stages", "ru": "6 стадий"}], "correct": "b", "section": null}, {"num": 12, "id": "q12", "en": "Credit risk is more important in:", "ru": "Кредитный риск важнее для:", "options": [{"id": "a", "en": "Commercial banks", "ru": "Коммерческих банков"}, {"id": "b", "en": "Investment banks", "ru": "Инвестиционных банков"}, {"id": "c", "en": "Diversified banks", "ru": "Диверсифицированных банков"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 13, "id": "q13", "en": "SICR (significant increase in credit risk):", "ru": "SICR (значительное увеличение кредитного риска):", "options": [{"id": "a", "en": "Activates Stage 2 measurement", "ru": "Активирует измерение Stage 2"}, {"id": "b", "en": "Activates Stage 4", "ru": "Активирует Stage 4"}, {"id": "c", "en": "Activates Stage 3", "ru": "Активирует Stage 3"}, {"id": "d", "en": "Not related to credit risk", "ru": "Не связан с кредитным риском"}], "correct": "a", "section": null}, {"num": 14, "id": "q14", "en": "From bank perspective, secured loans:", "ru": "С точки зрения банка, обеспеченные кредиты:", "options": [{"id": "a", "en": "Are safer than unsecured loans", "ru": "Безопаснее необеспеченных"}, {"id": "b", "en": "Are riskier than unsecured", "ru": "Рискованнее необеспеченных"}, {"id": "c", "en": "Only instrument for SMEs", "ru": "Единственный инструмент для МСП"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 15, "id": "q15", "en": "Activity specific to investment banks:", "ru": "Деятельность, характерная для инвестбанков:", "options": [{"id": "a", "en": "Issuing listed bonds", "ru": "Выпуск листинговых облигаций"}, {"id": "b", "en": "Credit intermediation", "ru": "Кредитное посредничество"}, {"id": "c", "en": "General lending", "ru": "Обычное кредитование"}, {"id": "d", "en": "None of the answers", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 16, "id": "q16", "en": "Total value of business regardless of capital structure:", "ru": "Стоимость бизнеса независимо от структуры капитала:", "options": [{"id": "a", "en": "Firm value", "ru": "Firm value"}, {"id": "b", "en": "Equity value", "ru": "Equity value"}, {"id": "c", "en": "Net debt", "ru": "Net debt"}, {"id": "d", "en": "None of the answers", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 17, "id": "q17", "en": "The bad-bank:", "ru": "Bad-bank:", "options": [{"id": "a", "en": "Optional choice of managers", "ru": "Добровольный выбор менеджеров"}, {"id": "b", "en": "Related only to customer creditworthiness", "ru": "Только кредитоспособность клиентов"}, {"id": "c", "en": "Resolution mechanism of first pillar EBU", "ru": "Resolution 1-го столпа"}, {"id": "d", "en": "Resolution mechanism of second pillar EBU", "ru": "Resolution 2-го столпа EBU"}], "correct": "d", "section": null}, {"num": 18, "id": "q18", "en": "Net interest margin % is a:", "ru": "Net interest margin % — это:", "options": [{"id": "a", "en": "Profitability ratio", "ru": "Показатель рентабельности"}, {"id": "b", "en": "Efficiency ratio", "ru": "Показатель эффективности"}, {"id": "c", "en": "Solvency ratio", "ru": "Показатель платёжеспособности"}, {"id": "d", "en": "Equity ratio", "ru": "Показатель equity"}], "correct": "a", "section": null}];
    const OPEN_ITEMS = [];
    const SNA_ITEMS = [];

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span>
                  <div class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</div>
                  <div class="opt-ru">${o.ru}</div>
                </span>
              </label>`).join('')}
          </div>
          ${q.explain_ru ? `<details class="solution"><summary>📗 Решение</summary><div class="howto">${q.explain_ru}</div></details>` : ''}
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let openSection = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const sec = item.section || (item.howto_ru ? 'Exercises' : 'Theory — short answers');
        if (sec !== openSection) {
          openSection = sec;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = sec;
          container.appendChild(h);
        }
        const block = document.createElement('div');
        block.className = 'open-block';
        const brief = item.sample_en || item.sample_ru || '';
        block.innerHTML = `
          <div class="q-num">${item.title_ru}</div>
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          ${brief ? `<div class="brief-answer"><div class="brief-label">Answer</div><div class="brief-text">${brief}</div></div>` : ''}
          <textarea name="open_${idx}" placeholder="Your answer (optional)..."></textarea>`;
        if (item.howto_ru) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'reveal-btn secondary';
          btn.textContent = 'Show full solution';
          const answerBlock = document.createElement('div');
          answerBlock.className = 'answer-block';
          answerBlock.hidden = true;
          answerBlock.innerHTML = '<div class="answer-label">Full solution</div><div class="howto"></div>';
          answerBlock.querySelector('.howto').textContent = item.howto_ru;
          btn.addEventListener('click', () => {
            answerBlock.hidden = false;
            btn.hidden = true;
          });
          block.appendChild(btn);
          block.appendChild(answerBlock);
        }
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — расчёты';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let unanswered = 0;
      let correct = 0;
      let wrong = 0;
      const warnEl = document.getElementById('warn-text');

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Ответьте на все вопросы с вариантами (${unanswered} без ответа).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Ответ не выбран. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Ваш ответ: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>' +
            (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

      container.querySelectorAll('.open-block .sample, .open-block .howto').forEach(el => { el.hidden = false; });

      container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Пустой ответ. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Результат: ${correct} из ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Баллы: ${score.toFixed(1)} · Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`
          : `Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
