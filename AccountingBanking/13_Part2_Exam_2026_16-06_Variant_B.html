 "ru": "M&A"}, {"id": "d", "en": "IPO", "ru": "IPO"}], "correct": "a", "section": null, "explain_ru": "Банк — финансовый посредник → непрямой контур (indirect circuit)."}, {"num": 5, "id": "q5", "en": "The total of the deposits of the customers are", "ru": "Совокупность депозитов клиентов отражается:", "options": [{"id": "a", "en": "In the liabilities of the banks' balance sheet", "ru": "В обязательствах баланса банка"}, {"id": "b", "en": "In the liabilities of the banks' income statement", "ru": "В обязательствах отчёта о прибылях"}, {"id": "c", "en": "In the asset of the banks' income statement", "ru": "В активах отчёта о прибылях"}, {"id": "d", "en": "In the asset of the banks' balance sheet", "ru": "В активах баланса банка"}], "correct": "a", "section": null}, {"num": 6, "id": "q6", "en": "In the capital markets service of the investment banks, banks can operate", "ru": "В услугах капитальных рынков инвестбанки могут работать:", "options": [{"id": "a", "en": "Only in primary markets", "ru": "Только на первичном рынке"}, {"id": "b", "en": "Only in secondary markets", "ru": "Только на вторичном рынке"}, {"id": "c", "en": "Both in primary and secondary markets", "ru": "На первичном и вторичном рынках"}, {"id": "d", "en": "Only for IPO", "ru": "Только для IPO"}], "correct": "c", "section": null}, {"num": 7, "id": "q7", "en": "Which of the following is a service offered by investment banks?", "ru": "Какая услуга предоставляется инвестиционными банками?", "options": [{"id": "a", "en": "Asset management", "ru": "Управление активами"}, {"id": "b", "en": "Corporate finance", "ru": "Корпоративные финансы"}, {"id": "c", "en": "Risk management", "ru": "Управление рисками"}, {"id": "d", "en": "All the previous answers", "ru": "Все перечисленные"}], "correct": "d", "section": null}, {"num": 8, "id": "q8", "en": "The Deposit Guarantee Schemes Directive is related", "ru": "Директива о гарантиях вкладов относится:", "options": [{"id": "a", "en": "To the fourth pillar of European Banking Union", "ru": "К 4-му столпу EBU"}, {"id": "b", "en": "To the third pillar of European Banking Union", "ru": "К 3-му столпу EBU"}, {"id": "c", "en": "To the first pillar of European Banking Union", "ru": "К 1-му столпу EBU"}, {"id": "d", "en": "To the second pillar of European Banking Union", "ru": "Ко 2-му столпу EBU"}], "correct": "b", "section": null, "explain_ru": "3-й столп EBU — Deposit Guarantee Schemes (DGS)."}, {"num": 9, "id": "q9", "en": "Usually, venture capitalists buy", "ru": "Обычно венчурные капиталисты покупают:", "options": [{"id": "a", "en": "Shares of stable companies", "ru": "Акции стабильных компаний"}, {"id": "b", "en": "Bonds of stable companies", "ru": "Облигации стабильных компаний"}, {"id": "c", "en": "Shares of young companies with good potential", "ru": "Акции молодых компаний с хорошим потенциалом"}, {"id": "d", "en": "Bonds of young companies with good potential", "ru": "Облигации молодых компаний с потенциалом"}], "correct": "c", "section": null}, {"num": 10, "id": "q10", "en": "Bail-in is a measure related to", "ru": "Bail-in относится:", "options": [{"id": "a", "en": "The second pillar of EBU", "ru": "Ко 2-му столпу EBU"}, {"id": "b", "en": "The first pillar of EBU", "ru": "К 1-му столпу EBU"}, {"id": "c", "en": "CAPM", "ru": "К CAPM"}, {"id": "d", "en": "APT", "ru": "К APT"}], "correct": "a", "section": null, "explain_ru": "Bail-in — инструмент resolution (2-й столп EBU)."}, {"num": 11, "id": "q11", "en": "Stage 1 of IFRS 9 is called", "ru": "Стадия 1 IFRS 9 называется:", "options": [{"id": "a", "en": "Non-performing", "ru": "Non-performing"}, {"id": "b", "en": "Performing", "ru": "Performing"}, {"id": "c", "en": "Under performing", "ru": "Under-performing"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "b", "section": null}, {"num": 12, "id": "q12", "en": "Usually credit risk is more important in", "ru": "Обычно кредитный риск важнее для:", "options": [{"id": "a", "en": "Commercial banks", "ru": "К г"}, {"id": "d", "en": "Derivatives", "ru": "Производные инструменты"}], "correct": "a", "section": null, "explain_ru": "Equity не требует фиксированных выплат, в отличие от долга/облигаций."}, {"num": 17, "id": "q17", "en": "In the operations of a bank 'Non-financial debts' are", "ru": "В операциях банка «non-financial debts» — это:", "options": [{"id": "a", "en": "Interest bearing asset", "ru": "Процентный актив"}, {"id": "b", "en": "Non-expensive liabilities", "ru": "Беспроцентные обязательства"}, {"id": "c", "en": "Real asset", "ru": "Реальный актив"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "b", "section": null, "explain_ru": "В билете: non-expensive liabilities ≈ non-interest-bearing liabilities."}, {"num": 18, "id": "q18", "en": "Which of the following financing instruments for a business provides a secure and predictable cash outflow?", "ru": "Какой инструмент финансирования даёт предсказуемый денежный отток:", "options": [{"id": "a", "en": "Increase of Equity", "ru": "Увеличение equity"}, {"id": "b", "en": "Bank debt, like mortgage", "ru": "Банковский долг, например ипотека"}, {"id": "c", "en": "Increase of share capital", "ru": "Увеличение уставного капитала"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "b", "section": null, "explain_ru": "Банковский долг — фиксированные/предсказуемые платежи по графику."}];
    const OPEN_ITEMS = [];
    const SNA_ITEMS = [];

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span>
                  <div class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</div>
                  <div class="opt-ru">${o.ru}</div>
                </span>
              </label>`).join('')}
          </div>
          ${q.explain_ru ? `<details class="solution"><summary>📗 Решение</summary><div class="howto">${q.explain_ru}</div></details>` : ''}
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      let openSection = '';
      OPEN_ITEMS.forEach((item, idx) => {
        const sec = item.section || (item.howto_ru ? 'Exercises' : 'Theory — short answers');
        if (sec !== openSection) {
          openSection = sec;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = sec;
          container.appendChild(h);
        }
        const block = document.createElement('div');
        block.className = 'open-block';
        const brief = item.sample_en || item.sample_ru || '';
        block.innerHTML = `
          <div class="q-num">${item.title_ru}</div>
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          ${brief ? `<div class="brief-answer"><div class="brief-label">Answer</div><div class="brief-text">${brief}</div></div>` : ''}
          <textarea name="open_${idx}" placeholder="Your answer (optional)..."></textarea>`;
        if (item.howto_ru) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'reveal-btn secondary';
          btn.textContent = 'Show full solution';
          const answerBlock = document.createElement('div');
          answerBlock.className = 'answer-block';
          answerBlock.hidden = true;
          answerBlock.innerHTML = '<div class="answer-label">Full solution</div><div class="howto"></div>';
          answerBlock.querySelector('.howto').textContent = item.howto_ru;
          btn.addEventListener('click', () => {
            answerBlock.hidden = false;
            btn.hidden = true;
          });
          block.appendChild(btn);
          block.appendChild(answerBlock);
        }
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — расчёты';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

      let correct = 0;
      let wrong = 0;

        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Ответьте на все вопросы с вариантами (${unanswered} без ответа).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Ответ не выбран. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Ваш ответ: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Correct: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>' +
            (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

      container.querySelectorAll('.open-block .sample').forEach(el => { el.hidden = false; });

      container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Пустой ответ. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Результат: ${correct} из ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Баллы: ${score.toFixed(1)} · Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`
          : `Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
