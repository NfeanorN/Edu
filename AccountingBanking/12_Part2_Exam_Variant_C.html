<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Part 2 — Exam Variant C (Q7–14)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.65;
      margin: 0;
      padding: 2rem 1rem 3rem;
      color: #1a1a2e;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .back { margin-bottom: 1rem; }
    .back a { color: #16a085; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    h1 {
      color: #2c3e50;
      border-bottom: 4px solid #16a085;
      padding-bottom: 12px;
      font-size: 1.75rem;
    }
    .sub { color: #555; margin: 0.5rem 0 1.5rem; }
    .rules {
      background: #fff;
      border-left: 4px solid #16a085;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .section-title {
      font-size: 1.15rem;
      color: #16a085;
      margin: 2rem 0 1rem;
      font-weight: 600;
    }
    .q {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid #e8ecf1;
    }
    .q.unanswered { border-color: #e74c3c; }
    .q.correct { border-color: #27ae60; background: #f6fff9; }
    .q.wrong { border-color: #e74c3c; background: #fff8f8; }
    .q-num { font-weight: 700; color: #16a085; margin-bottom: 0.35rem; }
    .q-en { font-size: 1.02rem; margin-bottom: 0.35rem; }
    .q-ru { font-size: 0.88rem; color: #666; margin-bottom: 0.75rem; font-style: italic; }
    .opts { display: grid; gap: 0.45rem; }
    label.opt {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }
    label.opt:hover { background: #eef9f6; }
  .result-opt { cursor: default; }
    label.opt input { margin-top: 0.25rem; flex-shrink: 0; }
    .opt-en { font-size: 0.95rem; }
    .opt-ru { font-size: 0.82rem; color: #777; }
    .feedback {
      margin-top: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.92rem;
    }
    .feedback.ok { background: #e8f8ef; color: #1e7e45; }
    .feedback.bad { background: #fdecea; color: #c0392b; }
    .open-block {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .open-block textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 0.5rem;
      padding: 0.65rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }
    .sample {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #eefaf7;
      border-radius: 8px;
      border-left: 3px solid #16a085;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .brief-answer {
      margin: 0.75rem 0;
      padding: 0.75rem 0.9rem;
      background: #e8f8ef;
      border-radius: 8px;
      border-left: 3px solid #27ae60;
      font-size: 0.92rem;
      white-space: pre-wrap;
    }
    .brief-label { font-size: 0.8rem; font-weight: 600; color: #1e7e45; margin-bottom: 0.35rem; }
    .matrix-wrap { overflow-x: auto; margin: 1rem 0; }
    table.matrix {
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 0 auto;
    }
    table.matrix th, table.matrix td {
      border: 1px solid #ccc;
      padding: 4px 8px;
      text-align: center;
    }
    table.matrix th { background: #16a085; color: #fff; }
    .actions {
      position: sticky;
      bottom: 0;
      background: rgba(245,247,250,.95);
      backdrop-filter: blur(6px);
      padding: 1rem 0;
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #16a085;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #138d75; }
    button.secondary {
      background: #fff;
      color: #16a085;
      border: 2px solid #16a085;
    }
    #results {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      border: 2px solid #16a085;
    }
    #results.visible { display: block; }
    .score { font-size: 1.35rem; font-weight: 700; color: #2c3e50; }
    .score-detail { color: #555; margin-top: 0.35rem; }
    .warn { color: #e74c3c; font-weight: 600; margin-top: 0.5rem; }
    mark.correct-mark { background: #d5f5e3; padding: 0 4px; border-radius: 3px; }
    mark.wrong-mark { background: #fadbd8; padding: 0 4px; border-radius: 3px; }
    .howto {
      margin-top: 0.5rem;
      padding: 0.85rem 1rem;
      background: #eefaf7;
      border-radius: 8px;
      border-left: 3px solid #16a085;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .explain { margin-top: 0.5rem; font-size: 0.88rem; opacity: 0.95; }
    .answer-label { font-weight: 600; color: #16a085; margin-top: 0.75rem; font-size: 0.9rem; }
    .brief-answer {
      margin: 0.65rem 0 0.85rem;
      padding: 0.7rem 1rem;
      background: #e8f8ef;
      border-left: 4px solid #27ae60;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .brief-label { font-weight: 600; color: #1e7e45; font-size: 0.82rem; margin-bottom: 0.2rem; }
    .brief-text { color: #1a1a2e; }
    .reveal-btn { margin-top: 0.6rem; font-size: 0.88rem; padding: 0.45rem 1rem; }
    details.solution { margin-top: 0.75rem; font-size: 0.9rem; }
    details.solution summary { cursor: pointer; color: #16a085; font-weight: 600; }
    .exam-photo { max-width: 100%; margin: 1rem 0 1.5rem; }
    .exam-photo img { width: 100%; height: auto; border-radius: 8px; border: 1px solid #e8ecf1; display: block; }
    .exam-photo figcaption { font-size: 0.85rem; color: #666; margin-top: 0.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="index.html">← К тестам Accounting & Banking</a></p>
    <h1>Part 2 — Exam Variant C (Q7–14)</h1>
    <p class="sub">DGS pillar, IFRS 9 Stage 1, call options</p>
    <p class="sub"><a href="00_How_To_Solve.html">📘 How to solve tasks — step-by-step guide</a></p><div class="rules">1 балл за верный ответ.</div>
    <form id="test-form">
      <div id="questions"></div>
      
      <div class="actions">
        <button type="submit">Проверить ответы</button>
        <button type="button" class="secondary" id="reset-btn">Сбросить</button>
      </div>
    </form>
    <div id="results">
      <div class="score" id="score-text"></div>
      <p class="score-detail" id="score-detail"></p>
      <p class="warn" id="warn-text" hidden></p>
    </div>
  </div>
  <script>
    const SCORING = {"correct": 1, "wrong": 0, "max": null};
    const QUESTIONS = [{"num": 7, "id": "q7", "en": "In the DCF model we have:", "ru": "В модели DCF:", "options": [{"id": "a", "en": "Asset side and equity side approach", "ru": "Подход со стороны активов и equity"}, {"id": "b", "en": "Only asset side approach", "ru": "Только со стороны активов"}, {"id": "c", "en": "Only equity side approach", "ru": "Только со стороны equity"}, {"id": "d", "en": "Income approach", "ru": "Доходный подход"}], "correct": "a", "section": null}, {"num": 8, "id": "q8", "en": "The Deposit Guarantee Schemes Directive is related to:", "ru": "Директива о гарантиях вкладов относится к:", "options": [{"id": "a", "en": "Fourth pillar of EBU", "ru": "4-й столп EBU"}, {"id": "b", "en": "Third pillar of EBU", "ru": "3-й столп EBU"}, {"id": "c", "en": "First pillar of EBU", "ru": "1-й столп EBU"}, {"id": "d", "en": "Second pillar of EBU", "ru": "2-й столп EBU"}], "correct": "b", "section": null, "explain_ru": "EBU: 1 надзор, 2 resolution, 3 гарантии вкладов (DGS)."}, {"num": 9, "id": "q9", "en": "Market risk premium is useful to calculate:", "ru": "Премия за рыночный риск нужна для:", "options": [{"id": "a", "en": "Cost of equity and WACC", "ru": "Cost of equity и WACC"}, {"id": "b", "en": "Cost of equity", "ru": "Cost of equity"}, {"id": "c", "en": "Cost of debt", "ru": "Cost of debt"}, {"id": "d", "en": "Only risk free rate", "ru": "Только Rf"}], "correct": "b", "section": null, "explain_ru": "CAPM: Re = Rf + β × MRP."}, {"num": 10, "id": "q10", "en": "If price of underlying asset decreases, payoff of call option buyer:", "ru": "Если цена актива падает, payoff покупателя call:", "options": [{"id": "a", "en": "Higher", "ru": "Выше"}, {"id": "b", "en": "Lower", "ru": "Ниже"}, {"id": "c", "en": "Stable", "ru": "Стабилен"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "b", "section": null, "explain_ru": "Call: рост цены → выше payoff; падение → ниже."}, {"num": 11, "id": "q11", "en": "Stage 1 of IFRS 9 is called:", "ru": "Стадия 1 IFRS 9:", "options": [{"id": "a", "en": "Non-performing", "ru": "Non-performing"}, {"id": "b", "en": "Performing", "ru": "Performing"}, {"id": "c", "en": "Under performing", "ru": "Under performing"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "b", "section": null}, {"num": 12, "id": "q12", "en": "In bank operations, Loans to companies are:", "ru": "Кредиты компаниям для банка — это:", "options": [{"id": "a", "en": "Interest bearing assets", "ru": "Процентные активы"}, {"id": "b", "en": "Non-interest bearing assets", "ru": "Безпроцентные активы"}, {"id": "c", "en": "Real assets", "ru": "Реальные активы"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "a", "section": null}, {"num": 13, "id": "q13", "en": "SICR (significant increase in credit risk):", "ru": "SICR:", "options": [{"id": "a", "en": "Activates Stage 2 measurement", "ru": "Активирует Stage 2"}, {"id": "b", "en": "Activates Stage 4", "ru": "Активирует Stage 4"}, {"id": "c", "en": "Activates Stage 3", "ru": "Активирует Stage 3"}, {"id": "d", "en": "Not related to credit risk", "ru": "Не связан с кредитным риском"}], "correct": "a", "section": null}, {"num": 14, "id": "q14", "en": "From bank perspective, secured loans:", "ru": "Обеспеченные кредиты для банка:", "options": [{"id": "a", "en": "Are safer than unsecured loans", "ru": "Безопаснее необеспеченных"}, {"id": "b", "en": "Are riskier than unsecured", "ru": "Рискованнее"}, {"id": "c", "en": "Only instrument for SMEs", "ru": "Единственный инструмент для МСП"}, {"id": "d", "en": "None of the above", "ru": "Ни один"}], "correct": "a", "section": null}];
    const OPEN_ITEMS = [];
    const SNA_ITEMS = [];

    const form = document.getElementById('test-form');
    const container = document.getElementById('questions');
    const resultsBox = document.getElementById('results');

    function renderQuestions() {
      container.innerHTML = '';
      let currentSection = '';
      QUESTIONS.forEach((q) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = q.section;
          container.appendChild(h);
        }
        const card = document.createElement('div');
        card.className = 'q';
        card.dataset.id = q.id;
        card.innerHTML = `
          <div class="q-num">Question ${q.num}</div>
          <div class="q-en">${q.en}</div>
          <div class="q-ru">${q.ru}</div>
          <div class="opts">
            ${q.options.map(o => `
              <label class="opt">
                <input type="radio" name="${q.id}" value="${o.id}" />
                <span>
                  <div class="opt-en"><strong>${o.id.toUpperCase()})</strong> ${o.en}</div>
                  <div class="opt-ru">${o.ru}</div>
                </span>
              </label>`).join('')}
          </div>
          ${q.explain_ru ? `<details class="solution"><summary>📗 Решение</summary><div class="howto">${q.explain_ru}</div></details>` : ''}
          <div class="feedback" hidden></div>`;
        container.appendChild(card);
      });
    }

    function renderOpen() {
      if (!OPEN_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'Open questions';
      container.appendChild(h);
      OPEN_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-num">${item.title_en || item.title_ru}</div>
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <div class="brief-answer"><div class="brief-label">Sample answer (EN)</div><div class="brief-text"></div></div>
          <textarea name="open_${idx}" placeholder="Your answer..."></textarea>`;
        const brief = block.querySelector('.brief-text');
        const sampleRu = item.sample_en && item.sample_ru ? '\\n\\n—\\n\\n' + item.sample_ru : '';
        brief.textContent = (item.sample_en || item.sample_ru || '') + sampleRu;
        container.appendChild(block);
      });
    }

    function renderSna() {
      if (!SNA_ITEMS.length) return;
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = 'SNA — calculations';
      container.appendChild(h);
      SNA_ITEMS.forEach((item, idx) => {
        const block = document.createElement('div');
        block.className = 'open-block';
        block.innerHTML = `
          <div class="q-en">${item.en}</div>
          <div class="q-ru">${item.ru}</div>
          <input type="text" name="sna_${idx}" style="width:100%;padding:0.65rem;border:1px solid #ddd;border-radius:8px;margin-top:0.5rem;" placeholder="Your answer..." />
          <div class="feedback" hidden></div>`;
        block.dataset.expected = item.expected;
        block.dataset.accept = JSON.stringify(item.accept || []);
        container.appendChild(block);
      });
    }

    function normalize(val) {
      return String(val || '').trim().toLowerCase().replace(/\\s+/g, ' ');
    }

    function checkSnaAnswer(expected, accept, user) {
      const n = normalize(user);
      if (!n) return null;
      const variants = [expected, ...(accept || [])].map(normalize);
      return variants.some(v => n === v || n.includes(v) || v.includes(n));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let unanswered = 0;
      let correct = 0;
      let wrong = 0;
      const warnEl = document.getElementById('warn-text');

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        card.classList.remove('unanswered', 'correct', 'wrong');
        const fb = card.querySelector('.feedback');
        fb.hidden = true;
        fb.textContent = '';
        card.querySelectorAll('label.opt').forEach((lbl) => {
          lbl.classList.remove('result-opt');
          lbl.style.background = '';
          lbl.querySelector('input').disabled = false;
        });
        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
        }
      });

      if (unanswered > 0) {
        resultsBox.classList.remove('visible');
        warnEl.hidden = false;
        warnEl.textContent = `Ответьте на все вопросы с вариантами (${unanswered} без ответа).`;
        const first = container.querySelector('.q.unanswered');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      warnEl.hidden = true;

      QUESTIONS.forEach((q) => {
        const card = container.querySelector(`[data-id="${q.id}"]`);
        const selected = form.querySelector(`input[name="${q.id}"]:checked`);
        const fb = card.querySelector('.feedback');
        fb.hidden = false;
        card.classList.remove('unanswered', 'correct', 'wrong');

        if (!selected) {
          unanswered++;
          card.classList.add('unanswered');
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Ответ не выбран. Правильный: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>';
          return;
        }

        const ok = selected.value === q.correct;
        if (ok) {
          correct++;
          card.classList.add('correct');
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          wrong++;
          card.classList.add('wrong');
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Ваш ответ: <mark class="wrong-mark">' + selected.value.toUpperCase() +
            '</mark>. Correct: <mark class="correct-mark">' + q.correct.toUpperCase() + '</mark>' +
            (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        }

        card.querySelectorAll('label.opt').forEach((lbl) => {
          const inp = lbl.querySelector('input');
          lbl.classList.add('result-opt');
          if (inp.value === q.correct) lbl.style.background = '#e8f8ef';
          if (inp.checked && inp.value !== q.correct) lbl.style.background = '#fdecea';
          inp.disabled = true;
        });
      });

      container.querySelectorAll('.open-block .feedback').forEach((fb, i) => {
        const block = fb.closest('.open-block');
        if (!block.dataset.expected) return;
        const inp = block.querySelector('input');
        const ok = checkSnaAnswer(block.dataset.expected, JSON.parse(block.dataset.accept || '[]'), inp.value);
        fb.hidden = false;
        if (ok === null) {
          fb.className = 'feedback bad';
          fb.innerHTML = '⚠️ Пустой ответ. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        } else if (ok) {
          fb.className = 'feedback ok';
          fb.innerHTML = '✓ Верно' + (q.explain_ru ? '<div class="explain">' + q.explain_ru + '</div>' : '');
        } else {
          fb.className = 'feedback bad';
          fb.innerHTML = '✗ Неверно. Эталон: <mark class="correct-mark">' + block.dataset.expected + '</mark>';
        }
      });

      const total = QUESTIONS.length;
      let score = correct * SCORING.correct + wrong * SCORING.wrong;
      if (SCORING.max !== null) score = Math.max(0, Math.min(SCORING.max, score));

      document.getElementById('score-text').textContent =
        `Результат: ${correct} из ${total} (${Math.round(correct/total*100)}%)`;
      document.getElementById('score-detail').textContent =
        SCORING.correct !== 1 || SCORING.wrong !== 0
          ? `Баллы: ${score.toFixed(1)} · Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`
          : `Верно: ${correct} · Неверно: ${wrong} · Без ответа: ${unanswered}`;

      resultsBox.classList.add('visible');
      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      form.reset();
      resultsBox.classList.remove('visible');
      document.getElementById('warn-text').hidden = true;
      renderQuestions();
      renderOpen();
      renderSna();
      
    });

    renderQuestions();
    renderOpen();
    renderSna();
    
  </script>
</body>
</html>
